// Standard normal sample (Box–Muller), clamped to ±3σ so one week can't produce absurd moves.
function randn(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return Math.max(-3,Math.min(3,z));
}
// One week of price movement: a log-normal step (normally distributed % return) with σ = vol/√3,
// the same average swing size as the old uniform ±vol, so small moves are common and big ones rare.
// A gentle pull toward the anchor price keeps prices wandering without drifting to $1 or the moon.
function priceStep(price,vol,anchor){
  const sigma=vol/Math.sqrt(3);
  const pull=0.05*Math.log(anchor/price);
  return price*Math.exp(pull-sigma*sigma/2+sigma*randn());
}
function genHistory(endPrice,vol,points){
  let price=endPrice;
  const arr=[];
  for(let i=0;i<points;i++){
    arr.unshift(Math.round(price));
    price=Math.max(priceStep(price,vol,endPrice),endPrice*0.15);
  }
  arr[arr.length-1]=Math.round(endPrice);
  return arr;
}
function updateMarket(){
  state.week=(state.week||0)+1;
  // Last week's values, for the week-over-week changes in the board centre.
  state.prevMortgageRate=mortgageRate(); state.prevBankRate=bankRate(); state.prevRentRate=rentRate();
  MARKET.forEach(m=>{
    m.prevPrice=m.price;
    m.price=Math.max(Math.round(priceStep(m.price,m.vol,m.anchor||m.basePrice0)),Math.round(m.basePrice0*0.15),1);
    m.high52=Math.max(m.high52||m.price,m.price);
    m.low52=Math.min(m.low52||m.price,m.price);
    m.history.push(m.price);
    if(m.history.length>15) m.history.shift();
  });
}
// Listing price vs market value, bell-curved so offers aren't always bargains: FOR SALE centres on the
// 1% under market value (±9%), WANTED buyers on 5% above it (±8%) — sometimes a buyer lowballs you.
function listingPriceFactor(kind){
  return kind==="ask"?Math.max(0.8,Math.min(1.2,0.99+0.09*randn())):Math.max(0.9,Math.min(1.3,1.05+0.08*randn()));
}
function spawnListing(){
  const pool=MARKET.filter(m=>m.type==="realestate");
  const m=pool[Math.floor(Math.random()*pool.length)];
  const kind=Math.random()<0.6?"ask":"bid";
  const qty=1;
  const price=Math.round(m.price*listingPriceFactor(kind));
  const turnsLeft=2+Math.floor(Math.random()*3);
  state.listings.push({id:"L"+(state.listingSeq++),instId:m.id,kind,price,qty,turnsLeft,downPct:pickDownPct(),costPct:pickCostPct(),img:Math.floor(Math.random()*3)});
}
function tickListings(){
  // Pacing (tuned by bot simulation for ~30-minute games): each week an offer may get snapped up by
  // someone else (30%), and about 1.5 new offers appear.
  state.listings.forEach(l=>{
    l.turnsLeft--;
    if(Math.random()<speedCfg().snap) l.qty=0;
  });
  state.listings=state.listings.filter(l=>l.qty>0&&l.turnsLeft>0);
  const cfg=speedCfg(), maxListings=cfg.max;
  let tries=cfg.p.reduce((n,pr)=>n+(Math.random()<pr?1:0),0);
  for(let i=0;i<tries&&state.listings.length<maxListings;i++) spawnListing();
}
function startGame(){
  if(state.online&&!state.isHost) return;

    m.price=m.type==="stock"?Math.max(1,Math.round(m.designPrice*Math.exp(0.18*randn()))):m.designPrice;
    m.basePrice0=m.price; m.anchor=m.price; m.div=m.designDiv;
    m.history=genHistory(m.price,m.vol,15);
    m.prevPrice=m.history[m.history.length-2];
    m.high52=Math.max(...m.history);
    m.low52=Math.min(...m.history);
  });
  state.qty={}; state.flashQty=1; state.listings=[]; state.listingSeq=1; state.loanTakeAmt=1000; state.loanPayAmt=1000; state.selectedStock=null;
  MARKET.forEach(m=>{state.qty[m.id]=1;});
  for(let i=0;i<4;i++) spawnListing();
  state.players=state.names.map((nm,i)=>{
    const pr=PROFESSIONS[Math.floor(Math.random()*PROFESSIONS.length)];
    return {...professionSheet(pr),model:ensureTokens()[i]||TOKEN_ORDER[i%4],facing:"down",profession:pr.name,name:nm.trim()||("Player "+(i+1)),cash:pr.savings+(speedCfg().bonus||0),kids:0,holdings:{},bankLoanBal:0,bankLoanPmt:0,pos:0,escaped:false,bankrupt:false,place:null,color:COLORS[i]};
  });
  state.phase="playing"; state.alert=null; state.lastRoll=null; state.week=0; state.mortgageRate=startMortgageRate(); state.prevMortgageRate=state.mortgageRate; state.bankRate=BANK_RATE0; state.prevBankRate=BANK_RATE0; state.rentRate=speedCfg().rent||RENT_RATE0; state.prevRentRate=state.rentRate; state.rentAdj={}; refreshRents(); state.lastMarketEvent=null; state.turn=0; state.pending=null; state.billQueue=[]; state.hasRolled=false; state.log=[]; state.viewTab=0;
  log("Game started. "+state.players[0].name+" goes first. Market is open.");
  if(state.online) pushState();
  render();
}
function activePlayers(){return state.players.filter(isRacing);}
// A bill that arrived while another prompt was open (a negative payday passed on the way to a square
// that also asks something) waits in state.billQueue and becomes the prompt once that one is resolved.
function promoteBill(){ if(!state.pending&&state.billQueue&&state.billQueue.length) state.pending=state.billQueue.shift(); }
function syncRender(){ promoteBill(); if(state.online) pushState(); render(); }
const DOWNSIZED_SKIPS=2;
// Flash-deal lock-up (stocks only): shares bought at a flash-deal discount can't be sold for the buyer's next 3 turns, so
// the discount is a bet on where the price goes, not an instant flip. p.turnsTaken counts the player's turns
// (skipped ones too); p.locks[id] = [{qty, until: turnsTaken value when they unlock}].
const FLASH_LOCK_TURNS=3;
function activeLocks(p,id){const t=p.turnsTaken||0; return ((p.locks||{})[id]||[]).filter(l=>l.until>t);}
function lockedQty(p,id){return activeLocks(p,id).reduce((s,l)=>s+l.qty,0);}
function lockTurnsLeft(p,id){const ls=activeLocks(p,id); return ls.length?Math.min(...ls.map(l=>l.until))-(p.turnsTaken||0):0;}
function sellableQty(p,id){return Math.max(0,(p.holdings[id]||0)-lockedQty(p,id));}
function addLock(p,id,qty){p.locks=p.locks||{}; p.locks[id]=[...activeLocks(p,id),{qty,until:(p.turnsTaken||0)+FLASH_LOCK_TURNS}];}
function nextTurn(){
  updateMarket();
  renewLeases();
  tickListings();
  state.hasRolled=false;
  checkAllWins(); checkGameOver();
  if(state.phase!=="playing"){ syncRender(); return; }
  // Downsized players sit out their skipped turns (each skip uses one up), like the original game.
  for(;;){
    do{ state.turn=(state.turn+1)%state.players.length; }while(!isRacing(state.players[state.turn]));
    const np=state.players[state.turn];
    np.turnsTaken=(np.turnsTaken||0)+1;
    if(!(np.skipTurns>0)) break;
    np.skipTurns--;
    // Alone, a skipped turn still costs a week: the market moves on without you.
    if(state.players.length===1){ updateMarket(); renewLeases(); }
    log(""+np.name+" is downsized and sits out this turn"+(np.skipTurns?" ("+np.skipTurns+" more to go).":" — back next round."));
  }
  state.pending=null; state.billQueue=[]; syncRender();
}
function endTurn(){
  if(state.online&&state.myIdx!==state.turn) return;
  if(state.pending||!state.hasRolled||(state.billQueue&&state.billQueue.length)) return;
  nextTurn();
}
// n = number of dice. Two dice are only allowed while the player has charity turns left; every
// roll (1 or 2 dice) during that window uses one of them up.
function rollDice(n){
  if(state.online&&state.myIdx!==state.turn) return;
  if(state.hasRolled||state.pending) return;
  const p=state.players[state.turn], from=p.pos;
  const charity=(p.charityTurns||0)>0;
  n=n===2&&charity?2:1;
  const dice=Array.from({length:n},()=>1+Math.floor(Math.random()*6));
  const roll=dice.reduce((a,b)=>a+b,0);
  if(charity) p.charityTurns--;
  // Real-game rule: you're paid whenever you pass a Payday square, not only when you land on one
  // (landing is handled by resolveSpace).
  for(let s=1;s<roll;s++){ if(BOARD[(p.pos+s)%BOARD.length]==="payday") collectPayday(p,true); }
  p.pos=(p.pos+roll)%BOARD.length;
  p.facing=stepDir((p.pos-1+BOARD.length)%BOARD.length,p.pos);
  const sp=BOARD[p.pos];
  log(p.name+" rolled "+(n===2?dice.join(" + ")+" = "+roll:"a "+roll)+" -> landed on "+sp+"."+(charity?" ("+p.charityTurns+" charity turn"+(p.charityTurns===1?"":"s")+" left)":""));
  state.hasRolled=true;
  state.lastRoll={id:Date.now()+"-"+Math.random().toString(36).slice(2,7),dice,who:state.turn,from,to:p.pos};
  resolveSpace(p,sp);
  syncRender();
}
// A negative cash flow is a bill you can't refuse. With enough cash it is paid at once. Otherwise it
// becomes a bill the player has to pay before ending the turn: nothing is sold automatically, the
// player decides what to sell (or picks "Sell assets and pay" in the bill popup).
function collectPayday(p,passing){
  if(!isRacing(p)) return;
  const inc=Math.round(monthlyCashflow(p));
  if(inc>=0){ sfx("payday"); p.cash+=inc; log(p.name+(passing?" passes":" lands on")+" Payday: collects "+fmt(inc)+" net cash flow."); checkWin(p); return; }
  const owe=-inc;
  if(p.cash>=owe){ sfx("cost"); p.cash-=owe; log(p.name+(passing?" passes":" lands on")+" Payday: negative cash flow, pays "+fmt(owe)+"."); return; }
  sfx("cost");
  log(p.name+(passing?" passes":" lands on")+" Payday: negative cash flow, owes "+fmt(owe)+" but has only "+fmt(p.cash)+" in cash.");
  state.billQueue=state.billQueue||[];
  const prev=state.billQueue.find(b=>b.payday);
  if(prev){ prev.amt+=owe; prev.desc=paydayBillDesc(prev.amt); return; }
  state.billQueue.push({kind:"bill",payday:true,amt:owe,what:"a negative payday",title:"Negative payday",desc:paydayBillDesc(owe)});
}
function paydayBillDesc(amt){
  return "Your expenses are larger than your income this month. The bank won't lend while your cash flow is negative, so sell assets to raise the cash, then pay.";
}
// Landing on a space resolves its effect but no longer auto-advances the turn — the market
// stays open to everyone at all times, and the current player ends their own turn explicitly
// (via the End Turn button) once they're done rolling/trading, so nobody gets cut off mid-turn.
function resolveSpace(p,sp){
  if(sp==="payday"){
    collectPayday(p,false);
  }else if(sp==="doodad"){
    const d=DOODADS[Math.floor(Math.random()*DOODADS.length)];
    log(p.name+" hit a doodad: "+d.name+" ("+fmt(d.cost)+").");
    sfx("event");
    state.pending={kind:"bill",amt:d.cost,what:"a doodad ("+d.name+")",title:"Doodad: "+d.name,desc:"An unexpected expense — you have to pay for it."};
  }else if(sp==="downsized"){
    const loss=totalExpenses(p);
    p.skipTurns=DOWNSIZED_SKIPS;
    log(p.name+" got downsized. Owes "+fmt(loss)+" (a month of expenses) and loses the next "+DOWNSIZED_SKIPS+" turns.");
    sfx("event");
    state.pending={kind:"bill",amt:loss,what:"a month of expenses after being downsized",title:"Downsized",desc:"You lost your job for a while: pay one month of expenses and sit out your next "+DOWNSIZED_SKIPS+" turns."};
  }else if(sp==="baby"){
    if(p.kids<3){p.kids++; log(p.name+" had a baby. Monthly expenses up "+fmt(p.childExp)+".");}
    else log(p.name+" landed on Baby but already has 3 kids.");
    checkWin(p);
  }else if(sp==="charity"){
    state.pending={kind:"charity",p};
  }else if(sp==="market"){
    const m=MARKET[Math.floor(Math.random()*MARKET.length)];
    // Offer price vs market follows a bell curve centred on an 8% discount (σ 12%, clamped −20%…+35%):
    // about 3 in 4 offers are bargains, the rest fair or overpriced. The game never says which — the player has to compare with the market.
    const discountPct=Math.round(Math.max(-20,Math.min(35,8+12*randn())));
    const dealPrice=Math.max(1,Math.round(m.price*(1-discountPct/100)));
    const qtyMax=m.type==="stock"?null:1;
    state.flashQty=1;
    sfx("deal");
    state.pending={kind:"flashdeal",p,id:m.id,dealPrice,qtyMax,// Property flash deals come with their own lease rent: market rent ±5%.
      rent:m.type==="realestate"?Math.round(m.rent*rnd(0.95,1.05)/5)*5:null,img:m.type==="realestate"?Math.floor(Math.random()*3):null,downPct:m.type==="realestate"?pickDownPct():null,costPct:m.type==="realestate"?pickCostPct():null};
  }else if(sp==="event"){
    const ev=pickEvent();
    state.nextBill=null;
    const desc=ev.run(state.players,p);
    log("Event — "+ev.name+": "+desc);
    checkAllWins();
    sfx("event");
    if(ev.type!=="personal") state.lastMarketEvent={name:ev.name,desc,week:state.week||0};
    const bill=state.nextBill; state.nextBill=null;
    state.pending=bill?{kind:"bill",amt:bill.amt,what:bill.what,title:ev.name,desc}:{kind:"eventinfo",ev:{name:ev.name,desc}};
  }
}
// Real-game rule: donate 10% of total income (salary + passive) to roll 1 or 2 dice for 3 turns.
const CHARITY_TURNS=3;
function charityAmount(p){return Math.round((p.salary+passiveIncome(p))*0.1);}
// pending.p is a serialized copy once state has gone over the network, so always act on the
// real entry in state.players.
function charityPay(ok){
  if(state.online&&state.myIdx!==state.turn) return;
  if(!state.pending||state.pending.kind!=="charity") return;
  const p=state.players[state.turn];
  const amt=charityAmount(p);
  if(!ok&&askLoanConfirm(state.turn,{title:"Donate "+fmt(amt)+" to charity",due:amt,confirmLabel:"Take {loan} loan and donate",run:()=>charityPay(true)})) return;
  payCash(p,amt);
  sfx("charity");
  p.charityTurns=CHARITY_TURNS;

function charitySkip(){if(state.online&&state.myIdx!==state.turn)return;if(!state.pending||state.pending.kind!=="charity")return;log(state.pending.p.name+" skipped charity.");state.pending=null;syncRender();}
function continueEvent(){if(state.online&&state.myIdx!==state.turn)return;if(!state.pending||state.pending.kind!=="eventinfo")return;state.pending=null; syncRender();}
function setFlashQty(v,rerender){

}
// Most units the player can pay for from cash alone (no loan).
function flashMaxCash(){

  const unit=cashDue(m,pd.dealPrice,pd.downPct);
  return Math.max(1,Math.min(pd.qtyMax||Infinity,Math.floor(Math.max(0,p.cash)/Math.max(1,unit))));
}
// Live cost preview for the flash deal: the total and, for property, the terms and cash flow. If cash
// runs short, pressing Buy opens the loan popup (askLoanConfirm) instead.
function flashPreviewHTML(){

  const row=(a,b,c)=>`<div class="fp-row${c?" "+c:""}"><span>${a}</span><b>${b}</b></div>`;
  return row(qty+" × "+fmt(pd.dealPrice),fmt(cost),"fp-total")
    +(m.type==="realestate"?row("Cash down ("+pd.downPct+"%)",fmt(due))+row("Mortgage ("+(100-pd.downPct)+"%)",fmt(mort))+row("Rent ("+((pd.rent==null?m.rent:pd.rent)*12/Math.max(1,m.anchor||m.price)*100).toFixed(1)+"%/yr, "+LEASE_WEEKS+"-week lease)",fmt(qty*(pd.rent==null?m.rent:pd.rent))+"/mo")+row("Running costs ("+pd.costPct+"% of rent)","−"+fmt(costsFor(m,qty,pd.costPct))+"/mo")+row("Mortgage payment ("+mortgageRate().toFixed(1)+"%)","−"+fmt(mortgagePmtFor(mort))+"/mo")+row("Cash flow",sgn(cfl)+"/mo",cfl<0?"fp-bad":""):"")
;
}
function buyFlashDeal(ok){
  if(state.online&&state.myIdx!==state.turn) return;

  const pd=state.pending, p=state.players[state.turn], m=MARKET.find(x=>x.id===pd.id), qty=state.flashQty||1;

  const note=buyAsset(p,m,qty,pd.dealPrice,pd.downPct,pd.costPct,pd.rent);
  // Only stocks are locked: they could otherwise be flipped straight back into the always-open stock
  // market. Property can only be sold into a WANTED listing, so it isn't locked.
  if(m.type==="stock") addLock(p,m.id,qty);
  log(p.name+" grabbed a flash deal: "+qty+"x "+m.name+" @ "+fmt(pd.dealPrice)+note+(m.type==="stock"?" Locked for "+FLASH_LOCK_TURNS+" turns.":""));

function passFlash(){if(state.online&&state.myIdx!==state.turn)return;if(!state.pending||state.pending.kind!=="flashdeal")return;log(state.pending.p.name+" passed on the flash deal.");state.pending=null;syncRender();}
function actingIdx(){ return state.online?state.myIdx:state.turn; }

// ---- Buying & selling assets ----
// Real estate works like the board game: you pay the offer's down payment in cash and the rest becomes a
// mortgage on that property (a liability with no monthly payment — the rent is its net cash flow).
// When sold, that property's share of the mortgage is paid off out of the sale and you keep the rest.
// p.reMortgage = {propertyId: total mortgage balance across the units held}.
function sgn(v){return (v>=0?"+":"−")+fmt(Math.abs(v));}
function reDown(cost,downPct){return Math.round(cost*(downPct==null?10:downPct)/100);}
function reMortgageTotal(p){return Object.values(p.reMortgage||{}).reduce((a,b)=>a+b,0);}
function cashDue(m,cost,downPct){return m.type==="realestate"?reDown(cost,downPct):cost;}
function mortgageShare(p,id,qty){
  const held=p.holdings[id]||0, bal=(p.reMortgage||{})[id]||0;
  return held?Math.round(bal*Math.min(qty,held)/held):0;
}
// Every purchase is recorded for the statement's "My Holdings" charts: p.costBasis[id] is the total
// price paid for the units still held (average-cost), p.buyMarks[id] the recent buys as {w:week,price}.
function recordBuy(p,id,qty,price){
  p.costBasis=p.costBasis||{}; p.buyMarks=p.buyMarks||{};
  p.costBasis[id]=(p.costBasis[id]||0)+price*qty;
  p.buyMarks[id]=[...(p.buyMarks[id]||[]),{w:state.week||0,price}].slice(-10);
}
function buyAsset(p,m,qty,price,downPct,costPct,rent){
  sfx("buy");
  const cost=price*qty;
  recordBuy(p,m.id,qty,price);
  if(m.type!=="realestate"){ payCash(p,cost); p.holdings[m.id]=(p.holdings[m.id]||0)+qty; return " ("+fmt(cost)+")."; }
  const down=reDown(cost,downPct), mort=cost-down;
  payCash(p,down);
  const oldBal=(p.reMortgage||{})[m.id]||0;
  p.reRate=p.reRate||{}; p.reRate[m.id]=oldBal+mort>0?(oldBal*lockedRate(p,m.id)+mort*mortgageRate())/(oldBal+mort):mortgageRate();
  p.reMortgage=p.reMortgage||{}; p.reMortgage[m.id]=oldBal+mort;
  const held=p.holdings[m.id]||0, cp=costPct==null?25:costPct;
  p.reCostPct=p.reCostPct||{}; p.reCostPct[m.id]=held?((p.reCostPct[m.id]==null?25:p.reCostPct[m.id])*held+cp*qty)/(held+qty):cp;
  p.holdings[m.id]=(p.holdings[m.id]||0)+qty;
  addLease(p,m,qty,rent);
  return " — "+fmt(down)+" down ("+(downPct==null?10:downPct)+"%), "+fmt(mort)+" mortgage.";
}
// If a property sells for less than its mortgage, the shortfall comes out of cash (auto-loan if needed).
function sellAsset(p,m,qty,price){
  sfx("sell");
  const sale=price*qty, payoff=mortgageShare(p,m.id,qty);
  if(p.costBasis&&p.costBasis[m.id]) p.costBasis[m.id]-=Math.round(p.costBasis[m.id]*qty/p.holdings[m.id]);
  p.cash+=sale; p.holdings[m.id]-=qty;
  if(m.type==="realestate") removeLeaseUnits(p,m.id,qty);
  if(!p.holdings[m.id]){ if(p.costBasis) delete p.costBasis[m.id]; if(p.buyMarks) delete p.buyMarks[m.id]; }
  if(payoff){ p.reMortgage[m.id]-=payoff; payCash(p,payoff); }
  if(!p.holdings[m.id]&&p.reMortgage) delete p.reMortgage[m.id];
  if(!p.holdings[m.id]&&p.reCostPct) delete p.reCostPct[m.id];
  if(!p.holdings[m.id]&&p.reRate) delete p.reRate[m.id];
  return payoff?" — "+fmt(sale)+" sale, "+fmt(payoff)+" mortgage paid off, "+(sale>=payoff?fmt(sale-payoff)+" to you.":"you cover the "+fmt(payoff-sale)+" shortfall."):" ("+fmt(sale)+").";
}
function buyListing(id,ok){
  const p=state.players[actingIdx()], l=state.listings.find(x=>x.id===id);
  if(!p||!isRacing(p)||!l||l.kind!=="ask"){return;}
  const m=MARKET.find(x=>x.id===l.instId);
  const buyQty=l.qty, due=cashDue(m,buyQty*l.price,l.downPct);
  if(!ok&&askLoanConfirm(actingIdx(),{title:"Buy "+buyQty+"x "+m.name+" @ "+fmt(l.price),due,incomeDelta:incomeDeltaBuy(m,buyQty,l.price,l.downPct,l.costPct),confirmLabel:"Take {loan} loan and buy",run:()=>buyListing(id,true)})) return;
  const note=buyAsset(p,m,buyQty,l.price,l.downPct,l.costPct); l.qty=0;
  log(p.name+" grabbed "+buyQty+"x "+m.name+" off the floor @ "+fmt(l.price)+note);
  checkWin(p);
  state.listings=state.listings.filter(x=>x.qty>0);

}
function sellListing(id,ok){
  const p=state.players[actingIdx()], l=state.listings.find(x=>x.id===id);
  if(!p||!isRacing(p)||!l||l.kind!=="bid"){return;}
  const m=MARKET.find(x=>x.id===l.instId);
  const sellQty=Math.min(l.qty,sellableQty(p,l.instId));
  if(sellQty<=0){log(p.name+(p.holdings[l.instId]?"'s "+m.name+" is locked from a flash deal for "+lockTurnsLeft(p,l.instId)+" more turn(s).":" has none of "+m.name+" to sell into that request."));}
  else{
    const shortfall=mortgageShare(p,m.id,sellQty)-sellQty*l.price;
    if(!ok&&askLoanConfirm(actingIdx(),{title:"Sell "+m.name+" below its mortgage",due:shortfall,incomeDelta:incomeDeltaSell(p,m,sellQty),confirmLabel:"Sell anyway",run:()=>sellListing(id,true)})) return;
    const note=sellAsset(p,m,sellQty,l.price); l.qty-=sellQty;
    log(p.name+" sold "+sellQty+"x "+m.name+" into a buy request @ "+fmt(l.price)+note);
  }
  state.listings=state.listings.filter(x=>x.qty>0);
  syncRender();
}

// Updates the live "= $total" under the input directly (no re-render, so typing keeps focus).

function takeLoan(idx,ok){
  if(state.online&&state.myIdx!==idx) return;
  const p=state.players[idx]; if(!p||!isRacing(p)) return;
  const amt=Math.max(1000,Math.round((state.loanTakeAmt||1000)/1000)*1000);

function setLoanTakeAmt(v){state.loanTakeAmt=Math.max(1000,Math.round((parseInt(v)||1000)/1000)*1000);}
function setLoanPay(v){state.loanPayAmt=Math.max(1,parseInt(v)||1000);}

// ---- Paying off liabilities ----
// Every liability can be paid down from cash, partly or in full. Personal debts' monthly payments
// shrink in proportion to the balance (paying one off removes that expense); the bank loan stays at
// balance × bank rate and is paid in $1,000 steps unless clearing it; property mortgages have no monthly
// payment, so paying one down just means you keep more when the property sells.
const PERSONAL_DEBTS={mortgage:["Home Mortgage","mortgageBal","mortgagePmt"],car:["Car Loan","carBal","carPmt"],cc:["Credit Card","ccBal","ccPmt"],retail:["Retail Debt","retailBal","retailPmt"]};
function debtList(p){
  const list=Object.entries(PERSONAL_DEBTS).map(([key,[name,b,m]])=>({key,name,bal:p[b],pmt:p[m]}));
  list.push({key:"bank",name:"Bank Loan",bal:p.bankLoanBal,pmt:p.bankLoanPmt});
  if(p.leftMortgage&&p.leftMortgage.bal>0) list.push({key:"left",name:"Leftover Mortgage",bal:p.leftMortgage.bal,pmt:leftPmt(p)});
  Object.entries(p.reMortgage||{}).forEach(([id,bal])=>list.push({key:"re:"+id,name:"Mortgage — "+MARKET.find(m=>m.id===id).name,bal,pmt:mortgagePmtFor(bal,lockedRate(p,id))}));
  return list.filter(d=>d.bal>0);
}
// Pays amt of cash toward one debt (key as in debtList). Used by the Finance panel and forced sales.
function applyDebtPayment(p,key,amt){
  p.cash-=amt;
  if(key==="bank"){ p.bankLoanBal-=amt; p.bankLoanPmt=bankPmtFor(p.bankLoanBal); }
  else if(key==="left"){ p.leftMortgage.bal-=amt; if(p.leftMortgage.bal<=0) delete p.leftMortgage; }
  else if(key.startsWith("re:")){ const id=key.slice(3); p.reMortgage[id]-=amt; if(p.reMortgage[id]<=0) delete p.reMortgage[id]; }
  else{ const [,b,m]=PERSONAL_DEBTS[key]; p[m]=Math.round(p[m]*(p[b]-amt)/p[b]); p[b]-=amt; }
}
function selectedDebt(p){const list=debtList(p); return list.find(d=>d.key===state.debtSel)||list[0]||null;}
function selectDebt(key){state.debtSel=key; render();}
function payDebt(idx,all){
  if(state.online&&state.myIdx!==idx) return;
  const p=state.players[idx], d=selectedDebt(p); if(!d) return;
  let amt=all?d.bal:Math.min(state.loanPayAmt||1000,d.bal);
  if(d.key==="bank"&&amt<d.bal) amt=Math.floor(amt/1000)*1000;
  if(amt<=0||amt>p.cash){log(p.name+" doesn't have "+fmt(Math.max(amt,1000))+" cash to pay toward "+d.name+".");render();return;}
  applyDebtPayment(p,d.key,amt);
  sfx("paid");
  const saved=d.pmt-(debtList(p).find(x=>x.key===d.key)||{pmt:0}).pmt;
  log(p.name+(amt===d.bal?" paid off their "+d.name+" ("+fmt(amt)+")":" paid "+fmt(amt)+" toward their "+d.name)+(saved>0&&!d.key.startsWith("re:")?" — expenses down "+fmt(saved)+"/mo.":"."));
  checkWin(p); if(state.online) pushState(); render();
}

// ---- Loan confirmation ----
// A choice the player makes never takes a loan silently: if paying `due` cash would dip below $0
// (auto-loan, rounded up to $1,000), show the impact and wait for
// Confirm. state.confirm is local to this browser (never synced); `run` re-runs the action with ok=true.
function monthlyCashflow(p){return p.salary+passiveIncome(p)-totalExpenses(p);}
// Bank lending rule: while your monthly cash flow is $0 or more the bank lends any amount, even if the
// new payment (balance × bank rate) takes your cash flow below $0. Once it is negative the bank lends
// nothing, whatever the loan is for. Bills you can't pay then force a sale (forceSellHTML), and if that
// can't bring cash flow back to $0 you are bankrupt. max = Infinity means no cap.
function loanCheck(p,loan,incomeDelta){
  const now=monthlyCashflow(p), cf=now+(incomeDelta||0);
  const cfAfter=L=>cf-(bankPmtFor(p.bankLoanBal+L)-p.bankLoanPmt);
  if(now>=0) return {ok:true,max:Infinity,newCf:cfAfter(loan),negative:cfAfter(loan)<0};
  return {ok:false,max:0,newCf:cfAfter(loan),negative:false};   // negative cash flow: no loans at all
}
function askLoanConfirm(idx,o){
  const p=state.players[idx]; if(!p) return false;
  const auto=p.cash-o.due<0?Math.ceil((o.due-p.cash)/1000)*1000:0;
  if(auto<=0) return false;
  if(!loanCheck(p,auto,o.incomeDelta||0).ok) sfx("denied");
  state.confirm={idx,title:o.title,due:o.due,auto,loan:auto,cashDelta:auto-o.due,incomeDelta:o.incomeDelta||0,confirmLabel:(o.confirmLabel||"Confirm").replace("{loan}",fmt(auto)),run:o.run};
  render(); return true;
}
function confirmYes(){const c=state.confirm; state.confirm=null; if(c&&c.run) c.run(); else render();}
function confirmNo(){state.confirm=null; render();}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&state.confirm) confirmNo(); });
// ---- Forced sale (the player picks what to sell) ----
// When a bill can't be paid and the bank won't lend, the player chooses which assets to sell, stocks
// and/or property, any quantity of each (state.forceSell.sel = {id: qty}, local to this browser).
// Stocks go at the market price; property at half value, paid in full, its mortgage kept as a leftover
// debt. Real Cashflow bankruptcy rule: after the bill is paid, the remaining cash pays down the most
// expensive debts (highest payment per dollar owed, so the bank loan first), only as far as needed to get
// monthly cash flow back to $0. If cash flow is still negative after that, the player is bankrupt. The
// sheet previews the outcome by running the same code on a copy of the player (forceOutcome).
function forceUnitNet(p,m,q){
  if(m.type==="stock") return q*m.price;
  return Math.min(q,p.holdings[m.id]||0)*Math.round(m.price*FIRE_SALE_RE);   // mortgage is kept, not deducted
}
function forceAssets(p){ return MARKET.filter(m=>(p.holdings[m.id]||0)>0); }
function forceSelTotal(p){ const sel=(state.forceSell&&state.forceSell.sel)||{}; return forceAssets(p).reduce((t,m)=>t+forceUnitNet(p,m,Math.min(sel[m.id]||0,p.holdings[m.id])),0); }
function forceSetQty(id,v){ if(!state.forceSell) return; const p=state.players[state.turn], held=(p&&p.holdings[id])||0;
  state.forceSell.sel[id]=Math.max(0,Math.min(held,parseInt(v)||0)); render(); }
function forceToggle(id,on){ const p=state.players[state.turn]; forceSetQty(id,on?(p.holdings[id]||0):0); }
function forceCancel(){ state.forceSell=null; render(); }
// Sells sel ({id: qty}) for player p, pays the bill if the cash covers it, then pays down debts until
// cash flow is back to $0 (or the cash runs out). Works on any player object, so the sheet can run it on
// a copy. Returns {lines, paid, cf}.
function applyForcedSale(p,sel,amt){
  const lines=[];
  forceAssets(p).forEach(m=>{
    const q=Math.min(sel[m.id]||0,p.holdings[m.id]||0); if(!q) return;
    if(m.type==="stock"){ removeUnits(p,m,q); p.cash+=q*m.price; lines.push("Sold "+q+"x "+m.name+" at "+fmt(m.price)+" = "+fmt(q*m.price)); }
    else{ const sale=Math.round(m.price*FIRE_SALE_RE), rate=lockedRate(p,m.id), kept=removeUnits(p,m,q);
      addLeftover(p,kept,rate); p.cash+=q*sale;
      lines.push("Sold "+q+"x "+m.name+" at half value = "+fmt(q*sale)+(kept?"; its "+fmt(kept)+" mortgage stays as a debt":"")); }
  });
  if(p.cash<amt) return {lines,paid:false,cf:monthlyCashflow(p)};
  p.cash-=amt;
  for(let guard=0;guard<20&&monthlyCashflow(p)<0&&p.cash>0;guard++){
    const d=debtList(p).filter(d=>d.pmt>0).sort((a,b)=>b.pmt/b.bal-a.pmt/a.bal).find(d=>d.key!=="bank"||p.cash>=Math.min(1000,d.bal));
    if(!d) break;
    let pay=Math.min(d.bal,p.cash,Math.ceil(-monthlyCashflow(p)/(d.pmt/d.bal))+1);
    if(d.key==="bank"&&pay<d.bal){ pay=Math.min(d.bal,Math.ceil(pay/1000)*1000); if(pay>p.cash) pay=Math.floor(p.cash/1000)*1000; }   // bank loan: $1,000 steps
    if(pay<=0) break;
    applyDebtPayment(p,d.key,pay); lines.push("Paid "+fmt(pay)+" toward "+d.name);
  }
  return {lines,paid:true,cf:monthlyCashflow(p)};
}
// Outcome of a selection, computed on a copy of the player.
function forceOutcome(p,sel,amt){ const copy=JSON.parse(JSON.stringify(p)); const r=applyForcedSale(copy,sel,amt); return {...r,cash:copy.cash}; }
function forceAllSel(p){ const o={}; forceAssets(p).forEach(m=>o[m.id]=p.holdings[m.id]); return o; }
function forceBankrupt(){
  if(state.online&&state.myIdx!==state.turn) return;
  const pd=state.pending, p=state.players[state.turn]; if(!pd||pd.kind!=="bill") return;
  state.forceSell=null; state.pending=null;
  const r=applyForcedSale(p,forceAllSel(p),pd.amt);
  r.lines.forEach(l=>log(p.name+" "+l.charAt(0).toLowerCase()+l.slice(1)+"."));
  goBankrupt(p,pd.what,pd.amt,r.lines);
  checkAllWins(); checkGameOver(); syncRender();
}
function forceSellPay(){
  if(state.online&&state.myIdx!==state.turn) return;
  const pd=state.pending, p=state.players[state.turn]; if(!pd||pd.kind!=="bill"||!state.forceSell) return;
  const sel=state.forceSell.sel, pre=forceOutcome(p,sel,pd.amt);
  if(!pre.paid||pre.cf<0) return;
  const r=applyForcedSale(p,sel,pd.amt);
  r.lines.forEach(l=>log(p.name+" "+l.charAt(0).toLowerCase()+l.slice(1)+"."));
  state.forceSell=null; state.pending=null;
  sfx("cost");
  log(p.name+" paid "+fmt(pd.amt)+" for "+pd.what+". Cash flow is back to "+fmt(r.cf)+"/mo.");
  raiseAlert("Forced sale — "+p.name,[p.name+" couldn't cover "+pd.what+" ("+fmt(pd.amt)+") and the bank wouldn't lend, so they sold assets and paid down debt:",...r.lines]);
  checkAllWins(); checkGameOver(); syncRender();
}

  const stocks=forceAssets(p).filter(m=>m.type==="stock"), props=forceAssets(p).filter(m=>m.type==="realestate");
  const rows=(stocks.length?`<tr class="fs-sec"><td colspan="8">Stocks — sold at the market price</td></tr>`+stocks.map(row).join(""):"")

function confirmHTML(){
  const c=state.confirm; if(!c) return "";
  const p=state.players[c.idx]; if(!p){state.confirm=null; return "";}
  const newBal=p.bankLoanBal+c.loan, newPmt=bankPmtFor(newBal);
  const cf=monthlyCashflow(p), newCf=cf-(newPmt-p.bankLoanPmt)+c.incomeDelta;
  const money=v=>(v<0?"−":"")+fmt(Math.abs(v));
  const arrow=(a,b,goodUp)=>{const cls=b===a?"flat":((b>a)===goodUp?"up":"down"); return `${money(a)} → <span class="${cls}">${money(b)}</span>`;};
  const chk=loanCheck(p,c.loan,c.incomeDelta);
  // A bill the bank won't finance: show what a fire sale could raise instead of loan numbers.
  const fire=c.bill&&!chk.ok;
  let doomed=false;
  const fireValue=MARKET.reduce((t,m)=>{const q=p.holdings[m.id]||0; if(!q) return t; return t+(m.type==="stock"?q*m.price:Math.max(0,Math.round(m.price*FIRE_SALE_RE)*q-mortgageShare(p,m.id,q)));},0);
  doomed=fire&&fireValue<c.due-p.cash&&cf<0;
  return `<div class="confirm-backdrop" onclick="if(event.target===this)confirmNo()">
    <div class="confirm-card${chk.ok?"":" denied"}" role="dialog" aria-modal="true">
      <div class="confirm-head">${!chk.ok&&c.bill?"The bank won't lend — fire sale":!chk.ok?"Loan denied by the bank":c.due!=null?"Not enough cash — you need a bank loan":"Heads up — this takes a bank loan"}</div>
      <h3 style="margin-bottom:8px;">${c.title}</h3>
      ${fire?`<table>
        <tr><td>Total to pay now</td><td class="num"><b>${fmt(c.due)}</b></td></tr>
        <tr><td>Cash on hand</td><td class="num">${fmt(p.cash)}</td></tr>
        <tr class="big"><td>Short by</td><td class="num down">${fmt(c.due-p.cash)}</td></tr>
        <tr><td>A fire sale could raise about</td><td class="num">${fmt(fireValue)}</td></tr>
        <tr><td>Monthly cash flow</td><td class="num ${cf<0?"down":""}">${money(cf)}</td></tr>
      </table>`:`<table>
        ${c.due!=null?`<tr><td>Total to pay now</td><td class="num"><b>${fmt(c.due)}</b></td></tr>
        <tr><td>From your cash</td><td class="num">${fmt(c.due-c.auto)}</td></tr>
        <tr class="big"><td>+ Bank loan for the rest</td><td class="num down">${fmt(c.loan)}</td></tr>
        <tr><td colspan="2" class="muted" style="font-size:11.5px;">You have ${fmt(p.cash)} but need ${fmt(c.due)}. Loans come in $1,000 steps${c.auto-(c.due-p.cash)>0?`, so the extra ${fmt(c.auto-(c.due-p.cash))} stays in your cash`:""}.</td></tr>`
        :`<tr class="big"><td>New bank debt</td><td class="num down">+${fmt(c.loan)}</td></tr>`}
        <tr><td>Loan balance</td><td class="num">${arrow(p.bankLoanBal,newBal,false)}</td></tr>
        <tr><td>Monthly loan payment (${bankRate().toFixed(1)}%)</td><td class="num">${arrow(p.bankLoanPmt,newPmt,false)}</td></tr>
        <tr><td>Cash on hand</td><td class="num">${arrow(p.cash,p.cash+c.cashDelta,true)}</td></tr>
        <tr><td>Monthly cash flow</td><td class="num">${arrow(cf,newCf,true)}</td></tr>
      </table>`}
      ${!fire?"":`<div class="confirm-warn">The bank won't lend you this (your monthly cash flow is already negative). To pay, your assets will be sold in a <b>fire sale</b>: stocks at market price, property at half value. If that isn't enough and your cash flow is negative, you go <b>bankrupt</b>. Cancel to sell things yourself first.</div>${doomed?`<div class="confirm-warn" style="font-weight:bold;">That isn't enough to cover it, so paying now means going bankrupt.</div>`:""}`}
      ${chk.ok||c.bill?"":`<div class="confirm-warn">Your monthly cash flow is negative, so the bank won't lend you anything. Raise it to $0 or more first (pay off debts, or sell assets that lose money each month).</div>`}
      ${chk.ok&&newCf<0?`<div class="confirm-warn">This takes your monthly cash flow below $0 (<b>${money(newCf)}/mo</b>). While it is negative the bank won't lend you more: bills you can't pay will force a fire sale of your assets, and if that isn't enough you go bankrupt.</div>`:""}
      <div class="confirm-actions">
        ${chk.ok||c.bill?`<button onclick="confirmNo()">Cancel</button>
        <button class="${chk.ok?"gold":"sell"}" onclick="confirmYes()">${doomed?"Sell everything and go bankrupt":c.confirmLabel}</button>`:`<button class="primary" onclick="confirmNo()">OK</button>`}

// ---- Charts ----
let chartSeq=0;
function sparklineSVG(history,w,h){
  w=w||640; h=h||190;
  if(!history||history.length<2) return "";
  const compact=h<80, n=history.length;
  const min=Math.min(...history), max=Math.max(...history);
  const span=(max-min)||Math.max(1,max*0.05);
  const lo=min-span*0.1, hi=max+span*0.1;
  const padL=compact?2:48, padR=compact?6:64, padT=compact?4:12, padB=compact?4:24;
  const iw=w-padL-padR, ih=h-padT-padB;
  const x=i=>padL+i*iw/(n-1);
  const y=v=>padT+ih-(v-lo)/(hi-lo)*ih;
  const first=history[0], cur=history[n-1];
  const up=cur>=first;
  const col=up?"#1f9d6e":"#d1453b";
  const id="cg"+(++chartSeq);
  const line=history.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const area=line+`L${x(n-1).toFixed(1)},${padT+ih}L${padL},${padT+ih}Z`;
  const defs=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  const startLine=`<line x1="${padL}" x2="${padL+iw}" y1="${y(first).toFixed(1)}" y2="${y(first).toFixed(1)}" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="4 4"/>`;
  const lastDot=`<circle cx="${x(n-1).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="${compact?5:9}" fill="${col}" fill-opacity=".2"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="${compact?2.5:4}" fill="${col}" stroke="var(--panel)" stroke-width="1.5"/>`;
  if(compact){
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">${defs}${startLine}
      <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${lastDot}</svg>`;
  }
  // Gridlines + y labels at high / mid / low of the data.
  const ticks=[max,(max+min)/2,min];
  const grid=ticks.map(v=>`<line x1="${padL}" x2="${padL+iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="currentColor" stroke-opacity=".12"/>
    <text x="${padL-6}" y="${(y(v)+3.5).toFixed(1)}" font-size="10.5" fill="currentColor" fill-opacity=".6" text-anchor="end">${fmt(v)}</text>`).join("");
  const xl=[[0,(n-1)+"w ago"],[Math.floor((n-1)/2),Math.ceil((n-1)/2)+"w ago"],[n-1,"Now"]];
  const xlabels=xl.map(([i,t],k)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="10.5" fill="currentColor" fill-opacity=".55" text-anchor="${k===0?"start":k===2?"end":"middle"}">${t}</text>`).join("");
  // Per-week dots (green/red vs the previous week) with hover tooltips.
  const dots=history.map((v,i)=>{
    if(i===n-1) return "";
    const prev=i?history[i-1]:v, d=i?Math.round((v-prev)/prev*1000)/10:0;
    const dc=v>=prev?"#1f9d6e":"#d1453b";
    const label=(i===n-1?"Now":(n-1-i)+"w ago")+": "+fmt(v)+(i?" ("+(d>0?"+":"")+d+"%)":"");
    return `<g><circle class="hit" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"><title>${label}</title></circle><circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${dc}" stroke="var(--panel)" stroke-width="1"/></g>`;
  }).join("");
  const tagY=Math.max(padT+9,Math.min(padT+ih-9,y(cur)));
  const tag=`<rect x="${padL+iw+8}" y="${(tagY-10).toFixed(1)}" width="${padR-10}" height="20" rx="5" fill="${col}"/>
    <text x="${padL+iw+8+(padR-10)/2}" y="${(tagY+4).toFixed(1)}" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">${fmt(cur)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Price history, now ${fmt(cur)}">${defs}${grid}${startLine}
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${lastDot}${tag}${xlabels}</svg>`;

// Price history of one holding against what the player paid: gold dashed line = average buy price,
// gold dots = individual buys (placed at the week they happened, if still inside the 15-week window).
// Line/fill is green while the price is above the average buy price, red below.
function holdingChartSVG(history,avg,marks){

  const lo=min-span*0.08, hi=max+span*0.08, iw=w-padL-padR, ih=h-padT-padB;

  const cur=history[n-1], col=cur>=avg?"#1f9d6e":"#d1453b", id="hg"+(++chartSeq);
  const line=history.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const ya=y(avg).toFixed(1);
  // Shade between the price line and the buy line: the gain (or loss) you're sitting on.

}
function holdingsTrendsHTML(p){
  const owned=MARKET.filter(m=>(p.holdings[m.id]||0)>0);
  const cards=owned.map(m=>{
    const qty=p.holdings[m.id], value=qty*m.price;
    const basis=(p.costBasis||{})[m.id]||value;   // holdings from before tracking existed: assume bought at today's price
    const avg=basis/qty, gain=value-basis, pct=basis?Math.round(gain/basis*1000)/10:0;
    const cls=gain>0?"up":gain<0?"down":"flat";
    const isRE=m.type==="realestate";
    const open=state.selectedHolding===m.id;
    // Collapsed: one clickable summary row with a mini trend line; click to open the full chart.
    return `<div class="hold-card${open?" open":""}">
      <div class="hold-head" onclick="selectHolding('${m.id}')" title="${open?"Hide":"Show"} chart">
        <span class="hold-name">${open?"▾":"▸"} <b>${m.name}</b><br><small class="muted">${isRE?(qty>1?qty+" units":"property"):qty+" sh"} · ${fmt(value)}</small></span>
        ${open?"":miniSparkSVG(m.history)}
        <span class="num ${cls}" style="text-align:right;">${gain>0?"+":""}${pct}%<br><small class="${cls}">${gain>=0?"+":"−"}${fmt(Math.abs(gain))}</small></span>
      </div>
      ${open?`${holdingChartSVG(m.history,avg,(p.buyMarks||{})[m.id])}
      <div class="hold-legend"><span><i></i>avg buy ${fmt(avg)}</span><span><b></b>your buys</span></div>
      <div class="between"><span class="muted">Avg buy ${fmt(avg)} → now ${fmt(m.price)}</span></div>
      <div class="between"><span class="muted">${isRE?"Equity "+fmt(value-mortgageShare(p,m.id,qty))+" (value − mortgage)":"Value "+fmt(value)}</span></div>`:""}
    </div>`;
  }).join("");
  const tBasis=owned.reduce((s,m)=>s+((p.costBasis||{})[m.id]||p.holdings[m.id]*m.price),0);
  const tValue=owned.reduce((s,m)=>s+p.holdings[m.id]*m.price,0), tGain=tValue-tBasis;
  const tCls=tGain>0?"up":tGain<0?"down":"flat";
  return `<div class="trends">
    <div class="sheet-sec">My Holdings vs Buy Price</div>
    ${owned.length?`<div class="between" style="font-size:12.5px;margin:4px 0;"><span>Paid ${fmt(tBasis)} → worth ${fmt(tValue)}</span><b class="${tCls}">${tGain>=0?"+":"−"}${fmt(Math.abs(tGain))}</b></div>
      <small class="muted" style="display:block;margin-bottom:6px;">Click a holding to chart it against what you paid.</small>${cards}`
    :`<p class="muted" style="font-size:12px;">Buy stocks or real estate and they'll show up here, charted against the price you paid.</p>`}
  </div>`;
}
// Tiny trend line for a table cell.
function miniSparkSVG(history){
  if(!history||history.length<2) return "";
  const w=72,h=24,n=history.length, min=Math.min(...history), max=Math.max(...history), r=(max-min)||1;
  const pts=history.map((v,i)=>(i*(w-4)/(n-1)+2).toFixed(1)+","+(h-3-(v-min)/r*(h-6)).toFixed(1)).join(" ");
  const col=history[n-1]>=history[0]?"#1f9d6e":"#d1453b";
  return `<svg class="mini-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

function render(){
  const el=document.getElementById('app');
  const validGamePhase=(state.phase==="playing"||state.phase==="over")&&state.players&&state.players.length&&state.players[state.turn];
  // Defensive: any phase other than "setup" needs real player data — anything else (an unrecognized
  // phase, or missing/incomplete player data) falls back to the lobby instead of crashing.
  if(state.phase!=="setup"&&!validGamePhase) state.phase="setup";
  // Keep scroll positions across the full re-render (the finance sheet, market and log would otherwise
  // jump back to the top every time a number changes, e.g. while paying off debt).
  const scrollKeys=[".panel-body",".log-panel .log",".mtable-wrap"];
  const kept=!el.querySelector?[]:scrollKeys.map(sel=>{const n=el.querySelector(sel); return n?{sel,top:n.scrollTop,panel:state.panel}:null;}).filter(Boolean);
  if(state.phase==="setup"){ el.classList.remove("fit-screen"); el.innerHTML=setupHTML(); }
  else { el.classList.add("fit-screen"); el.innerHTML=gameHTML(state.phase==="over"); }
  kept.forEach(k=>{ if(k.sel===".panel-body"&&k.panel!==state.panel) return; const n=el.querySelector(k.sel); if(n) n.scrollTop=k.top; });
  if(typeof document!=="undefined"&&document.body&&document.body.classList) document.body.classList.toggle("tb-page",state.phase!=="setup");
  syncSounds();
  syncDice();
}

// Direction of one step between two neighbouring board squares.
function stepDir(from,to){
  const [r1,c1]=BOARD_COORDS[from], [r2,c2]=BOARD_COORDS[to];
  return c2>c1?"right":c2<c1?"left":r2>r1?"down":"up";
}
// Keep one model per seat, all different; missing or clashing picks get the first free model.
function ensureTokens(){
  const n=Math.max(1,state.numPlayers||1), cur=(state.tokens||[]).slice(0,n), used=new Set(), out=[];
  for(let i=0;i<n;i++){ const t=cur[i]; if(TOKEN_MODELS[t]&&!used.has(t)){ out[i]=t; used.add(t); } }
  for(let i=0;i<n;i++){ if(!out[i]){ const f=TOKEN_ORDER.find(t=>!used.has(t))||TOKEN_ORDER[i%4]; out[i]=f; used.add(f); } }
  state.tokens=out; return out;
}
function setToken(i,model){
  if(state.online&&state.myIdx!==i) return;
  if(!TOKEN_MODELS[model]) return;
  ensureTokens();
  if(state.tokens.some((t,j)=>j!==i&&t===model)) return;   // taken by someone else
  state.tokens[i]=model;
  if(state.online) pushState(); render();
}
// Lobby picker for seat i: one button per model (front view), taken models greyed out.
function tokenPickerHTML(i,color){
  ensureTokens();
  const mine=!state.online||state.myIdx===i;
  return `<div class="tk-pick">${TOKEN_ORDER.map(t=>{const taken=state.tokens.some((x,j)=>j!==i&&x===t), sel=state.tokens[i]===t;
    return `<button type="button" class="tk-opt${sel?" sel":""}" style="color:${color}" title="${TOKEN_MODELS[t]}${taken?" (taken)":""}" ${!mine||taken?"disabled":""} onclick="setToken(${i},'${t}')">${tokenSVG(t,"down")}</button>`;}).join("")}</div>`;
}

function tbTokenHTML(pl, pi, opt){
  opt = opt || {};
  const cls = "tb-token tk" + (opt.size ? " tb-token--" + opt.size : "");
  const model = TOKEN_MODELS[pl.model] ? pl.model : TOKEN_ORDER[(pi || 0) % 4];
  return `<span class="${cls}" style="--pc:${pl.color};color:${pl.color}" title="${tbEsc(pl.name)} (${TOKEN_MODELS[model]})">${tokenSVG(model, opt.dir || pl.facing || "down")}</span>`;
}

/* ---------- One perimeter square -------------------------------------- */
// Squares 0, 6, 12, 18 are corners; the rest sit on a side. Each face is
// rotated so its colour band points at the board centre (see CSS).
function tbSquareSide(i){
  const n = BOARD.length / 4;                     // 6 on a 7×7 ring
  if(i % n === 0) return "corner tb-c" + (i / n);   // c0 TL, c1 TR, c2 BR, c3 BL
  return ["top", "right", "bottom", "left"][Math.floor(i / n)];
}
function tbSquareHTML(i){
  const type = BOARD[i], sq = SQUARES[type], [r, c] = BOARD_COORDS[i];
  const side = tbSquareSide(i), corner = side.startsWith("corner");
  const cur = state.players[state.turn];
  const isTurn = !!cur && cur.pos === i;
  const toks = state.players
    .map((pl, pi) => ({ pl, pi }))
    .filter(x => x.pl.pos === i && !(moving() && moveAnim.who === x.pi))
    .map(x => tbTokenHTML(x.pl, x.pi, { active: x.pi === state.turn }))
    .join("");
  return `<div class="tb-sq tb-${side}${isTurn && !moving() ? " is-turn" : ""}${toks ? " has-tokens" : ""}" data-i="${i}" style="grid-row:${r};grid-column:${c};--sq:${tbColor(type)};${isTurn ? `--pc:${cur.color};` : ""}" title="${sq.label}: ${sq.desc}">
    <div class="tb-sq-face">
      ${corner ? "" : `<div class="tb-sq-band">${sq.label}</div>`}
      <div class="tb-sq-body">${tbIcon(type)}${corner ? `<div class="tb-sq-name">${sq.label}</div>` : ""}</div>
    </div>
    ${toks ? `<div class="tb-sq-tokens">${toks}</div>` : ""}
  </div>`;
}

// Numbers only, no markup (the economy tiles in the board centre).
// tone: "good" | "bad" | "flat" (colour); arrow: "up" | "down" | null.
function tbEconomyData(){
  const stocks = MARKET.filter(m => m.type === "stock"), props = MARKET.filter(m => m.type === "realestate");
  const st = avgChange(stocks, m => m.price, m => m.prevPrice || m.price);
  const pr = avgChange(props,  m => m.price, m => m.prevPrice || m.price);
  const mr = mortgageRate(), br = bankRate(), rr = rentRate();
  const pts = (now, prev) => Math.round((now - (prev || now)) * 10) / 10;
  const rate = (key, label, short, v, d, upIsGood, tip, onclick) => ({
    key, label, short, tip, onclick,
    value: v.toFixed(1) + "%",
    sub: d ? Math.abs(d).toFixed(1) + " pts" : "same as last wk",
    subShort: d ? Math.abs(d).toFixed(1) + " pts" : "same",
    arrow: d > 0 ? "up" : d < 0 ? "down" : null, arrowOn: "sub",
    tone: !d ? "flat" : ((d > 0) === upIsGood ? "good" : "bad"),
  });
  const pct = (key, label, short, v, tip) => {
    const flat = Math.abs(v) < 0.005;
    return { key, label, short, tip,
      value: flat ? "0%" : Math.abs(Math.round(v * 100)) + "%",
      sub: "vs last week", subShort: "vs last wk",
      arrow: flat ? null : v > 0 ? "up" : "down", arrowOn: "value",
      tone: flat ? "flat" : v > 0 ? "good" : "bad" };
  };
  return {
    items: [
      rate("mortgage", "Mortgage", "Mtg", mr, pts(mr, state.prevMortgageRate), false,
        "Mortgage rate for NEW purchases, and its change since last week. Mortgages are fixed-rate: what you already own keeps the rate you bought at. Payment = balance × rate ÷ 12, every month."),
      rate("bank", "Bank loan", "Loan", br, pts(br, state.prevBankRate), false,
        "Bank loan rate: every month you pay this % of your bank loan balance. Starts at 10%; moved by interest-rate events."),
      pct("stocks", "Stocks", "Stocks", st, "Average stock price change since last week."),
      pct("property", "Property", "Prop.", pr, "Average property value change since last week."),
      rate("rent", "Rent rate", "Rent", rr, pts(rr, state.prevRentRate), true,
        "Rent rate: properties rent for this % of their value per year (before running costs and mortgage). New leases and renewals (every " + LEASE_WEEKS + " weeks) use it. Click for each property type.",
        "toggleRentTable()"),
    ],
    rentTable: state.showRentTable
      ? props.filter(m => m.designRent > 0).map(m => { const r = typeRentRate(m); return { name: m.name.split(" ").slice(-1)[0], rate: r, diff: r - rr }; })
      : null,
    speed: speedCfg().label,
    week: state.week || 0,
    lastEvent: state.lastMarketEvent || null,
  };
}

function tbEconomyItemHTML(it){
  const inner = `<span class="tb-econ-label"><i class="lf">${it.label}</i><i class="ls">${it.short}</i></span>
    <b class="tb-econ-value">${it.arrowOn === "value" ? tbArrow(it.arrow) : ""}${it.value}</b>
    <em class="tb-econ-sub">${it.arrowOn === "sub" ? tbArrow(it.arrow) : ""}<i class="lf">${it.sub}</i><i class="ls">${it.subShort}</i></em>`;
  return it.onclick
    ? `<button type="button" class="tb-econ-item tone-${it.tone} is-click" title="${it.tip}" onclick="${it.onclick}" aria-expanded="${!!state.showRentTable}">${inner}</button>`
    : `<div class="tb-econ-item tone-${it.tone}" title="${it.tip}">${inner}</div>`;
}

function tbEconomyHTML(d){

    ${pat("sd",4,4,`<circle cx="1" cy="1" r=".35" fill="${K}"/><circle cx="3" cy="3" r=".3" fill="${K}"/>`)}
    ${pat("w",12,3,`<path d="M0 2Q3 .6 6 2T12 2" stroke="${K}" stroke-width=".45" fill="none"/>`)}
    ${pat("lg",8,3.4,ln("M0 3.1H8",.7)+`<path d="M0 1.6H8" stroke="${K}" stroke-width=".25"/>`)}

      +`<polygon points="${pts([[x+w*.12,y+h],[x+w*.5,y],[x+w*.72,y],[x+w*.34,y+h]])}" fill="#fff" opacity=".3"/>`
      +(o.bars===0?"":L(x+w/2,y,x+w/2,y+h,.7,W)+L(x,y+h/2,x+w,y+h/2,.7,W))+(o.sill===0?"":R(x-1.6,y+h+.8,w+3.2,1.3,W));};

  const door=(x,y,w,h)=>R(x-1,y-1.4,w+2,h+1.4,W)+R(x,y,w,h,f("c"))+R(x+w*.18,y+h*.1,w*.64,h*.32,W)+R(x+w*.18,y+h*.52,w*.64,h*.36,W)+C(x+w*.8,y+h*.55,.6,K);

function propImgVariant(o){ if(o&&o.img!=null) return o.img; const s=String((o&&o.id)||""); let h=0; for(const ch of s) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h)%3; }
function realEstateListingsHTML(){
  const p=state.players[actingIdx()];
  if(state.listings.length===0) return `<p class="muted">No live listings right now — new ones appear each turn.</p>`;
  const cards=state.listings.map(l=>{
    const m=MARKET.find(x=>x.id===l.instId);
    const isAsk=l.kind==="ask";
    const held=p.holdings[l.instId]||0;
    const free=sellableQty(p,l.instId), canAct=isAsk?true:free>0;
    const capRate=m.rent?(m.rent*12/l.price*100).toFixed(1)+"%":"–";
    const appr=((m.price-m.basePrice0)/m.basePrice0*100).toFixed(1);
    const apprCls=appr>0?"up":appr<0?"down":"flat";
    const dp=l.downPct==null?10:l.downPct, cost=l.qty*l.price, down=reDown(cost,dp), mPmt=mortgagePmtFor(cost-down), costs=costsFor(m,l.qty,l.costPct), cfl=incomeDeltaBuy(m,l.qty,l.price,dp,l.costPct), roi=down>0?Math.round(cfl*12/down*100)+"%":(cfl>0?"∞ (no cash in)":"—");
    // For a WANTED offer: what the player would actually pocket after the mortgage is paid off.
    const sellQty=Math.min(l.qty,free), net=sellQty*l.price-mortgageShare(p,l.instId,sellQty);
    return `<div class="mcard">
      <div class="mhead">
        <div class="mtitle" title="${m.name}">${m.name}</div>
        <small class="muted">expires in ${l.turnsLeft} turn${l.turnsLeft>1?"s":""}</small>
        <span class="tag" style="background:${isAsk?'var(--good)':'var(--accent2)'}">${isAsk?"FOR SALE":"WANTED"}</span>
      </div>
      <div class="prop-photo">${propImageSVG(m.id,propImgVariant(l))}</div>
      ${sparklineSVG(m.history,260,40)}
      <div class="mstats">
        <span><b>Price ${fmt(l.price)}</b></span>
        <span>Market value ${fmt(m.price)}</span>
        <span>Rent ${fmt(m.rent)}/mo (${typeRentRate(m).toFixed(1)}%/yr · ${LEASE_WEEKS}-wk lease)</span>
        <span>Cap Rate ${capRate}</span>
        <span class="${apprCls}">Apprec. ${appr}%</span>
      </div>
      ${isAsk
        ?`<div class="mstats" style="margin-top:-2px;"><span><b>Cash down ${fmt(down)}</b> (${dp}%)</span><span>Mortgage ${fmt(cost-down)}</span><span>Costs −${fmt(costs)}/mo (${l.costPct==null?25:l.costPct}%)</span><span>Mortgage pmt −${fmt(mPmt)}/mo (${mortgageRate().toFixed(1)}%)</span><span class="${cfl>=0?"up":"down"}"><b>Cash flow ${sgn(cfl)}/mo</b></span><span>ROI ${roi}</span></div>`
        :sellQty?`<div class="mstats" style="margin-top:-2px;"><span>Sale ${fmt(sellQty*l.price)}</span><span>− Mortgage ${fmt(mortgageShare(p,l.instId,sellQty))}</span><span class="${net>=0?"up":"down"}">You get ${fmt(net)}</span></div>`:""}
      <div class="mactions mfoot">
        <button class="${isAsk?'primary':'sell'}" style="margin-left:auto;" ${canAct?"":"disabled"} onclick="${isAsk?"buyListing":"sellListing"}('${l.id}')">${isAsk?"Buy now":"Sell into it"}</button>
      </div>
      <div class="mheld" style="margin-top:4px;">Held: ${held}${held>free?` · ${held-free} locked (${lockTurnsLeft(p,l.instId)} turn${lockTurnsLeft(p,l.instId)===1?"":"s"})`:""}</div>
    </div>`;
  }).join("");
  return `<div class="mgrid">${cards}</div>`;
}
function marketHTML(){
  const p=state.players[actingIdx()];
  const stockRows=MARKET.filter(m=>m.type==="stock").map(m=>{
    const chg=m.prevPrice?Math.round((m.price-m.prevPrice)/m.prevPrice*100):0;
    const cls=chg>0?"up":chg<0?"down":"flat"; const arrow=chg>0?"▲":chg<0?"▼":"–";
    const held=p.holdings[m.id]||0;
    const pe=m.eps>0?(m.price/m.eps).toFixed(1):"N/A";
    const yld=m.div>0?((m.div*12/m.price)*100).toFixed(1)+"%":"–";
    const expanded=state.selectedStock===m.id;
    const row=`<tr style="cursor:pointer;" onclick="selectStock('${m.id}')"><td>${expanded?"▾":"▸"} ${m.name}<br><small class="muted">${m.sector}</small></td>
      <td>${miniSparkSVG(m.history)}</td>
      <td class="num">${fmt(m.price)}</td><td class="num ${cls}">${arrow} ${Math.abs(chg)}%</td>
      <td class="num">${fmt(m.low52)}–${fmt(m.high52)}</td>
      <td class="num">${pe}</td><td class="num">${yld}</td>
      <td class="num">${held}${held>sellableQty(p,m.id)?`<br><small class="muted" title="Flash-deal shares unlock in ${lockTurnsLeft(p,m.id)} turn(s)">${held-sellableQty(p,m.id)}</small>`:""}</td>
      <td onclick="event.stopPropagation()"><input class="qty" type="number" min="1" value="${state.qty[m.id]}" oninput="setQty('${m.id}',this.value)"><div class="qty-cost" id="cost-${m.id}">= ${fmt(m.price*(state.qty[m.id]||1))}</div></td>
      <td onclick="event.stopPropagation()"><div class="row" style="flex-wrap:nowrap;"><button class="primary" onclick="buyUnit('${m.id}')">Buy</button> <button class="sell" onclick="sellUnit('${m.id}')" ${sellableQty(p,m.id)?"":"disabled"}>Sell</button></div></td>
    </tr>`;
    if(!expanded) return row;
    const hist=m.history||[m.price];
    const histHigh=Math.max(...hist), histLow=Math.min(...hist);
    const periodChg=Math.round((hist[hist.length-1]-hist[0])/hist[0]*1000)/10;
    const pCls=periodChg>0?"up":periodChg<0?"down":"flat";
    return row+`<tr><td colspan="10" style="background:var(--bg);">
      <div style="padding:10px;">
        <div class="between">
          <div><b>${m.name}</b> <small class="muted">${m.sector} · 15-week history</small></div>
          <div class="mprice">${fmt(m.price)} <span class="${cls}" style="font-size:12px;">${arrow} ${Math.abs(chg)}% wk</span> <span class="${pCls}" style="font-size:12px;">· ${periodChg>0?"+":""}${periodChg}% 15w</span></div>
        </div>
        <div class="chart-box">${sparklineSVG(hist)}</div>
        <div class="mstats" style="margin-top:8px;">
          <span>15w High ${fmt(histHigh)}</span>
          <span>15w Low ${fmt(histLow)}</span>
          <span>Volatility ${Math.round(m.vol*100)}%</span>
          <span>52wk Range ${fmt(m.low52)}–${fmt(m.high52)}</span>
          <span>P/E ${pe}</span>
          <span>Div Yield ${yld}</span>
          <span>Held ${held} (${fmt(held*m.price)})${held>sellableQty(p,m.id)?` · ${held-sellableQty(p,m.id)} locked ${lockTurnsLeft(p,m.id)} more turn(s)`:""}</span>
        </div>
      </div>
    </td></tr>`;
  }).join("");
  const stockTable=`<div class="mtable-wrap"><table><thead><tr><th>Stock (sector)</th><th>15w Trend</th><th class="num">Price</th><th class="num">Chg</th><th class="num">52wk Range</th><th class="num">P/E</th><th class="num">Div Yld</th><th class="num">Held</th><th>Qty</th><th></th></tr></thead><tbody>${stockRows}</tbody></table></div>`;
  return `<div class="card" style="margin-bottom:0;">
  <div class="subtabs">
    <button class="${state.marketTab==='stock'?'active':''}" onclick="setMarketTab('stock')">Stocks</button>
    <button class="${state.marketTab==='realestate'?'active':''}" onclick="setMarketTab('realestate')">Real Estate</button>
  </div>
  ${state.marketTab==='stock'
    ?`${stockTable}<small>Click a row to expand its 15-week history and details. Always-open trades at the live market price. A purchase you can't fully cover asks you to confirm a bank loan (in $1,000 steps) for the shortfall. Hover the chart dots for weekly prices.</small>`
    :`${realEstateListingsHTML()}<small>Real estate trades only through these live offers from other buyers/sellers — they're limited in size and time, so grab one before it's gone. Each offer sets its own terms: down payment (0–30%) and running costs (share of rent). The rest of the price becomes a mortgage. Cash flow is rent minus running costs minus the mortgage payment, and can be negative. When you sell, the mortgage is paid off from the sale price and you keep the rest.</small>`}
  </div>`;
}
// Colour per income/expense line — shared by the overview bars and the dots in the detailed tables,

const FIN_COLORS={left:"#7f4f24",salary:"#1f7a5c",div:"#3cb883",rent:"#8fd6b1",taxes:"#8e9aa6",mortgage:"#c0392b",car:"#e67e22",cc:"#e0b000",retail:"#d6457a",other:"#9b59b6",kids:"#2f93b8",bank:"#b8860b"};
function finDot(k){return `<i class="fdot" style="background:${FIN_COLORS[k]}"></i>`;}
// A horizontal bar of coloured segments on a shared scale; each segment has a hover title.
function stackBar(parts,scale){
  return `<div class="sbar">${parts.filter(x=>x.v>0).map(x=>`<span style="width:${(x.v/scale*100).toFixed(2)}%;background:${FIN_COLORS[x.k]}" title="${x.label}: ${fmt(x.v)}"></span>`).join("")}</div>`;
}

  </div>`;
}
// Events and bills arrive as a letter: airmail border, stamp, postmark with the week, addressed to the
// player whose turn it is. It simply appears (no opening animation).
function letterHTML(p,subject,kind,body){
  // The buttons sit below the text (always visible); only the text scrolls when it is long.
  const ai=body.lastIndexOf('<div class="letter-actions">'), actions=ai>=0?body.slice(ai):"";
  if(ai>=0) body=body.slice(0,ai);
  const sq=SQUARES[BOARD[(p&&p.pos)||0]]?BOARD[(p&&p.pos)||0]:"event";
  return `<div class="letter" role="dialog" aria-label="${kind}: ${subject}">
    <div class="letter-head">
      <div class="letter-addr"><span>${kind}</span><div>To: <b>${p?p.name:""}</b></div><div>Re: <b>${subject}</b></div></div>
      <div class="letter-post"><div class="letter-mark">WEEK<br><b>${state.week||0}</b></div><div class="letter-stamp" style="--sq:${tbColor(sq)}">${tbIcon(sq)}</div></div>
    </div>
    <div class="letter-body">${body}</div>
    ${actions?`<div class="letter-foot">${actions}</div>`:""}
  </div>`;
}
function pendingHTML(){
  if(!state.pending) return "";
  const myTurn=!state.online||state.myIdx===state.turn;
  let inner="";
  if(state.pending.kind==="charity"){
    const p=state.pending.p;
    inner=letterHTML(state.players[state.turn],"Donation request","Appeal",`<p>The community fund asks for 10% of your total income.</p>
      <div class="letter-due"><span>Donation</span><b>${fmt(charityAmount(state.players[state.turn]))}</b></div>
      <p class="letter-note">If you donate, for your next ${CHARITY_TURNS} turns you may roll 1 or 2 dice.</p>
      ${myTurn?`<div class="letter-actions"><button onclick="charitySkip()">Skip</button><button class="primary" onclick="charityPay()">Donate</button></div>`
      :`<p class="letter-note">Waiting for ${p.name} to decide…</p>`}`);
  }else if(state.pending.kind==="bill"){
    const b=state.pending, p=state.players[state.turn];
    inner=letterHTML(p,b.title,"Invoice",`<p>${b.desc}</p>
      <div class="letter-due"><span>Amount due</span><b>${fmt(b.amt)}</b></div>
      ${myTurn?`<p class="letter-note">Cash on hand: ${fmt(p.cash)}${p.cash<b.amt?(loanCheck(p,Math.ceil((b.amt-p.cash)/1000)*1000,0).ok?" — not enough, you'll need a loan":" — not enough, sell assets first"):""}</p>
      <div class="letter-actions"><button class="primary" onclick="payPendingBill()">Pay ${fmt(b.amt)}</button></div>`
      :`<p class="letter-note">Waiting for ${p.name} to pay…</p>`}`);
  }else if(state.pending.kind==="eventinfo"){
    const ev=state.pending.ev;
    inner=letterHTML(state.players[state.turn],ev.name,"Notice",`<p>${ev.desc}</p>
     ${myTurn?`<div class="letter-actions"><button class="primary" onclick="continueEvent()">Continue</button></div>`:`<p class="letter-note">Waiting for the current player to continue…</p>`}`);
  }else if(state.pending.kind==="flashdeal"){
    const pd=state.pending, m=MARKET.find(x=>x.id===pd.id), p=pd.p;
    const re=m.type==="realestate";
    const head=`<div class="clip-top"><span>The Rat Race Times</span><span>Week ${state.week||0}</span></div>
      <div class="clip-kicker">Private offer · ${re?"Real estate":"Shares"}</div>
      <div class="clip-title">${m.name}</div>`;
    inner=myTurn?`<div class="clip${re?"":" clip-sm"}" role="dialog" aria-label="Private offer: ${m.name}">${head}
     <div class="clip-body">
     <div class="clip-deal">${re?`<div class="prop-photo clip-photo">${propImageSVG(m.id,propImgVariant(pd))}</div>`:""}
      <div><div class="clip-price"><span>Asking</span><b>${fmt(pd.dealPrice)}</b><span>${re?"per unit":"per share"}</span></div>
      <p class="clip-text">For ${p.name} only, this turn.
      ${re?`Market value ${fmt(m.price)}. ${pd.downPct}% down, the rest becomes a mortgage.`
        :`Compare with the <a href="#" class="clip-link" onclick="togglePanel('market');return false;">stock table</a>. Shares bought here are locked for your next ${FLASH_LOCK_TURNS} turns.`}</p></div></div>
     ${pd.qtyMax!==1?`<div class="evt-stepper">
      <button onclick="setFlashQty(state.flashQty-1,true)" aria-label="One less">−</button>
      <input class="evt-qty" type="number" min="1" value="${state.flashQty}" oninput="setFlashQty(this.value)" onchange="setFlashQty(this.value,true)" aria-label="Quantity">
      <button onclick="setFlashQty(state.flashQty+1,true)" aria-label="One more">+</button>
      <button class="evt-max" onclick="setFlashQty(flashMaxCash(),true)" title="Most you can buy with cash, no loan">Max cash</button>
     </div>`:""}
     <div class="flash-preview" id="flash-preview">${flashPreviewHTML()}</div>
     </div>
     <div class="clip-actions"><button onclick="passFlash()">Pass</button><button class="primary" onclick="buyFlashDeal()">Buy</button></div></div>`
     :`<div class="clip" role="dialog" aria-label="Private offer">${head}<div class="clip-body"><p class="clip-text">A private offer for ${p.name}. Waiting for ${p.name} to decide…</p></div></div>`;
  }
  return `<div class="modal-backdrop${moving()?" move-wait":""}">${inner}</div>`;
}
function playersOverviewHTML(){
  // Only public info here (profession, board square, family, progress %) — cash and the full
  // statement stay private to each player online.
  const cards=state.players.map((pl,i)=>{
    const exp=totalExpenses(pl), pi=passiveIncome(pl);
    const rawPct=Math.round(pi/Math.max(1,exp)*100);
    const barPct=Math.min(100,rawPct/1.5);
    const markerPct=Math.min(100,100/1.5);
    const isTurn=i===state.turn&&state.phase==="playing", isMe=state.online&&state.myIdx===i;
    const done=pl.escaped||rawPct>=100, sq=SQUARES[BOARD[pl.pos]];
    return `<div class="pcard${isTurn?" turn":""}" style="--pc:${pl.color}">
      <div class="ptop">
        ${playerToken(pl,i,isTurn?" active":"")}
        <div style="min-width:0;">
          <div class="pname">${pl.name}${isMe?` <span class="badge soft">You</span>`:""}${isTurn?` <span class="badge">Turn</span>`:""}</div>
          <div class="pmeta">${pl.profession} · on <span class="pmeta-sq" style="--sq:${tbColor(BOARD[pl.pos])}">${tbIcon(BOARD[pl.pos])}${sq.label}</span></div>
        </div>
        <div class="ppct ${done?"up":""}">${rawPct}%</div>
      </div>
      <div class="bar" style="position:relative;margin:7px 0 5px;">
        <div style="width:${barPct}%;background:${done?'var(--good)':'var(--accent2)'};"></div>
        <div style="position:absolute;left:${markerPct}%;top:0;bottom:0;width:2px;background:var(--ink);" title="100% — escape line"></div>
      </div>
      <div class="pchips">
        ${pl.escaped?`<span class="chip good">Escaped · #${pl.place}</span>`:""}
        ${pl.bankrupt?`<span class="chip" style="color:var(--bad);border-color:var(--bad);">Bankrupt · #${pl.place}</span>`:""}
        ${pl.place&&!pl.escaped&&!pl.bankrupt?`<span class="chip">Finished · #${pl.place}</span>`:""}
        ${pl.charityTurns>0?`<span class="chip" title="May roll 1 or 2 dice">${pl.charityTurns} charity turn${pl.charityTurns===1?"":"s"}</span>`:""}
        ${pl.skipTurns>0?`<span class="chip" style="color:var(--bad);" title="Downsized">sits out ${pl.skipTurns} turn${pl.skipTurns===1?"":"s"}</span>`:""}
        ${pl.kids?`<span class="chip">×${pl.kids}</span>`:""}
      </div>
    </div>`;
  }).join("");
  return `<div class="card players-overview">
   <div class="between" style="margin-bottom:6px;"><h3 style="margin:0;">Rat Race Progress</h3><small class="muted">Passive income ÷ expenses · line = 100% escape</small></div>
   <div class="pgrid">${cards}</div></div>`;
}
// Final standings: places 1..n, how each player finished, and their numbers at the end.
function standingsHTML(){
  if(state.players.length===1){
    const p=state.players[0], best=soloBest(state.speed||"medium");
    return `<div class="card standings"><h3>Solo game over <small class="muted">(${speedCfg().label} game)</small></h3>
      <p style="font-size:15px;margin:4px 0;">${p.escaped?`<b>${p.name}</b> escaped the Rat Race in <b>${p.finishWeek} weeks</b>${p.newRecord?" (new best time)":""}`:`<b>${p.name}</b> went bankrupt in week ${p.finishWeek}.`}</p>
      <p class="muted" style="margin:0;">Best on this device (${speedCfg().label}): ${best==null?"—":best+" weeks"} · Passive income ${fmt(passiveIncome(p))}/mo as a ${p.profession}.
      </p>
      <div class="row" style="margin-top:8px;"><button class="primary" onclick="backToMainLobby()">Play again</button></div></div>`;
  }
  const rows=state.players.slice().sort((a,b)=>(a.place||99)-(b.place||99)).map(p=>{
    const medal="#"+p.place;
    const worth=p.cash+MARKET.reduce((s,m)=>s+(p.holdings[m.id]||0)*m.price,0)-(p.mortgageBal+p.carBal+p.ccBal+p.retailBal+p.bankLoanBal+reMortgageTotal(p));
    return `<tr><td style="font-size:18px;">${medal}</td><td><span style="color:${p.color}">●</span> <b>${p.name}</b><br><small class="muted">${p.profession}</small></td>
      <td>${p.escaped?"Escaped in week "+p.finishWeek:p.bankrupt?"Bankrupt in week "+p.finishWeek:"Last one left in the Rat Race"}</td>
      <td class="num">${fmt(passiveIncome(p))}/mo</td><td class="num">${p.bankrupt?"—":(worth<0?"−":"")+fmt(Math.abs(worth))}</td></tr>`;
  }).join("");
  return `<div class="card standings"><h3>Game over — final standings <small class="muted">(${speedCfg().label} game)</small></h3>
    <table><thead><tr><th></th><th>Player</th><th>Result</th><th class="num">Passive income</th><th class="num">Net worth</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row" style="margin-top:8px;"><button class="primary" onclick="backToMainLobby()">Play again</button>${state.online?`<small class="muted">Takes you back to the main lobby${state.isHost?" and closes this room for everyone":""}.</small>`:""}</div></div>`;
}
function gameHTML(over){
  const p=state.players[state.turn];
  const myTurn=!state.online||state.myIdx===state.turn;
  const tabs=state.players.map((pl,i)=>`<button class="${state.viewTab===i?'active':''}" onclick="setTab(${i})" style="border-left:3px solid ${pl.color}">${pl.name}${pl.escaped?" ✓":""}</button>`).join("");
  const myIdx=state.online?state.myIdx:state.viewTab;
  const financePanel=state.panel==="finance"?`<div class="panel-backdrop left" onclick="if(event.target===this)closePanel()">
      <div class="side-panel wide xwide paper-form">
        <div class="panel-head form-head">
          <div class="form-title"><small>Cashflow · Rat Race</small><h3>Financial Statement</h3></div>
          <div class="form-meta">${speedCfg().label} game<br>Week ${state.week||0}</div>
          <button onclick="closePanel()">Close</button>
        </div>
        <div class="panel-body">
          ${state.online?`<p class="muted" style="margin-top:0;">Only you can see your full statement. Everyone sees the shared Rat Race Progress bars below the board.</p>`:`<div class="tabs">${tabs}</div>`}
          ${statementHTML(state.players[myIdx], myIdx)}
        </div>
      </div>
    </div>`:"";
  const marketPanel=state.panel==="market"&&!over?`<div class="panel-backdrop right" onclick="if(event.target===this)closePanel()">
      <div class="side-panel wide paper-news">
        <div class="panel-head news-head">
          <div class="news-mast">
            <div class="news-top"><span>Week ${state.week||0}</span><span>Market edition</span><span>Mortgages ${mortgageRate().toFixed(1)}% · Bank loans ${bankRate().toFixed(1)}%</span></div>
            <h3 class="news-title">The Rat Race Times</h3>
            <div class="news-rule"><span>Stocks</span><span>Real Estate</span><span>Offers &amp; Wanted</span></div>
          </div>
          <button onclick="closePanel()">Close</button>
        </div>
        <div class="panel-body">
          ${marketHTML()}
        </div>
      </div>
    </div>`:"";
  return `<h1>Cashflow: Rat Race ${muteButtonHTML()}</h1>
  ${state.online?`<p class="muted" style="margin:-6px 0 8px;">Online room <b>${state.room}</b> — playing as <b>${state.myName}</b>.</p>`:""}
  ${over?standingsHTML():""}
  <button class="side-toggle left gold" onclick="togglePanel('finance')">Finance</button>
  ${!over?`<button class="side-toggle right gold" onclick="togglePanel('market')">Market</button>`:""}
  <div class="board-wrap">
    <div class="card">
      <div class="between turn-bar">
        <div class="turn-who"><b>Turn:</b> <span style="color:${p.color}">●</span> ${p.name}${state.online&&!myTurn?` <small class="muted">(waiting for ${p.name} to roll/end turn — you can still trade)</small>`:""}</div>
        ${!over&&!state.pending&&myTurn?(state.hasRolled
          ?`<button class="primary" onclick="endTurn()">End Turn</button>`
          :(p.charityTurns>0
            ?`<div class="row" style="flex-wrap:nowrap;gap:6px;"><small class="roll-note" style="color:var(--bad);">${p.charityTurns} charity turn${p.charityTurns===1?"":"s"}</small><button class="primary" onclick="rollDice(1)">Roll 1</button><button class="gold" onclick="rollDice(2)">Roll 2</button></div>`
            :`<button class="primary" onclick="rollDice(1)">Roll Dice</button>`)):""}
      </div>
      <div class="board-area"><div class="board-row">
        ${tbBoardHTML()}
        <div class="log-panel">${diceBoxHTML()}<div class="log-head">Game Log</div><div class="log">${state.log.map(l=>`<div>${l}</div>`).join("")}</div></div>
      </div></div>
    </div>
    ${!over?pendingHTML():""}
  </div>
  ${playersOverviewHTML()}
  ${financePanel}
  ${marketPanel}
  ${confirmHTML()}
  ${forceSellHTML()}
  ${alertHTML()}`;
}
render();
</script>
</body>
</html>
