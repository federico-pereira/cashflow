<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow: Rat Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --bg:#f4f1ea; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e2ddd0;
  --accent:#1f7a5c; --accent2:#b8860b; --danger:#b3261e; --good:#1f7a5c; --bad:#b3261e;
  --p0:#c0392b;--p1:#2471a3;--p2:#af7ac5;--p3:#e67e22;--p4:#16a085;--p5:#7f8c8d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#181a1f;--panel:#22252c;--ink:#eceef1;--muted:#9aa0a8;--line:#33363e;}
}
:root[data-theme="dark"]{--bg:#181a1f;--panel:#22252c;--ink:#eceef1;--muted:#9aa0a8;--line:#33363e;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100%;}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 6px;}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;font-size:13.5px;}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
button.gold{background:var(--accent2);color:#fff;border-color:var(--accent2);}
button.sell{background:var(--danger);color:#fff;border-color:var(--danger);}
button:disabled{opacity:.4;cursor:not-allowed;}
input,select{font-family:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
html,body{height:100%;}
.wrap{max-width:720px;margin:0 auto;padding:16px;}
.wrap.fit-screen{max-width:1040px;height:100vh;max-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.wrap.fit-screen h1{flex:none;font-size:19px;}
.wrap.fit-screen .win{flex:none;}
.wrap.fit-screen .board-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
.wrap.fit-screen .board-wrap>.card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:8px;overflow:hidden;}
.wrap.fit-screen .board-wrap>.card>.between{flex:none;}
/* Fixed-height turn bar: whether it shows Roll, Roll 1/Roll 2, End Turn or nothing (while a popup is
   open), the board below keeps exactly the same space and never jumps. */
.turn-bar{height:38px;flex-wrap:nowrap;overflow:hidden;}
.turn-bar .turn-who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.turn-bar button{white-space:nowrap;}
@media (max-width:560px){.turn-bar .roll-note{display:none;}}
/* Board + log side by side. .board-area is a size container, so the board is the largest square that fits
   and the log panel has exactly the board's height: new log lines scroll inside it, never resizing the board.
   On narrow screens the log drops below the board at a fixed height. */
.board-area{flex:1;min-height:0;container-type:size;margin:6px 0 4px;}
.board-row{--bs:min(100cqh,100cqw - 260px,640px);height:100%;display:flex;gap:10px;justify-content:center;align-items:flex-start;}
.board-row .gameboard{width:var(--bs);height:var(--bs);max-width:none;margin:0;flex:none;}
.log-panel{flex:1 1 0;min-width:200px;max-width:320px;height:var(--bs);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;}
.dice-box{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);min-height:58px;}
.dice-row{display:flex;gap:6px;flex:none;}
.die{width:36px;height:36px;background:#fff;border:1px solid #cfc8b8;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:4px;}
.die i{display:block;}
.die .pip{width:7px;height:7px;border-radius:50%;background:#1f2430;place-self:center;}
.dice-row.rolling .die{animation:dieTumble .15s ease-in-out infinite alternate;}
.dice-row.rolling .die:nth-child(2){animation-delay:.07s;}
@keyframes dieTumble{from{transform:translateY(0) rotate(-14deg);}to{transform:translateY(-5px) rotate(14deg);}}
@media (prefers-reduced-motion:reduce){.dice-row.rolling .die{animation:none;}}
.dice-cap{font-size:12.5px;line-height:1.3;min-width:0;}
.log-panel .log-head{flex:none;font-weight:bold;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);}
.log-panel .log{flex:1;min-height:0;max-height:none;margin:0;border:0;padding:6px 10px 8px;overflow-y:auto;}
.log-panel .log div{padding:3px 0;border-bottom:1px dashed var(--line);line-height:1.35;}
.log-panel .log div:first-child{color:var(--ink);}
@container (max-width:620px){
  .board-row{--bs:min(100cqw,100cqh - 146px);flex-direction:column;align-items:center;gap:6px;}
  .log-panel{flex:none;width:100%;max-width:none;height:140px;}
  .dice-box{min-height:46px;padding:5px 10px;}
  .econ .econ-item .lf{display:none;} .econ .econ-item .ls{display:inline;}
  .die{width:28px;height:28px;padding:3px;}
  .die .pip{width:5px;height:5px;}
}
.wrap.fit-screen .players-overview{flex:none;max-height:26vh;overflow-y:auto;}
.board-wrap{position:relative;}
.side-toggle{position:fixed;top:50%;transform:translateY(-50%);z-index:60;padding:14px 8px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.side-toggle.left{left:0;border-radius:0 10px 10px 0;border-left:none;}
.side-toggle.right{right:0;border-radius:10px 0 0 10px;border-right:none;}
.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;}
.panel-backdrop.left{justify-content:flex-start;}
.panel-backdrop.right{justify-content:flex-end;}
.side-panel{background:var(--panel);width:auto;max-width:420px;max-height:92vh;overflow:hidden;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.35);margin:0 10px;border-radius:14px;display:flex;flex-direction:column;}
.side-panel.wide{width:min(94vw,860px);max-width:min(94vw,860px);height:92vh;}
/* Fixed height: the panel no longer grows/shrinks and re-centres when rows appear or disappear. */
.side-panel.xwide{width:min(96vw,1120px);max-width:min(96vw,1120px);}
.panel-backdrop.left .side-panel{border-radius:0 14px 14px 0;margin-left:0;}
.panel-backdrop.right .side-panel{border-radius:14px 0 0 14px;margin-right:0;}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 16px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;}
.mgrid .mcard{margin-bottom:0;padding:9px 10px;}
.mtable-wrap{overflow-x:auto;}
.mtable-wrap table{min-width:680px;font-size:12.5px;}
.mtable-wrap thead th{position:sticky;top:0;background:var(--panel);z-index:1;}
.panel-head{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
small,.muted{color:var(--muted);font-size:12.5px;}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;color:#fff;}
.gameboard{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;aspect-ratio:1/1;max-width:560px;margin:4px auto 10px;padding:6px;border-radius:16px;background:linear-gradient(135deg,rgba(31,122,92,.16),rgba(184,134,11,.16));border:1px solid var(--line);}
.cell{--sq:#888;border:1px solid color-mix(in srgb,var(--sq) 35%,var(--line));border-top:4px solid var(--sq);border-radius:8px;background:color-mix(in srgb,var(--sq) 11%,var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;min-width:0;min-height:0;transition:box-shadow .2s;}
.cell .sq-emoji{font-size:clamp(12px,2.5vmin,20px);line-height:1;}
.cell .sq-label{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6px,1.2vmin,9.5px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sq);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell.here{box-shadow:0 0 0 2px var(--turncol),0 0 14px var(--turncol);z-index:1;}
.cell .tokens{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.cell .sq-label.long{letter-spacing:0;font-size:clamp(5.5px,1.02vmin,8px);}
.ptok{flex:none;width:clamp(12px,2.3vmin,18px);height:clamp(12px,2.3vmin,18px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 clamp(7px,1.3vmin,10px)/1 system-ui,-apple-system,'Segoe UI',sans-serif;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);vertical-align:middle;}
.ptok.active{animation:tokpulse 1.6s ease-in-out infinite;}
@keyframes tokpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
@media (prefers-reduced-motion:reduce){.ptok.active{animation:none;}}
.board-center{grid-row:2/7;grid-column:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vmin,10px);text-align:center;background:var(--panel);border-radius:12px;border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));padding:clamp(6px,1.6vmin,14px);min-height:0;overflow:hidden;}
.bc-title{font-weight:bold;font-size:clamp(12px,2.6vmin,20px);letter-spacing:.06em;color:var(--accent);}
.bc-title small{display:block;font-size:.55em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);}
.bc-turn{font-size:clamp(8px,1.5vmin,12px);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--pc) 14%,var(--bg));border:1px solid var(--pc);display:inline-flex;align-items:center;gap:5px;}
.lobby-back{display:flex;align-items:center;gap:8px;margin:-2px 0 8px;}
.mode-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:560px){.mode-buttons{grid-template-columns:1fr;}}
.mode-btn{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);white-space:normal;}
.mode-btn:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--panel));}
.mode-btn .mb-icon{font-size:28px;line-height:1;}
.mode-btn b{display:block;font-size:16px;}
.mode-btn small{display:block;margin-top:2px;}
.speed-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
@media (max-width:640px){.speed-cards{grid-template-columns:1fr;}}
.speed-card{text-align:left;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);white-space:normal;}
.speed-card.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));box-shadow:0 0 0 1px var(--accent);}
.speed-card:disabled{opacity:1;cursor:default;}
.speed-card:disabled:not(.sel){opacity:.55;}
.speed-card .sc-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
.speed-card .sc-head b{font-size:15px;}
.speed-card .sc-head span{font-size:12px;color:var(--accent2);font-weight:bold;}
.speed-card p{margin:0;font-size:12px;color:var(--muted);line-height:1.35;}
.speed-card ul{list-style:none;margin:2px 0 0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11.5px;}
.speed-card li{display:flex;justify-content:space-between;gap:6px;padding:2px 4px;border-radius:5px;}
.speed-card li span{color:var(--muted);}
.speed-card li.diff{background:color-mix(in srgb,var(--accent2) 18%,transparent);}
.speed-card li.diff b{color:var(--accent2);}
.diff-key{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2);padding:0 4px;border-radius:4px;font-weight:bold;}
.econ{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(3px,.8vmin,6px);width:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
.econ-item{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:clamp(2px,.7vmin,6px) clamp(2px,.6vmin,5px);display:flex;flex-direction:column;align-items:center;min-width:0;cursor:help;}
.econ-item span{font-size:clamp(6px,1.05vmin,9.5px);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.econ-item b{font-size:clamp(9px,1.9vmin,15px);font-variant-numeric:tabular-nums;white-space:nowrap;}
.econ-item span i{font-style:normal;}
.econ-item .ls{display:none;}
.econ-item em{font-style:normal;font-size:clamp(6px,1vmin,9px);white-space:nowrap;}
.econ-item em.flat{color:var(--muted);}
.econ-foot{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6.5px,1.15vmin,10.5px);color:var(--muted);line-height:1.3;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.econ-foot b{color:var(--ink);}
.econ-click{display:contents;}
.econ-click .econ-item{cursor:pointer;}
.rent-table{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 10px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6.5px,1.15vmin,10.5px);color:var(--muted);}
.rent-table b{color:var(--ink);font-weight:600;}
.rent-table em{font-style:normal;margin-left:2px;}
.legend-toggle{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(7px,1.2vmin,11px);padding:2px 10px;border-radius:999px;color:var(--muted);background:transparent;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2px,.6vmin,5px) clamp(6px,1.4vmin,12px);text-align:left;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6.5px,1.25vmin,10.5px);line-height:1.25;width:100%;}
.legend .lg{display:flex;gap:4px;align-items:flex-start;color:var(--muted);}
.legend .lg b{color:var(--sq);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.pcard{--pc:#888;border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:10px;padding:8px 10px;background:var(--bg);}
.pcard.turn{background:color-mix(in srgb,var(--pc) 9%,var(--bg));box-shadow:0 0 0 1.5px var(--pc);}
.pcard .ptop{display:flex;align-items:center;gap:8px;}
.pcard .ptop .ptok{width:26px;height:26px;font-size:12px;}
.pcard .pname{font-weight:bold;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .pmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .ppct{margin-left:auto;font-weight:bold;font-size:16px;font-variant-numeric:tabular-nums;}
.pcard .bar{height:8px;}
.pchips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;height:19px;}
.chip{white-space:nowrap;}
.chip{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);}
.chip.good{color:var(--good);border-color:var(--good);}
.badge{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:999px;background:var(--pc);color:#fff;vertical-align:middle;}
.badge.soft{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.hold-head{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;cursor:pointer;}
.hold-head .mini-spark{width:60px;}
.hold-card:hover{border-color:var(--accent2);}
.hold-card.open{border-color:var(--accent2);background:var(--panel);}
.tok{width:12px;height:12px;border-radius:50%;display:inline-block;margin:1px;border:1px solid #0003;}
/* Event/charity/flash-deal popup: no dimming layer — only the card itself catches clicks, so Finance and
   Market stay usable; it sits below the side tabs (60) and panels (80). */
.modal-backdrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;pointer-events:none;}
.modal-backdrop>*{pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tabs button{padding:5px 10px;font-size:13px;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:13px;}
td,th{padding:4px;border-bottom:1px dashed var(--line);text-align:left;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0;}
.bar>div{height:100%;background:var(--good);}
.log{max-height:100px;overflow-y:auto;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px;}
.win{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;text-align:center;padding:14px;border-radius:12px;}
.evt{background:linear-gradient(135deg,#6a3fa0,#3b6fb5);color:#fff;text-align:center;padding:14px;border-radius:12px;}
.up{color:var(--good);font-weight:bold;} .down{color:var(--bad);font-weight:bold;} .flat{color:var(--muted);}
.qty{width:56px;font-weight:bold;color:var(--ink);background:var(--panel);border:1.5px solid color-mix(in srgb,var(--ink) 35%,var(--line));text-align:center;}
.qty:focus{outline:2px solid var(--accent2);outline-offset:1px;}
.qty-cost{font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sheet-sec{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;margin:10px 0 4px;font-weight:bold;font-size:13px;}
.sheet-sec .num{background:var(--bg);color:var(--ink);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
.sheet-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.sheet-table td{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
.sheet-table td.desc{width:62%;overflow-wrap:break-word;}
.sheet-table td.num{text-align:right;font-variant-numeric:tabular-nums;width:38%;white-space:nowrap;}
.sheet-table tr.total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:bold;padding-top:6px;}
.balcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.balcols.with-trends{grid-template-columns:1fr 1fr minmax(230px,1fr);}
@media (max-width:900px){.balcols.with-trends{grid-template-columns:1fr 1fr;}.balcols.with-trends>.trends{grid-column:1/-1;}}
@media (max-width:640px){.balcols,.balcols.with-trends{grid-template-columns:1fr;}}
.hold-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
.hold-card .between{gap:4px;}
.hold-card .chart{margin-top:4px;}
.hold-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:2px 0 8px;}
.hold-legend i{display:inline-block;width:14px;height:0;border-top:2px dashed var(--accent2);vertical-align:middle;margin-right:4px;}
.hold-legend b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);vertical-align:middle;margin-right:4px;}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0;}
.summary div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0;}
.summary small{font-size:11px;}
.summary b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.head-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.floor{display:flex;gap:10px;flex-wrap:wrap;padding:4px 2px 8px;}
.lcard{min-width:158px;max-width:158px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;}
.subtabs{display:flex;gap:6px;margin:4px 0 12px;}
.subtabs button{flex:1;padding:7px 6px;font-size:13px;}
.subtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.mcard .mtitle{font-weight:bold;font-size:14.5px;}
.mcard .mprice{font-size:17px;font-weight:bold;}
.mstats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.mstats span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);white-space:nowrap;}
.mactions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.mheld{margin-left:auto;font-size:11.5px;color:var(--muted);}
.chart{display:block;width:100%;height:auto;margin-top:6px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;}
.chart .hit{fill:transparent;cursor:crosshair;}
.chart .hit:hover+.dot{r:4.5;}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;margin-top:8px;}
.mini-spark{display:block;width:72px;height:24px;}
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.confirm-card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--accent2);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.4);width:100%;max-width:400px;padding:16px 18px;}
.confirm-card .confirm-head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-weight:bold;margin-bottom:4px;}
.confirm-card table td{padding:5px 4px;font-size:13px;}
.confirm-card td.num{white-space:nowrap;}
.confirm-card tr.big td{font-size:15px;font-weight:bold;border-bottom:2px solid var(--line);}
.confirm-warn{background:rgba(179,38,30,.1);border:1px solid rgba(179,38,30,.35);color:var(--bad);border-radius:8px;padding:7px 10px;font-size:12.5px;margin-top:10px;}
.sheet-table tr.sub td{font-size:11.5px;color:var(--muted);padding-left:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help;}
.sheet-table tr.sub .sub-meta{font-size:10.5px;opacity:.8;}
.sheet-table tr.liab{cursor:pointer;}
.sheet-table tr.liab:hover td{background:var(--bg);}
.sheet-table tr.sel td{background:rgba(184,134,11,.14);font-weight:bold;}
.fin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.fin-cash{text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px;}
.fin-cash small{display:block;font-size:10.5px;}
.fin-cash b{font-size:18px;font-variant-numeric:tabular-nums;}
.fin-overview{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;}
@media (max-width:640px){.fin-overview{grid-template-columns:1fr;}}
.fo-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;}
.fo-title{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.fo-big{font-size:21px;font-weight:bold;font-variant-numeric:tabular-nums;margin-bottom:6px;}
.fo-big small{font-size:11.5px;font-weight:normal;color:var(--muted);}
.fo-note{font-size:12px;color:var(--muted);margin-top:4px;}
.fo-note b{color:var(--ink);}
.sbar-row{display:grid;grid-template-columns:58px 1fr 62px;align-items:center;gap:6px;font-size:11.5px;margin:4px 0;}
.sbar-row b{text-align:right;font-variant-numeric:tabular-nums;}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);}
.sbar span{height:100%;}
.sbar span+span{box-shadow:inset 1px 0 0 rgba(255,255,255,.55);}
.fo-legend{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10.5px;color:var(--muted);margin-top:6px;}
.fdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:baseline;}
.escape-bar{position:relative;height:16px;border-radius:8px;background:var(--line);overflow:visible;margin:4px 22px 6px 0;}
.escape-bar>div{height:100%;border-radius:8px;}
.escape-bar>span{position:absolute;right:-22px;top:-3px;font-size:15px;}
.sheet-sec .sec-total{margin-left:auto;font-variant-numeric:tabular-nums;}
.pay-hint{font-size:10.5px;color:var(--accent2);opacity:0;transition:opacity .15s;}
.sheet-table tr.liab:hover .pay-hint,.sheet-table tr.sel .pay-hint{opacity:1;}
.bank-box{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);}
/* Borrow / pay-off box stays pinned to the bottom of the finance panel, however long the sheet gets. */
.panel-body .bank-box{position:sticky;bottom:0;z-index:3;background:var(--panel);box-shadow:0 -8px 18px -6px rgba(0,0,0,.18);}
.bank-col{display:flex;flex-direction:column;gap:5px;}
.bank-col.grow{flex:1;min-width:260px;}
.bank-col select{flex:1;min-width:180px;}
.confirm-card.denied{border-top-color:var(--bad);}
.confirm-card.denied .confirm-head{color:var(--bad);}
.evt small.evt-note{color:rgba(255,255,255,.88);font-size:12px;}
.evt a.evt-link{color:#ffd76a;font-weight:bold;}
.evt .evt-mv{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-size:13px;}
.bill-card{background:linear-gradient(135deg,#8e2b2b,#b8551e);}
.bill-amt{font-size:28px;font-weight:bold;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
.bill-cash{font-size:12.5px;opacity:.9;margin:2px 0 10px;}
.bill-pay{background:#fff;color:#8e2b2b;border-color:#fff;font-weight:bold;padding:8px 18px;}
.evt-stepper{display:flex;justify-content:center;align-items:center;gap:6px;margin:8px 0;}
.evt-stepper button{background:#fff;color:#1f2430;border-color:#fff;font-weight:bold;min-width:34px;}
.evt-stepper .evt-max{min-width:0;font-size:12px;background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.7);}
.evt-qty{width:76px;text-align:center;font-size:16px;font-weight:bold;background:#fff;color:#1f2430;border:2px solid #fff;border-radius:8px;padding:5px 6px;}
.evt-qty:focus{outline:3px solid #ffd76a;outline-offset:1px;}
.flash-preview{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 10px;margin:4px 0 10px;text-align:left;font-size:12.5px;}
.fp-row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums;}
.fp-row.fp-total{font-size:14px;border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:4px;margin-bottom:2px;}
.fp-row.fp-warn b{color:#ffd76a;}
.fp-row.fp-bad b{color:#ffb3ad;}
.alert-card .alert-line{margin:4px 0;font-size:13px;}
.standings{flex:none;margin-bottom:8px;}
.standings td{vertical-align:middle;}
.mute-btn{float:right;font-size:15px;padding:3px 9px;line-height:1.2;}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
/* =====================================================================
   Tabletop board UI — styles for tb-board.js
   Fonts (add once in <head>):
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600&display=swap">
   Everything scales with the board's width (cqi units), so the board
   works at any --bs size. The board is a printed object: it keeps its
   own colours in light and dark theme.
   ===================================================================== */

/* ---------- Board + bezel --------------------------------------------- */
.gameboard.tb-board{
  --tb-bezel:#1f4a35;          /* frame colour; also title + buttons */
  --tb-bezel-dark:#0f2a1c;
  --tb-paper:#f3e9d2;          /* square card stock */
  --tb-line:#2a2016;           /* printed lines between squares */
  --tb-ink:#231c14;
  --tb-ink-2:#5b4a36;
  --tb-ink-3:#6b5a44;
  --tb-good:#1c7a52;
  --tb-bad:#b3261e;
  --tb-display:'Alfa Slab One',Georgia,serif;
  --tb-text:'Oswald','Arial Narrow',system-ui,sans-serif;

  container-type:inline-size;
  display:block; gap:0; padding:0;
  width:100%; max-width:640px; aspect-ratio:1/1;
  margin:4px auto 10px;
  background:var(--tb-bezel);
  border:0; border-radius:14px;
  box-shadow:0 18px 36px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.35),
             inset 0 0 0 2px rgba(255,255,255,.08),inset 0 2px 0 rgba(255,255,255,.18);
  font-family:var(--tb-text);
}
/* Inside the game layout, .board-row .gameboard already sets width/height from --bs. */
.board-row .gameboard.tb-board{width:var(--bs);height:var(--bs);max-width:none;margin:0;flex:none;}

.tb-grid{
  margin:1.4cqi; height:calc(100% - 2.8cqi); box-sizing:border-box;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:repeat(7,minmax(0,1fr));
  gap:.22cqi;
  background:var(--tb-line); border:.22cqi solid var(--tb-line);
}

/* ---------- Squares --------------------------------------------------- */
.tb-sq{position:relative;overflow:hidden;background:var(--tb-paper);min-width:0;min-height:0;}
.tb-sq-face{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--tb-paper);}
/* Colour band faces the centre on every side. */
.tb-top    .tb-sq-face{transform:rotate(180deg);}
.tb-right  .tb-sq-face{transform:rotate(-90deg);}
.tb-left   .tb-sq-face{transform:rotate(90deg);}
.tb-c0 .tb-sq-face{transform:rotate(135deg);}
.tb-c1 .tb-sq-face{transform:rotate(-135deg);}
.tb-c2 .tb-sq-face{transform:rotate(-45deg);}
.tb-c3 .tb-sq-face{transform:rotate(45deg);}

.tb-sq-band{
  flex:none;height:23%;display:flex;align-items:center;justify-content:center;
  background:var(--sq);color:#fffaf0;
  font:600 max(6px,1.45cqi)/1 var(--tb-text);letter-spacing:.16cqi;text-transform:uppercase;white-space:nowrap;
  box-shadow:inset 0 -.2cqi 0 rgba(0,0,0,.18);
}
.tb-sq-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5cqi;color:var(--sq);}
.tb-sq-body .tb-icon{width:5cqi;height:5cqi;}

.tb-corner{background:var(--sq);}
.tb-corner .tb-sq-face{background:var(--sq);}
.tb-corner .tb-sq-body{color:#fffaf0;}
.tb-corner .tb-sq-body .tb-icon{width:4.2cqi;height:4.2cqi;}
.tb-sq-name{font:max(7px,1.75cqi)/1 var(--tb-display);letter-spacing:.12cqi;text-transform:uppercase;text-shadow:0 .2cqi 0 rgba(0,0,0,.25);}

/* Square the current player is standing on */
.tb-sq-tokens{position:absolute;inset:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;gap:.3cqi;padding:1cqi;pointer-events:none;}

/* ---------- Icons ----------------------------------------------------- */
.tb-icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.tb-icon .f{fill:currentColor;stroke:none;}
.tb-arrow{width:.8em;height:.8em;fill:currentColor;flex:none;}

/* ---------- Player token (pawn) --------------------------------------- */
.tb-token{
  --pc:#c0392b;
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:max(14px,3.8cqi);height:max(14px,3.8cqi);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 60%,#000));
  border:max(1px,.25cqi) solid color-mix(in srgb,var(--pc) 55%,#000);
  box-shadow:0 .6cqi .8cqi rgba(0,0,0,.45),inset 0 -.35cqi 0 rgba(0,0,0,.25);
  color:#fff;font:max(8px,1.8cqi)/1 var(--tb-display);text-shadow:0 1px 0 rgba(0,0,0,.4);
}
.tb-token.is-active{animation:tbHop 1.4s ease-in-out infinite;}
.tb-token--sm{width:max(12px,2.7cqi);height:max(12px,2.7cqi);font-size:max(7px,1.3cqi);box-shadow:0 .25cqi .4cqi rgba(0,0,0,.35);}
@keyframes tbHop{0%,100%{transform:translateY(0);}50%{transform:translateY(-.7cqi);}}
@media (prefers-reduced-motion:reduce){.tb-token.is-active{animation:none;}}

/* ---------- Centre ---------------------------------------------------- */
.tb-center{
  grid-row:2/7;grid-column:2/7;position:relative;min-height:0;overflow:hidden;
  background-color:#f2e8d2;
  background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px);background-size:7px 7px;
  box-shadow:inset 0 0 4cqi rgba(110,80,40,.25);
}
.tb-center-frame{
  position:absolute;inset:1.3cqi;box-sizing:border-box;
  border:.2cqi solid #b8a27a;outline:.1cqi solid #b8a27a;outline-offset:.45cqi;border-radius:.6cqi;
  padding:1.6cqi 2.2cqi;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqi;
  text-align:center;color:var(--tb-ink);font-family:var(--tb-text);
}

.tb-title{display:flex;flex-direction:column;align-items:center;gap:.3cqi;}
.tb-title-main{font:6.2cqi/1 var(--tb-display);letter-spacing:.3cqi;color:var(--tb-bezel);text-shadow:.3cqi .3cqi 0 #d8a93a,.5cqi .5cqi 0 rgba(60,40,20,.2);}
.tb-title-sub{display:flex;align-items:center;gap:1.2cqi;color:#9b6a14;}
.tb-title-sub span{font:600 max(7px,1.9cqi)/1 var(--tb-text);letter-spacing:1cqi;padding-left:1cqi;text-transform:uppercase;}
.tb-title-sub i{display:block;width:6cqi;height:.2cqi;background:currentColor;}

.tb-turn{
  display:inline-flex;align-items:center;gap:1cqi;padding:.6cqi 2cqi .6cqi .7cqi;
  background:#fffaf0;border:.2cqi solid var(--pc);border-radius:999px;
  box-shadow:0 .35cqi 0 color-mix(in srgb,var(--pc) 60%,#000);
  font:400 max(8px,1.75cqi)/1.2 var(--tb-text);letter-spacing:.05cqi;color:var(--tb-ink);
}
.tb-turn b{font-weight:600;}
.tb-turn-sq{color:var(--sq);text-transform:uppercase;letter-spacing:.12cqi;}

/* Economy tiles */
.tb-econ{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1cqi;width:100%;}
.tb-econ-item{
  --tone:var(--tb-ink-3);
  display:flex;flex-direction:column;align-items:center;gap:.15cqi;min-width:0;
  padding:.9cqi .4cqi .8cqi;margin:0;
  background:#fffaf0;border:.18cqi solid var(--tb-line);border-radius:.9cqi;box-shadow:0 .35cqi 0 var(--tb-line);
  font-family:var(--tb-text);color:var(--tb-ink);cursor:help;
}
.tb-econ-item.tone-good{--tone:var(--tb-good);}
.tb-econ-item.tone-bad{--tone:var(--tb-bad);}
button.tb-econ-item{appearance:none;cursor:pointer;white-space:normal;line-height:normal;}
button.tb-econ-item:hover{transform:translateY(-.15cqi);box-shadow:0 .5cqi 0 var(--tb-line);}
button.tb-econ-item[aria-expanded="true"]{background:#fff3cf;}
.tb-econ-label{font:500 max(6px,1.1cqi)/1.1 var(--tb-text);letter-spacing:.12cqi;text-transform:uppercase;color:var(--tb-ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.tb-econ-label i,.tb-econ-sub i{font-style:normal;}
.tb-econ-label .ls,.tb-econ-sub .ls{display:none;}
.tb-econ-value{display:inline-flex;align-items:center;gap:.3cqi;font:600 max(9px,2.7cqi)/1.1 var(--tb-text);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tb-ink);}
.tb-econ-value .tb-arrow{color:var(--tone);width:.6em;height:.6em;}
.tb-econ-sub{display:inline-flex;align-items:center;gap:.25cqi;font:500 max(6px,1.02cqi)/1.1 var(--tb-text);font-style:normal;letter-spacing:.06cqi;white-space:nowrap;color:var(--tone);}

.tb-rent-table{display:flex;flex-wrap:wrap;justify-content:center;gap:.3cqi 1.2cqi;font:400 max(6.5px,1.15cqi)/1.3 var(--tb-text);color:var(--tb-ink-3);}
.tb-rent-table b{color:var(--tb-ink);font-weight:600;}
.tb-rent-table .tb-arrow{margin-left:.2cqi;}

.tb-econ-foot{
  font:400 max(6.5px,1.2cqi)/1.3 var(--tb-text);letter-spacing:.08cqi;color:var(--tb-ink-2);max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tb-econ-foot b{color:var(--tb-ink);font-weight:600;}

/* Card decks (decorative) */
.tb-decks{display:flex;gap:3cqi;padding:.4cqi 0 .8cqi;}
.tb-deck{width:8.4cqi;height:11.6cqi;}
.tb-deck:nth-child(1){transform:rotate(-5deg);}
.tb-deck:nth-child(2){transform:rotate(3deg);}
.tb-deck:nth-child(3){transform:rotate(-2deg);}
.tb-deck-card{
  width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;
  background:#fffaf0;border:.25cqi solid var(--sq);border-radius:.9cqi;
  box-shadow:.3cqi .3cqi 0 #efe4c8,.35cqi .35cqi 0 .06cqi rgba(0,0,0,.25),
             .65cqi .65cqi 0 color-mix(in srgb,var(--sq) 70%,#000),0 1cqi 1.4cqi rgba(0,0,0,.35);
}
.tb-deck-band{flex:none;height:2.4cqi;display:flex;align-items:center;justify-content:center;background:var(--sq);color:#fffaf0;font:600 max(6px,1.1cqi)/1 var(--tb-text);letter-spacing:.15cqi;text-transform:uppercase;}
.tb-deck-body{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sq);}
.tb-deck-body .tb-icon{width:4cqi;height:4cqi;}

/* Board guide */
.tb-legend-toggle{
  appearance:none;margin:0;min-height:max(24px,3.4cqi);padding:.6cqi 2.2cqi;
  font:500 max(8px,1.25cqi)/1 var(--tb-text);letter-spacing:.14cqi;text-transform:uppercase;
  color:#fffaf0;background:var(--tb-bezel);border:0;border-radius:999px;box-shadow:0 .3cqi 0 var(--tb-bezel-dark);cursor:pointer;
}
.tb-legend-toggle:hover{background:color-mix(in srgb,var(--tb-bezel) 85%,#fff);}
.tb-legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6cqi 1.4cqi;width:100%;text-align:left;font:400 max(6.5px,1.2cqi)/1.25 var(--tb-text);color:var(--tb-ink-2);}
.tb-lg{display:flex;gap:.6cqi;align-items:flex-start;}
.tb-lg .tb-icon{width:max(10px,1.9cqi);height:max(10px,1.9cqi);color:var(--sq);}
.tb-lg b{color:var(--sq);font-weight:600;text-transform:uppercase;letter-spacing:.08cqi;}

/* Small boards: short labels, no decks */
@container (max-width:470px){
  .tb-econ-label .lf,.tb-econ-sub .lf{display:none;} .tb-econ-label .ls,.tb-econ-sub .ls{display:inline;}
  .tb-decks{display:none;}
}

/* ---------- Optional extras ------------------------------------------- */
/* Wooden table behind the board: add class="tb-table" to .board-area (or body). */
.tb-table{
  background-color:#5b3a22;
  background-image:
    repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(88deg,rgba(255,220,170,.05) 0 1px,transparent 1px 23px),
    linear-gradient(90deg,#4e311c,#6a4428 30%,#5a3a21 55%,#6e472a 80%,#4b2f1b);
}
/* Ivory dice for the existing dice box: add class "tb-dice-skin" to .dice-box. */
.tb-dice-skin .die{background:#fffdf7;border-color:#cfc5b0;border-radius:22%;box-shadow:inset -3px -4px 0 #e6dcc7,0 4px 6px rgba(0,0,0,.3);}
.tb-dice-skin .die .pip{background:#231c14;}
.tb-dice-skin .die[aria-label="1"] .pip,.tb-dice-skin .die[aria-label="5"] .pip:nth-child(5){background:#b3261e;}
.pmeta-sq{color:var(--sq);white-space:nowrap;}
.pmeta-sq .tb-icon{width:12px;height:12px;vertical-align:-2px;margin-right:3px;}

/* ---------- Game screen in the board's style ---------------------------
   While a game is on screen (body.tb-page) the whole page is the wooden table,
   and the log, dice box, progress cards and standings are printed paper like the
   board. Paper components re-map the theme variables, so they keep these colours
   in dark mode too (the board is a physical object). */
body.tb-page{
  background-color:#5b3a22;
  background-image:
    repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px),
    repeating-linear-gradient(88deg,rgba(255,220,170,.05) 0 1px,transparent 1px 23px),
    linear-gradient(90deg,#4e311c,#6a4428 30%,#5a3a21 55%,#6e472a 80%,#4b2f1b);
  background-attachment:fixed;
}
body.tb-page #app>h1{font:400 22px/1.1 'Alfa Slab One',Georgia,serif;letter-spacing:.04em;color:#f3e9d2;text-shadow:0 2px 0 rgba(0,0,0,.35);}
body.tb-page .board-wrap>.card{background:transparent;border:0;box-shadow:none;padding:6px 0 0;}
body.tb-page .turn-bar{color:#f3e9d2;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.03em;}
body.tb-page .turn-bar .muted,body.tb-page .turn-bar small{color:#e3d3b0;}
body.tb-page .turn-bar button,body.tb-page .side-toggle{
  font:500 13px/1 'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;

}
body.tb-page .turn-bar button.gold{background:#9b6a14;border-color:#6e4b0e;box-shadow:0 3px 0 #6e4b0e;}
body.tb-page .turn-bar button:hover,body.tb-page .side-toggle:hover{filter:brightness(1.12);}
body.tb-page .side-toggle{padding:14px 10px;box-shadow:0 4px 14px rgba(0,0,0,.35);}
body.tb-page .mute-btn{background:#f3e9d2;border-color:#2a2016;color:#231c14;}
/* Paper components */
body.tb-page .log-panel,body.tb-page .players-overview,body.tb-page .standings{
  --bg:#efe3c6;--panel:#fffaf0;--ink:#231c14;--muted:#6b5a44;--line:#cdbb95;
  background:#f3e9d2;color:#231c14;border:2px solid #2a2016;
  box-shadow:0 12px 26px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.3);
  font-family:'Oswald','Arial Narrow',system-ui,sans-serif;
}
body.tb-page .log-panel{border-radius:12px;}
body.tb-page .log-panel .log-head{background:#1f4a35;color:#fffaf0;border-bottom:2px solid #2a2016;font:500 12px/1 'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:9px 12px;}
body.tb-page .log-panel .log{background:#f3e9d2;color:#5b4a36;font-size:13px;letter-spacing:.01em;}
body.tb-page .log-panel .log div{border-bottom:1px dashed rgba(42,32,22,.25);}
body.tb-page .log-panel .log div:first-child{color:#231c14;font-weight:500;}
body.tb-page .dice-box{background:#efe3c6;border-bottom:2px solid #2a2016;}
body.tb-page .dice-cap{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;color:#231c14;letter-spacing:.02em;}
body.tb-page .players-overview h3,body.tb-page .standings h3{font:400 18px/1.1 'Alfa Slab One',Georgia,serif;color:#1f4a35;letter-spacing:.03em;}
body.tb-page .players-overview .pcard{background:#fffaf0;border-color:#cdbb95;}
body.tb-page .players-overview .pcard.turn{background:color-mix(in srgb,var(--pc) 10%,#fffaf0);}
body.tb-page .players-overview .pname{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;letter-spacing:.02em;}
body.tb-page .players-overview .ppct{font-family:'Oswald','Arial Narrow',system-ui,sans-serif;font-weight:600;}
body.tb-page .players-overview .bar,body.tb-page .standings .bar{background:#e2d4b2;}
body.tb-page .standings td,body.tb-page .standings th{border-bottom-color:rgba(42,32,22,.2);}
body.tb-page .standings button.primary{background:#1f4a35;border-color:#0f2a1c;box-shadow:0 3px 0 #0f2a1c;font:500 13px/1 'Oswald','Arial Narrow',system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;}

/* ---------- Market panel: newspaper financial pages -------------------- */
.side-panel.paper-news{
  --bg:#ece6d6;--panel:#f7f3e8;--ink:#161616;--muted:#555049;--line:#bdb5a2;--accent:#161616;--accent2:#7a5a12;--good:#1d6b3f;--bad:#9b1c1c;--danger:#9b1c1c;
  background:#f4efe2;color:#161616;font-family:'Old Standard TT',Georgia,serif;
  background-image:radial-gradient(rgba(60,50,30,.05) 1px,transparent 1px);background-size:5px 5px;
}
.paper-news .news-head{position:relative;display:block;background:transparent;border-bottom:3px double #161616;padding:12px 18px 6px;}
.paper-news .news-head>button{position:absolute;top:10px;right:14px;}
.paper-news .news-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font:italic 400 12px/1.2 'Old Standard TT',Georgia,serif;border-bottom:1px solid #161616;padding-bottom:4px;margin-right:70px;}
.paper-news .news-title{font:400 clamp(26px,6vw,44px)/1 'UnifrakturMaguntia','Old English Text MT',Georgia,serif;text-align:center;margin:6px 0 4px;letter-spacing:.01em;color:#161616;}
.paper-news .news-rule{display:flex;justify-content:center;gap:22px;border-top:1px solid #161616;padding-top:4px;font:700 11px/1 'Old Standard TT',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;}
.paper-news .panel-body>.card{background:transparent;border:0;padding:4px 0 0;box-shadow:none;}
.paper-news .subtabs{border-bottom:2px solid #161616;gap:0;margin-bottom:10px;}
.paper-news .subtabs button{border:0;border-radius:0;background:transparent;color:#555049;font:700 13px/1 'Old Standard TT',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;padding:8px 6px;}
.paper-news .subtabs button.active{background:#161616;color:#f4efe2;}
.paper-news table{font-family:'Old Standard TT',Georgia,serif;}
.paper-news .mtable-wrap thead th{background:#f4efe2;border-bottom:2px solid #161616;font:700 11px/1.2 'Old Standard TT',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;}
.paper-news td{border-bottom:1px dotted #8a8172;}
.paper-news td.num{font-family:'Courier Prime','Courier New',monospace;font-size:12.5px;}
.paper-news tbody tr:nth-child(odd) td{background:rgba(0,0,0,.025);}
.paper-news tr[onclick]:hover td{background:rgba(122,90,18,.1);}
.paper-news button{border-radius:2px;font-family:'Old Standard TT',Georgia,serif;}
.paper-news button.primary{background:#161616;border-color:#161616;color:#f4efe2;}
.paper-news button.sell{background:#9b1c1c;border-color:#9b1c1c;}
.paper-news .qty{border-radius:2px;border-color:#161616;font-family:'Courier Prime','Courier New',monospace;}
.paper-news small,.paper-news .muted{color:#555049;font-style:italic;}
/* classified ads */
.paper-news .mgrid{gap:10px;}
.paper-news .mcard{background:#fbf8ef;border:1.5px solid #161616;border-radius:0;box-shadow:3px 3px 0 rgba(22,22,22,.18);padding:10px 12px;}
.paper-news .mcard .mtitle{font:700 16px/1.1 'Old Standard TT',Georgia,serif;text-transform:uppercase;letter-spacing:.04em;}
.paper-news .mcard .tag{border-radius:0;font:700 10px/1 'Old Standard TT',Georgia,serif;letter-spacing:.14em;padding:4px 6px;background:#161616 !important;color:#f4efe2;}
.paper-news .mstats span{background:transparent;border:0;border-bottom:1px dotted #8a8172;border-radius:0;color:#161616;font-family:'Old Standard TT',Georgia,serif;padding:2px 2px;}
.paper-news .mheld{color:#555049;font-style:italic;}
.paper-news .chart-box{background:#fbf8ef;border:1px solid #161616;border-radius:0;}

/* ---------- Finance panel: printed statement form ---------------------- */
.side-panel.paper-form{
  --bg:#f3ecd9;--panel:#fffcf2;--ink:#1d2433;--muted:#5d6472;--line:#bfb7a4;--accent:#1f4a35;--accent2:#9b6a14;--good:#1c7a52;--bad:#b3261e;
  background:#fbf6e8;color:#1d2433;font-family:'Oswald','Arial Narrow',system-ui,sans-serif;
  background-image:linear-gradient(rgba(29,36,51,.035) 1px,transparent 1px);background-size:100% 24px;
}
.paper-form .form-head{background:#fbf6e8;border-bottom:3px solid #1d2433;padding:12px 18px 10px;gap:14px;}
.paper-form .form-title small{display:block;font:500 11px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#5d6472;}
.paper-form .form-title h3{font:400 clamp(19px,4.5vw,26px)/1.1 'Alfa Slab One',Georgia,serif;color:#1f4a35;margin:2px 0 0;letter-spacing:.02em;}
.paper-form .form-meta{margin-left:auto;text-align:right;font:500 12px/1.3 'Courier Prime','Courier New',monospace;color:#1d2433;border:1.5px solid #1d2433;padding:4px 10px;}
.paper-form .form-head>button{border-radius:2px;border-color:#1d2433;}
.paper-form .tabs button{border-radius:2px;}
/* boxes, sections and ruled rows */
.paper-form .fin-cash,.paper-form .fo-card,.paper-form .bank-box,.paper-form .hold-card{border:1.5px solid #1d2433;border-radius:0;background:#fffcf2;box-shadow:none;}
.paper-form .fo-title{color:#1d2433;letter-spacing:.14em;}
.paper-form .sheet-sec{border-radius:0;background:#1d2433;color:#fbf6e8;font:500 13px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;margin:12px 0 0;}
.paper-form .sheet-sec .num{border-radius:0;background:#fbf6e8;color:#1d2433;font-family:'Alfa Slab One',Georgia,serif;}
.paper-form .sheet-sec .sec-total{font-family:'Courier Prime','Courier New',monospace;font-weight:700;letter-spacing:0;}
.paper-form .sheet-table{border:1.5px solid #1d2433;border-top:0;background:#fffcf2;}
.paper-form .sheet-table td{border-bottom:1px solid #cfc7b3;padding:4px 8px;font-size:13px;}
.paper-form .sheet-table td.desc{border-right:1px solid #cfc7b3;}
/* the figures look filled in on the form */
.paper-form .sheet-table td.num,.paper-form .fin-cash b,.paper-form .fo-big,.paper-form .sbar-row b,.paper-form .fo-note b{font-family:'Courier Prime','Courier New',monospace;}
.paper-form .sheet-table td.num{font-size:13.5px;color:#1a2a6c;}
.paper-form .sheet-table tr.sub td{color:#5d6472;}
.paper-form .sheet-table tr.sel td{background:rgba(155,106,20,.15);}
.paper-form .panel-body .bank-box{background:#fffcf2;box-shadow:0 -8px 18px -6px rgba(0,0,0,.2);}
.paper-form button,.paper-form input,.paper-form select{border-radius:2px;}
.paper-form button.primary{background:#1f4a35;border-color:#1f4a35;}
.paper-form button.gold{background:#9b6a14;border-color:#9b6a14;}
.move-layer{position:fixed;z-index:48;pointer-events:none;transition:left .13s linear,top .13s linear;}
.move-layer .ml-pawn{position:absolute;inset:0;display:block;}
.move-layer .tb-token{width:100%;height:100%;font-size:calc(100% * 0.5);}
.move-layer .ml-shadow{position:absolute;left:12%;right:12%;bottom:-10%;height:22%;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(1px);}
/* each square is a hop: up in an arc and down again, the shadow shrinking while the pawn is in the air */
.move-layer.hop .ml-pawn{animation:moveHop .13s ease-in-out;}
.move-layer.hop .ml-shadow{animation:moveShadow .13s ease-in-out;}
@keyframes moveHop{0%{transform:translateY(0) scale(1);}50%{transform:translateY(-55%) scale(1.12);}100%{transform:translateY(0) scale(1);}}
@keyframes moveShadow{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.6);opacity:.55;}}
.modal-backdrop.move-wait{visibility:hidden;}
.prop-photo{margin:6px 0 2px;}
.prop-img{display:block;width:100%;height:auto;}
.evt-photo{max-width:260px;margin:6px auto 4px;box-shadow:0 3px 10px rgba(0,0,0,.3);}
/* ---------- Letters (events and bills) ---------- */
.letter{width:min(380px,92vw);height:min(340px,78vh);display:flex;flex-direction:column;margin:0;text-align:left;color:#1d2433;background:#fffdf5;
  font-family:'Courier Prime','Courier New',monospace;padding:12px;border-radius:2px;
  box-shadow:0 14px 34px rgba(0,0,0,.45);
  background-image:repeating-linear-gradient(135deg,#b3261e 0 10px,#fffdf5 10px 16px,#1f5f8f 16px 26px,#fffdf5 26px 32px);}
.letter-head,.letter-body{background:#fffdf5;}
.letter-head{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 8px;border-bottom:1px dashed #b9b09a;}
.letter-addr{font-size:13px;line-height:1.45;}
.letter-addr>span{display:inline-block;font:500 11px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#6b5a44;margin-bottom:4px;}
.letter-post{display:flex;align-items:flex-start;gap:6px;flex:none;}
.letter-mark{width:50px;height:50px;border:1.5px solid rgba(29,36,51,.55);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font:500 9px/1.1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.12em;color:rgba(29,36,51,.7);transform:rotate(-12deg);}
.letter-mark b{font:400 16px/1 'Alfa Slab One',Georgia,serif;letter-spacing:0;}
.letter-stamp{width:46px;height:54px;display:flex;align-items:center;justify-content:center;color:#fffaf0;background:var(--sq);
  outline:3px dotted #fffdf5;outline-offset:-4px;border:3px solid var(--sq);box-shadow:1px 2px 3px rgba(0,0,0,.25);}
.letter-stamp .tb-icon{width:24px;height:24px;}
.letter-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:10px 14px 14px;font-size:14px;line-height:1.5;}
.letter-head{flex:none;}
.letter-body p{margin:0 0 8px;}
.letter-due{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid #1d2433;border-bottom:1.5px solid #1d2433;padding:6px 0;margin:6px 0 8px;}
.letter-due span{font:500 11px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.2em;text-transform:uppercase;}
.letter-due b{font-size:22px;}
.letter-note{font-size:12.5px;color:#5d6472;}
.letter-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:auto;padding-top:6px;}
.letter-actions button{border-radius:2px;font:500 13px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:9px 16px;}
.letter-actions button.primary{background:#1f4a35;border-color:#1f4a35;color:#fffaf0;}
/* ---------- Pawns (sprites) ---------- */
.tb-token.tk{background:none;border:0;border-radius:0;box-shadow:none;text-shadow:none;animation:none;
  width:max(22px,6.6cqi);height:max(22px,6.6cqi);filter:drop-shadow(0 .25cqi .2cqi rgba(0,0,0,.3));}
/* A square with pawns on it fades its own icon so the pawns stand out. */
.tb-sq.has-tokens .tb-sq-body .tb-icon{opacity:.18;}
.tb-token.tk.is-active{animation:none;}
.tb-token.tk .tk-svg,.tk-opt .tk-svg{display:block;width:100%;height:100%;}
.tb-token.tk.tb-token--sm{width:max(16px,3.2cqi);height:max(16px,3.2cqi);filter:none;}
.tb-token.tk.tb-token--card{width:30px;height:30px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.move-layer .tb-token.tk{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));}
.move-layer .ml-shadow{display:none;}
.tk-pick{display:flex;gap:4px;flex:none;}
.tk-opt{width:38px;height:38px;padding:3px;border-radius:8px;border:2px solid var(--line);background:var(--panel);}
.tk-opt.sel{border-color:currentColor;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 30%,transparent);}
.tk-opt:disabled:not(.sel){opacity:.25;}
.tk-opt:disabled.sel{opacity:1;}
/* ---------- Flash deal: a private offer clipped from the newspaper ---------- */
.clip{width:min(380px,92vw);max-height:88vh;overflow:auto;margin:0;text-align:left;color:#161616;background:#fbf8ef;
  border:1.5px solid #161616;box-shadow:4px 4px 0 rgba(22,22,22,.25),0 14px 34px rgba(0,0,0,.4);padding:10px 14px 12px;
  font-family:'Old Standard TT',Georgia,serif;
  background-image:repeating-linear-gradient(0deg,rgba(22,22,22,.025) 0 1px,transparent 1px 3px);}
.clip-top{display:flex;justify-content:space-between;border-bottom:1px solid #161616;padding-bottom:3px;
  font:400 14px/1.2 'UnifrakturMaguntia','Old Standard TT',serif;}
.clip-top span:last-child{font:700 10px/1.6 'Old Standard TT',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;}
.clip-kicker{margin-top:6px;font:700 10px/1 'Old Standard TT',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;}
.clip-title{font:700 21px/1.1 'Old Standard TT',Georgia,serif;text-transform:uppercase;letter-spacing:.03em;border-bottom:3px double #161616;padding:3px 0 5px;}
.clip-photo{border:1px solid #161616;width:62%;margin:8px auto 4px;}
.clip-price{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px;font:700 10px/1 'Old Standard TT',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;}
.clip-price b{font:400 26px/1 'Alfa Slab One',Georgia,serif;letter-spacing:0;}
.clip-text{margin:4px 0 6px;font-size:13.5px;line-height:1.4;}
.clip-link{color:#161616;font-weight:700;}
.clip .evt-stepper{justify-content:flex-start;margin:6px 0;}
.clip .evt-stepper button,.clip .evt-qty{background:#fbf8ef;color:#161616;border:1.5px solid #161616;border-radius:0;}
.clip .evt-stepper .evt-max{font:700 10px/1 'Old Standard TT',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;padding:8px;}
.clip .evt-qty:focus{outline:2px solid #161616;}
.clip .flash-preview{background:none;border:0;border-top:1.5px solid #161616;border-bottom:1.5px solid #161616;border-radius:0;padding:4px 0;margin:6px 0 10px;
  font-family:'Courier Prime','Courier New',monospace;font-size:12.5px;}
.clip .fp-row{border-bottom:1px dotted rgba(22,22,22,.35);}
.clip .fp-row:last-child{border-bottom:0;}
.clip .fp-row.fp-total{font-size:14px;border-bottom:1px solid #161616;}
.clip .fp-row.fp-warn b{color:#8a5a00;}
.clip .fp-row.fp-bad b{color:#b3261e;}
.clip-actions{display:flex;justify-content:flex-end;gap:8px;}
.clip-actions button,.letter-actions button:not(.primary){border-radius:0;font:700 12px/1 'Old Standard TT',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;background:#fbf8ef;color:#161616;border:1.5px solid #161616;}
.clip-actions button.primary{background:#161616;color:#fbf8ef;}
.letter-actions button:not(.primary){font-family:'Oswald','Arial Narrow',sans-serif;font-weight:500;letter-spacing:.1em;border-radius:2px;color:#1d2433;border-color:#1d2433;background:#fffdf5;}
/* ---------- Common popup size: every popup is the same box, text scrolls inside, buttons bottom-right ---------- */
:root{--pop-w:min(380px,92vw);--pop-h:min(340px,80vh);--pop-lw:min(560px,94vw);--pop-lh:min(460px,86vh);}   /* normal + large */
.letter{width:var(--pop-w);height:var(--pop-h);}
.clip{width:var(--pop-lw);height:var(--pop-lh);max-height:none;overflow:hidden;display:flex;flex-direction:column;}
.clip-top,.clip-kicker,.clip-title,.clip-actions{flex:none;}
.clip-body{flex:1;min-height:0;overflow:auto;padding-bottom:4px;}
.clip-deal{display:flex;gap:10px;align-items:flex-start;}
.clip-deal>div:last-child{flex:1;min-width:0;}
.clip-photo{width:44%;flex:none;margin:8px 0 0;}
.clip-actions{padding-top:8px;border-top:1px solid #161616;}
.confirm-card{width:var(--pop-lw);max-width:none;height:var(--pop-lh);display:flex;flex-direction:column;overflow:auto;}
.confirm-card.alert-card,.clip.clip-sm{width:var(--pop-w);height:var(--pop-h);}
/* loan / bank popup and announcements on paper, like the letters */
.confirm-card{background:#fffdf5;color:#1d2433;border:1.5px solid #1d2433;border-top:5px solid var(--accent2);border-radius:2px;}
.confirm-card.denied{border-top-color:#b3261e;}
.confirm-card h3{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;}
.confirm-card .confirm-head{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:500;letter-spacing:.16em;}
.confirm-card table td{font-family:'Courier Prime','Courier New',monospace;border-bottom:1px dotted rgba(29,36,51,.3);}
.confirm-card .muted{color:#5d6472;}
.confirm-card .confirm-actions button{border-radius:2px;font:500 13px/1 'Oswald','Arial Narrow',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;}
.confirm-card .confirm-actions button:not(.gold):not(.sell):not(.primary){background:#fffdf5;color:#1d2433;border:1.5px solid #1d2433;}
.confirm-card .confirm-actions{margin-top:auto;padding-top:12px;}
/* Real estate cards: same height in every row, same header lines whatever the name length */
.mgrid{grid-template-columns:repeat(auto-fill,minmax(max(230px,calc((100% - 20px) / 3)),1fr));grid-auto-rows:minmax(525px,auto);align-content:start;}   /* max 3 per row, fixed size; the panel scrolls */
.mgrid .mcard{display:flex;flex-direction:column;min-width:0;}
.mhead{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;}
.mhead .mtitle{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mhead .tag{margin-top:2px;}
.mcard .mfoot{margin-top:auto;padding-top:6px;}
.letter-foot{flex:none;background:#fffdf5;padding:0 14px 12px;}
.letter-foot .letter-actions{margin-top:0;padding-top:8px;border-top:1px dashed #b9b09a;}
/* forced sale sheet */
.fs-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:'Courier Prime','Courier New',monospace;font-size:13px;margin-bottom:6px;}
.fs-list{flex:1;min-height:0;overflow:auto;border-top:1.5px solid #1d2433;border-bottom:1.5px solid #1d2433;}
.fs-list table{width:100%;border-collapse:collapse;}

// so a crash is a new normal, not a guaranteed rebound — buying the dip is a gamble, not free money.

function leaseRentOf(p,m,qty){let r=0,left=qty; for(const l of leaseList(p,m.id)){const c=Math.min(left,l.qty); r+=c*l.rent; left-=c; if(!left) break;} return r+left*(m.rent||0);}
function removeLeaseUnits(p,id,qty){const ls=(p.leases||{})[id]; if(!ls) return; while(qty>0&&ls.length){const c=Math.min(qty,ls[0].qty); ls[0].qty-=c; qty-=c; if(!ls[0].qty) ls.shift();} if(!ls.length) delete p.leases[id];}
function nextLeaseRenewal(p,id){const ls=leaseList(p,id); return ls.length?Math.min(...ls.map(l=>l.until))-(state.week||0):null;}
// Called once a week: expired leases renew at the current market rent.
function renewLeases(){

}

function rateEvent(dLo,dHi,bankF){

    return txt+"mortgage rates for new purchases "+(d>=0?"up ":"down ")+Math.abs(d).toFixed(1)+" points (now "+mortgageRate().toFixed(1)+"%).";

}

// Event draws: a third personal, a third market-wide, a third instrument-specific, so the many
// specific events don't crowd out the rest.
function pickEvent(){
  const r=Math.random(), type=r<1/3?"personal":r<2/3?"global":"market";
  if(type==="personal"&&Math.random()<LUCK.freq){ const dis=EVENTS.filter(e=>["Medical Emergency","Major Lawsuit","Property Damage"].includes(e.name)); return dis[Math.floor(Math.random()*dis.length)]; }
  const pool=EVENTS.filter(e=>e.type===type);
  return pool[Math.floor(Math.random()*pool.length)];
}

function applyShared(data){

function toggleReady(){

  state.ready=state.ready.slice(0,state.numPlayers);
  while(state.ready.length<state.numPlayers) state.ready.push(false);
  state.ready[state.myIdx]=!state.ready[state.myIdx];

}
// Every online mutation calls pushState() after changing local `state`.
// Host: relay the new snapshot to every connected guest. Guest: send it to the host,
// who applies it, then relays it onward to everyone else (star topology).
function pushState(){
  if(!state.online) return;
  const payload={type:"state",data:sharedSnapshot()};
  if(state.isHost){
    Object.values(hostConns).forEach(c=>{ if(c&&c.open) try{c.send(payload);}catch(e){} });
  }else if(hostConn&&hostConn.open){
    try{hostConn.send(payload);}catch(e){}
  }

function claimSeatOnHost(name){

  else { state.names=state.names.map((n,i)=>i===idx?name:n); }

const ICE_CONFIG={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},

function joinFail(msg){

async function joinRoomFlow(){
  const name=(state.joinName||"").trim();
  const room=FIXED_ROOM;
  if(!name){state.joinError="Enter your name first.";render();return;}
  state.joinError="Connecting…"; render();
  try{ localStorage.setItem("cf_room",room); localStorage.setItem("cf_name",name); }catch(e){}
  try{
    await loadPeerJS();
  }catch(e){
    joinFail("Couldn't load the networking library — continuing locally on this device."); return;
  }
  const hostId="cashflow-ratrace-"+room;
  state.room=room; state.myName=name;
  clearTimeout(connectTimer);
  connectTimer=setTimeout(()=>{
    if(!state.online) joinFail("Timed out reaching the lobby (network may be blocking it) — continuing locally on this device.");
  },15000);
  // Try to become the host by claiming the room's fixed peer id.
  const hostPeer=new Peer(hostId,{debug:1,config:ICE_CONFIG});
  let settled=false;
  hostPeer.on("open",()=>{
    if(settled) return; settled=true; clearTimeout(connectTimer);
    peer=hostPeer; state.isHost=true; state.online=true; state.mode="online"; state.joinError="";
    state.numPlayers=2; state.names=["",""]; state.profs=[0,0]; state.ready=[false,false]; state.players=[]; state.turn=0; state.pending=null; state.log=[]; state.listings=[]; state.listingSeq=1; state.phase="setup";
    state.names[0]=name; state.myIdx=0;
    peer.on("connection",conn=>{
      hostConns[conn.peer]=conn;
      conn.on("data",msg=>{
        if(!msg) return;
        if(msg.type==="hello"){
          const idx=claimSeatOnHost(msg.name);
          conn.__idx=idx;
          conn.send({type:"welcome",myIdx:idx});
          pushState();
        }else if(msg.type==="state"){
          applyShared(msg.data);
          broadcastExcept(msg,conn.peer);
          render();
        }
      });
      conn.on("close",()=>{ delete hostConns[conn.peer]; });
    });
    render();
  });
  hostPeer.on("error",err=>{
    if(settled) return;
    if(err&&err.type==="unavailable-id"){
      settled=true; clearTimeout(connectTimer);
      try{hostPeer.destroy();}catch(e){}
      // Someone is already hosting this room — join as a guest instead.
      const guestPeer=new Peer(undefined,{debug:1,config:ICE_CONFIG});
      let guestSettled=false;
      const guestTimer=setTimeout(()=>{ if(!guestSettled){ guestSettled=true; joinFail("Couldn't connect to the host (network may be blocking the connection) — continuing locally on this device."); } },15000);
      guestPeer.on("open",()=>{
        peer=guestPeer;
        const conn=guestPeer.connect(hostId,{reliable:true});
        hostConn=conn;
        conn.on("open",()=>{ conn.send({type:"hello",name:name}); });
        conn.on("data",msg=>{
          if(!msg) return;
          if(msg.type==="welcome"){
            if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); }
            state.myIdx=msg.myIdx; state.isHost=false; state.online=true; state.mode="online"; state.joinError=""; state.phase="setup";
            render();
          }else if(msg.type==="state"){
            applyShared(msg.data); render();
          }
        });
        conn.on("close",()=>{ state.joinError="Lost connection to the host. You can keep playing locally on this device."; state.online=false; render(); });
        conn.on("error",()=>{ if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); joinFail("Couldn't connect to the host — continuing locally on this device."); } });
      });
      guestPeer.on("error",()=>{
        if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); joinFail("Couldn't reach the lobby — continuing locally on this device."); }
      });
    }else{
      settled=true; clearTimeout(connectTimer);
      joinFail("Couldn't set up online play in this browser — continuing locally on this device.");
    }
  });
}

// Total monthly expenses as on the real game sheet (taxes included) — used for payday, Downsized and the escape check.
function totalExpenses(p){return p.taxes+p.otherExp+p.mortgagePmt+p.carPmt+p.ccPmt+p.retailPmt+p.kids*p.childExp+p.bankLoanPmt+leftPmt(p);}
// Leftover mortgage: when property is sold in a forced sale the player gets half its value in cash and
// its mortgage stays with them (p.leftMortgage = {bal, rate}, rate balance-weighted, fixed), paid monthly
// as an expense until paid off from the Finance panel.
function leftPmt(p){const l=p.leftMortgage; return l&&l.bal>0?mortgagePmtFor(l.bal,l.rate):0;}
function addLeftover(p,amt,rate){ if(!(amt>0)) return; const l=p.leftMortgage||{bal:0,rate}; l.rate=(l.bal*l.rate+amt*rate)/(l.bal+amt); l.bal+=amt; p.leftMortgage=l; }
// ---- Property cash flow ----
// A property mortgage costs balance × the shared mortgage rate (annual %, moved by events) ÷ 12 each
// month, and a property's cash flow is its rent minus that payment. Paying a mortgage down therefore
// lowers its payment — the game shows the numbers but never spells that out.
const MORTGAGE_RATE0=7, MORTGAGE_RATE_MIN=2, MORTGAGE_RATE_MAX=12;
// Each game starts at a random mortgage rate between 4.5% and 5.5%.
function startMortgageRate(){return Math.round(rnd(4.5,5.5)*10)/10;}
// Every property offer comes with its own terms, like the real game's deal cards:
//  - down payment: bell curve around 10% (0–30%). Low or zero down = bigger mortgage, so the cash flow
//    is small or negative from day one.
//  - running costs (property tax, insurance, repairs): bell curve around 26% of rent (10–42%). Some
//    buildings are cheap to run, some are money pits.
function pickDownPct(){return Math.round(Math.max(0,Math.min(30,10+8*randn())));}
function pickCostPct(){return Math.round(Math.max(10,Math.min(42,26+8*randn())));}
function costsFor(m,qty,costPct){return Math.round((m.rent||0)*qty*(costPct==null?25:costPct)/100);}
// Running costs on what a player owns: p.reCostPct[id] is the unit-weighted average of the costs
// they bought into; it follows the current rent, so rent events move costs too.
function propCosts(p,m){const pct=(p.reCostPct||{})[m.id]; return Math.round(propRent(p,m)*(pct==null?25:pct)/100);}
function mortgageRate(){return state.mortgageRate||MORTGAGE_RATE0;}
// Mortgages are fixed-rate: each property's mortgage keeps the rate from when it was bought
// (p.reRate[id], balance-weighted if bought in several goes). Rate events only change the rate for
// new purchases. mortgagePmtFor(bal) prices a new mortgage at today's rate.
function mortgagePmtFor(bal,rate){return Math.round(bal*(rate==null?mortgageRate():rate)/100/12);}
function lockedRate(p,id){const r=(p.reRate||{})[id]; return r==null?mortgageRate():r;}
function propMortgagePmt(p,id){return mortgagePmtFor(((p.reMortgage||{})[id])||0,lockedRate(p,id));}
function propNet(p,m){return propRent(p,m)-propCosts(p,m)-propMortgagePmt(p,m.id);}
// Passive income: dividends from stocks + each property's rent minus its mortgage payment.
function passiveIncome(p){return MARKET.reduce((s,m)=>s+(m.type==="realestate"?propNet(p,m):(p.holdings[m.id]||0)*(m.div||0)),0);}
// Change in monthly passive income from buying qty units at `price` (for the bank's lending check).
function incomeDeltaBuy(m,qty,price,downPct,costPct,rent){
  if(m.type!=="realestate") return qty*(m.div||0);
  const r=(rent==null?(m.rent||0):rent)*qty, cost=price*qty;
  return r-Math.round(r*(costPct==null?25:costPct)/100)-mortgagePmtFor(cost-reDown(cost,downPct));
}
function incomeDeltaSell(p,m,qty){
  if(m.type!=="realestate") return -qty*(m.div||0);
  const r=leaseRentOf(p,m,qty), pct=(p.reCostPct||{})[m.id];
  return -(r-Math.round(r*(pct==null?25:pct)/100)-mortgagePmtFor(mortgageShare(p,m.id,qty),lockedRate(p,m.id)));
}
function payCash(p,amt){
  p.cash-=amt;
  if(p.cash<0){
    const need=Math.ceil(-p.cash/1000)*1000;
    p.bankLoanBal+=need; p.bankLoanPmt=bankPmtFor(p.bankLoanBal);
    p.cash+=need;
    log(p.name+" took a "+fmt(need)+" bank loan to cover expenses.");
  }
}

// One oscillator note: freq in Hz (optionally sliding to `to`), start offset `at` and length `dur` in seconds.

// A short burst of filtered noise (dice clatter, card shuffle).
function noise(c,dur,o){

  src.buffer=buf; f.type="bandpass"; f.frequency.value=o.freq||2500; f.Q.value=o.q||1.2; g.gain.value=o.vol||0.25;

// ---- Bills you can't refuse, fire sale and bankruptcy ----
// payBill() is for mandatory costs (doodads, Downsized, negative paydays, lawsuits, theft). In order:
//  1. pay from cash;
//  2. borrow from the bank (it lends while monthly cash flow is >= $0, even if the loan takes it below);
//  3. fire sale: stocks at market price, then properties at 50% of market value (worst cash flow
//     first; the bank takes the mortgage out of the proceeds and forgives any shortfall);
//  4. if still short with nothing left to sell: negative cash flow = bankrupt (out of the game);
//     otherwise an emergency bank loan covers the rest.
const FIRE_SALE_RE=0.5;
function payBill(p,amt,what){
  if(p.bankrupt) return;
  sfx("cost");
  if(p.cash>=amt){ p.cash-=amt; return; }
  const lim=loanCheck(p,0,0).max;
  if(lim>0){
    const L=Math.min(lim,Math.ceil((amt-p.cash)/1000)*1000);
    p.bankLoanBal+=L; p.bankLoanPmt=bankPmtFor(p.bankLoanBal); p.cash+=L;
    log(p.name+" took a "+fmt(L)+" bank loan to cover "+what+".");
    if(p.cash>=amt){ p.cash-=amt; return; }
  }
  const lines=fireSale(p,amt-p.cash);
  if(p.cash>=amt){
    p.cash-=amt;
    raiseAlert("Fire sale — "+p.name,[p.name+" couldn't cover "+what+" ("+fmt(amt)+") and the bank wouldn't lend more, so assets were sold:",...lines]);
    return;
  }
  if(monthlyCashflow(p)<0){ goBankrupt(p,what,amt,lines); return; }
  payCash(p,amt);
  log("Emergency loan: "+p.name+" had nothing left to sell, so the bank covered "+what+".");
  if(lines.length) raiseAlert("Fire sale — "+p.name,[p.name+" couldn't cover "+what+" ("+fmt(amt)+"), so assets were sold:",...lines,"The bank covered the rest with an emergency loan."]);
}
function fireSellable(p){return MARKET.some(m=>(p.holdings[m.id]||0)>0);}
// Removes units from a holding and keeps all per-holding bookkeeping (mortgage, cost basis, buy marks,
// running costs, flash-deal locks) consistent. Returns the mortgage share that went with them.
function removeUnits(p,m,qty){
  const held=p.holdings[m.id]||0, payoff=mortgageShare(p,m.id,qty);
  if(p.costBasis&&p.costBasis[m.id]) p.costBasis[m.id]-=Math.round(p.costBasis[m.id]*qty/held);
  if(payoff) p.reMortgage[m.id]-=payoff;
  p.holdings[m.id]=held-qty;
  if(m.type==="realestate") removeLeaseUnits(p,m.id,qty);
  let over=lockedQty(p,m.id)-p.holdings[m.id];
  if(over>0&&p.locks&&p.locks[m.id]) p.locks[m.id]=activeLocks(p,m.id).map(l=>{const cut=Math.min(l.qty,over); over-=cut; return {...l,qty:l.qty-cut};}).filter(l=>l.qty>0);
  if(!p.holdings[m.id]){ ['reMortgage','reRate','costBasis','buyMarks','reCostPct','locks'].forEach(k=>{ if(p[k]) delete p[k][m.id]; }); }
  return payoff;
}
function fireSale(p,need){
  const lines=[];
  // Stocks first, whole shares, just enough to cover what's needed.
  MARKET.filter(m=>m.type==="stock"&&(p.holdings[m.id]||0)>0).sort((a,b)=>b.price*p.holdings[b.id]-a.price*p.holdings[a.id]).forEach(m=>{
    if(need<=0) return;
    const qty=Math.min(p.holdings[m.id],Math.ceil(need/m.price)), got=qty*m.price;
    removeUnits(p,m,qty); p.cash+=got; need-=got;
    lines.push("Sold "+qty+"x "+m.name+" at "+fmt(m.price)+" = "+fmt(got));
  });
  // Then properties at half value, worst cash flow per unit first.
  const props=()=>MARKET.filter(m=>m.type==="realestate"&&(p.holdings[m.id]||0)>0).sort((a,b)=>propNet(p,a)/p.holdings[a.id]-propNet(p,b)/p.holdings[b.id]);
  while(need>0&&props().length){
    const m=props()[0], sale=Math.round(m.price*FIRE_SALE_RE), rate=lockedRate(p,m.id), payoff=removeUnits(p,m,1);
    addLeftover(p,payoff,rate); p.cash+=sale; need-=sale;
    lines.push("Sold "+m.name+" at half value "+fmt(sale)+(payoff?"; its "+fmt(payoff)+" mortgage stays as a debt":""));
  }
  lines.forEach(l=>log(""+p.name+": "+l.replace(/^\S+ /,"")));
  return lines;
}
function goBankrupt(p,what,amt,lines){
  p.bankrupt=true; p.cash=0;
  const n=state.players.length, gone=state.players.filter(x=>x.bankrupt&&x!==p).length;
  p.place=n-gone; p.finishWeek=state.week||0;
  log(""+p.name+" is BANKRUPT — couldn't pay "+what+" with negative cash flow and nothing left to sell. Out of the game (#"+p.place+").");
  raiseAlert(""+p.name+" is bankrupt",[...(lines.length?[p.name+"'s assets were sold in a fire sale:",...lines]:[]),"It still wasn't enough to cover "+what+" ("+fmt(amt)+"), the cash flow is negative and the bank won't lend more.",p.name+" is out of the game and finishes #"+p.place+"."]);
  checkGameOver();
}

// ---- Bills from the board (doodads, Downsized, costly events) ----
// The player presses Pay. With enough cash it's paid at once; otherwise the loan popup opens with
// "Take $X loan and pay", or — if the bank won't lend — "Sell assets and pay", which runs payBill's
// fire sale (and bankruptcy if nothing is left). Cancel lets the player sell things first; the turn
// can't end while the bill is unpaid. mode: undefined = Pay button, "loan"/"force" = confirmed.
function payPendingBill(mode){
  if(state.online&&state.myIdx!==state.turn) return;
  const pd=state.pending; if(!pd||pd.kind!=="bill") return;
  const p=state.players[state.turn];
  if(!mode&&p.cash<pd.amt){
    const L=Math.ceil((pd.amt-p.cash)/1000)*1000, ok=loanCheck(p,L,0).ok;
    if(!ok){ sfx("denied"); state.forceSell={sel:{}}; render(); return; }
    state.confirm={idx:state.turn,title:"Pay "+pd.what,due:pd.amt,auto:L,loan:L,cashDelta:L-pd.amt,incomeDelta:0,bill:true,
      confirmLabel:ok?"Take "+fmt(L)+" loan and pay":"Sell assets and pay",run:()=>payPendingBill(ok?"loan":"force")};
    render(); return;
  }
  state.pending=null;
  payBill(p,pd.amt,pd.what);
  if(!p.bankrupt) log(p.name+" paid "+fmt(pd.amt)+" for "+pd.what+".");
  checkAllWins(); checkGameOver();
  syncRender();

// ---- Places ----
// Escaping the Rat Race takes the next free place from the top; going bankrupt takes the next free
// place from the bottom. The game ends when at most one player is still racing (they take the last
// open place).
function isRacing(p){return !p.escaped&&!p.bankrupt;}
function checkWin(p){
  if(isRacing(p) && passiveIncome(p)>=totalExpenses(p)){
    p.escaped=true;
    p.place=state.players.filter(x=>x.escaped).length; p.finishWeek=state.week||0;
    if(state.players.length===1){
      const wk=state.week||0, record=saveSoloBest(state.speed||"medium",wk), best=soloBest(state.speed||"medium");
      p.newRecord=record;
      log(p.name+" escaped the Rat Race in "+wk+" weeks"+(record?" (new best time)":"")+".");
      raiseAlert("You escaped the Rat Race",["Escaped in "+wk+" weeks ("+speedCfg().label+" game).",record?"New best time on this device.":"Your best: "+best+" weeks."]);
      checkGameOver(); return;
    }
    log(p.name+" escaped the Rat Race"+(p.place===1?" and wins.":" — finishes #"+p.place+".")+" Passive income now covers all expenses.");
    raiseAlert(p.name+(p.place===1?" wins":" finishes #"+p.place),[p.name+" escaped the Rat Race: passive income "+fmt(passiveIncome(p))+"/mo now covers expenses of "+fmt(totalExpenses(p))+"/mo.",p.place===1?"Everyone else keeps playing for the other places.":""].filter(Boolean));
    checkGameOver();
  }
}
// Rent/dividend/rate events and other players' trades can push anyone over the line, not just the
// player whose turn it is.
function checkAllWins(){state.players.forEach(checkWin);}
function checkGameOver(){
  const racing=state.players.filter(isRacing);
  // Solo games end when the one player escapes or goes bankrupt; otherwise when at most one is left.
  if(state.phase!=="playing"||racing.length>(state.players.length===1?0:1)) return;
  racing.forEach(p=>{
    const taken=new Set(state.players.map(x=>x.place).filter(Boolean));
    let pl=1; while(taken.has(pl)) pl++;
    p.place=pl; p.finishWeek=state.week||0;
    log(""+p.name+" is the last one in the Rat Race and finishes #"+pl+".");
  });
  state.phase="over"; state.pending=null;
  log("Game over. Final standings are in.");
}
// Shared announcements (fire sale, bankruptcy, a win). Everyone sees them once; each browser
// dismisses them locally (state.alertSeen), so one player closing it doesn't hide it for others.
function raiseAlert(title,lines){state.alert={id:(state.alert&&state.alert.id||0)+1,title,lines};}
function dismissAlert(){state.alertSeen=state.alert&&state.alert.id; render();}
function alertHTML(){

  medium:{label:"Medium",p:[1,0.8,0.3],  snap:0.25, max:12, rent:10, bonus:0,   time:"~30 min", note:"balanced",

  slow:  {label:"Slow",  p:[0.8,0.35,0], snap:0.35, max:9,  rent:10, bonus:0,   time:"~45 min", note:"deals are scarce"},

// Per-speed, per-player-count profession fine-tuning: each mode scales a profession's monthly expenses

function setSpeed(k){

}
function setPlayers(n){

  state.numPlayers=n;

  state.profs=Array(n).fill(0).map((_,i)=>oldProfs[i]!=null?oldProfs[i]:0);
