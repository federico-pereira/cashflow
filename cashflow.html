  const propVal=props.reduce((s,m)=>s+(p.holdings[m.id]||0)*m.price,0);
  const totalAssets=p.cash+stockVal+propVal;
  const totalLiab=p.mortgageBal+p.carBal+p.ccBal+p.retailBal+p.bankLoanBal+reMortgageTotal(p);
  const netWorth=totalAssets-totalLiab;
  const lendMax=loanCheck(p,0,0).max;
  const debt=selectedDebt(p);
  const incomeParts=[{k:"salary",label:"Salary",v:p.salary},{k:"div",label:"Dividends",v:dividends},{k:"rent",label:"Rent",v:reIncome}];
  const expParts=[{k:"taxes",label:"Taxes",v:p.taxes},{k:"mortgage",label:"Home mortgage",v:p.mortgagePmt},{k:"car",label:"Car loan",v:p.carPmt},{k:"cc",label:"Credit card",v:p.ccPmt},{k:"retail",label:"Retail debt",v:p.retailPmt},{k:"other",label:"Other",v:p.otherExp},{k:"kids",label:"Children",v:childTotal},{k:"bank",label:"Bank loan",v:p.bankLoanPmt}];
  const flowScale=Math.max(totalIncome,totalExp,1);
  const nwScale=Math.max(totalAssets,totalLiab,1);
  const cls=v=>v>0?"up":v<0?"down":"flat";
  const sign=v=>(v>=0?"+":"−")+fmt(Math.abs(v));
  // Click a liability row to pick it in the payoff bar below.
  const liabRow=(key,name,bal,dotKey)=>`<tr class="${bal>0?"liab":""}${debt&&debt.key===key?" sel":""}" ${bal>0?`onclick="selectDebt('${key}')" title="Click to pay this off"`:""}><td class="desc">${dotKey?finDot(dotKey):""}${name}${bal>0?' <span class="pay-hint">pay ›</span>':""}</td><td class="num">${fmt(bal)}</td></tr>`;
  const expRow=(k,name,v)=>`<tr><td class="desc">${finDot(k)}${name}</td><td class="num">${fmt(v)}</td></tr>`;
  return `
  <div class="fin-head">
    <div><b style="font-size:16px;">${p.name}</b> <span class="muted">· ${p.profession}</span>${p.escaped?' <span class="tag" style="background:var(--good)">Escaped the Rat Race!</span>':""}</div>
    <div class="fin-cash"><small>Cash on hand</small><b>${fmt(p.cash)}</b></div>
  </div>

  <div class="fin-overview">
    <div class="fo-card">
      <div class="fo-title">💵 Monthly cash flow</div>
      <div class="fo-big ${cls(cashflow)}">${sign(cashflow)}<small> every Payday</small></div>
      <div class="sbar-row"><span>Income</span>${stackBar(incomeParts,flowScale)}<b>${fmt(totalIncome)}</b></div>
      <div class="sbar-row"><span>Expenses</span>${stackBar(expParts,flowScale)}<b>${fmt(totalExp)}</b></div>
      <div class="fo-legend">${[...incomeParts,...expParts].filter(x=>x.v>0).map(x=>`<span>${finDot(x.k)}${x.label}</span>`).join("")}</div>
    </div>
    <div class="fo-card">
      <div class="fo-title">🎯 Escape the Rat Race</div>
      <div class="fo-big ${escapedNow?"up":""}">${rawPct}%<small> of expenses covered by passive income</small></div>
      <div class="escape-bar"><div style="width:${Math.min(100,rawPct)}%;background:${escapedNow?"var(--good)":"var(--accent2)"}"></div><span>🏁</span></div>
      <div class="fo-note">Passive income <b>${fmt(pi)}</b> / expenses <b>${fmt(totalExp)}</b></div>
      <div class="fo-note">${escapedNow?"✅ Your assets pay for your life — you're out!":`You need <b>${fmt(totalExp-pi)}/mo</b> more passive income (dividends or rent).`}</div>
    </div>
    <div class="fo-card">
      <div class="fo-title">🏦 Net worth</div>
      <div class="fo-big ${cls(netWorth)}">${sign(netWorth)}</div>
      <div class="sbar-row"><span>Assets</span><div class="sbar"><span style="width:${(totalAssets/nwScale*100).toFixed(2)}%;background:var(--good)"></span></div><b>${fmt(totalAssets)}</b></div>
      <div class="sbar-row"><span>Debts</span><div class="sbar"><span style="width:${(totalLiab/nwScale*100).toFixed(2)}%;background:var(--bad)"></span></div><b>${fmt(totalLiab)}</b></div>
      <div class="fo-note">${lendMax>0?`The bank will lend you up to <b>${fmt(lendMax)}</b>.`:`The bank won't lend you more right now — cash flow too low.`}</div>
    </div>
  </div>

  <div class="balcols with-trends">
   <div>
    <div class="sheet-sec"><span class="num">1</span>Income <span class="sec-total">${fmt(totalIncome)}</span></div>
    <table class="sheet-table">
     ${expRow("salary","Salary",p.salary)}
     ${expRow("div","Interest / Dividends",dividends)}
     ${expRow("rent","Real Estate (net rent)",reIncome)}
     ${props.map(m=>`<tr class="sub"><td class="desc">🏠 ${m.name}: rent ${fmt(p.holdings[m.id]*m.rent)} − costs ${fmt(propCosts(p,m))} − mortgage ${fmt(propMortgagePmt(p,m.id))}</td><td class="num ${propNet(p,m)<0?"down":""}">${sgn(propNet(p,m))}</td></tr>`).join("")}
    </table>

    <div class="sheet-sec"><span class="num">2</span>Expenses <span class="sec-total">${fmt(totalExp)}</span></div>
    <table class="sheet-table">
     ${expRow("taxes","Taxes",p.taxes)}
     ${expRow("mortgage","Home Mortgage Payment",p.mortgagePmt)}
     ${expRow("car","Car Loan Payment",p.carPmt)}
     ${expRow("cc","Credit Card Payment",p.ccPmt)}
     ${expRow("retail","Retail Debt Payment",p.retailPmt)}
     ${expRow("other","Other Expenses",p.otherExp)}
     ${expRow("kids","Children ("+p.kids+" × "+fmt(p.childExp)+")",childTotal)}
     ${expRow("bank","Bank Loan Payment",p.bankLoanPmt)}
    </table>
   </div>
   <div>
    <div class="sheet-sec"><span class="num">3</span>Assets <span class="sec-total">${fmt(totalAssets)}</span></div>
    <table class="sheet-table">
     <tr><td class="desc">💰 Cash on hand</td><td class="num">${fmt(p.cash)}</td></tr>
     ${stocks.map(m=>`<tr><td class="desc">📈 ${m.name} <span class="muted">${p.holdings[m.id]} sh @ ${fmt(m.price)}</span></td><td class="num">${fmt((p.holdings[m.id]||0)*m.price)}</td></tr>`).join("")}
     ${props.map(m=>`<tr><td class="desc">🏠 ${m.name}${p.holdings[m.id]>1?" ×"+p.holdings[m.id]:""}</td><td class="num">${fmt((p.holdings[m.id]||0)*m.price)}</td></tr>`).join("")}
    </table>

    <div class="sheet-sec"><span class="num">4</span>Liabilities <span class="sec-total">${fmt(totalLiab)}</span></div>
    <table class="sheet-table">
     ${liabRow("mortgage","Home Mortgage",p.mortgageBal,"mortgage")}
     ${liabRow("car","Car Loan",p.carBal,"car")}
     ${liabRow("cc","Credit Card Debt",p.ccBal,"cc")}
     ${liabRow("retail","Retail Debt",p.retailBal,"retail")}
     ${props.map(m=>liabRow("re:"+m.id,"🏠 Mortgage — "+m.name,mortgageShare(p,m.id,p.holdings[m.id]))).join("")}
     ${liabRow("bank","Bank Loan",p.bankLoanBal,"bank")}
    </table>
   </div>
   ${holdingsTrendsHTML(p)}
  </div>

  <div class="bank-box">
   <div class="bank-col">
     <div class="fo-title">🏦 Borrow</div>
     <div class="row" style="flex-wrap:nowrap;gap:6px;">
       <input class="qty" style="width:84px;" type="number" step="1000" min="1000" value="${state.loanTakeAmt||1000}" onchange="setLoanTakeAmt(this.value)">
       <button class="gold" onclick="takeLoan(${idx})" ${lendMax>0?"":"disabled"}>Take Loan</button>
     </div>
     <small class="muted">${lendMax>0?`Up to ${fmt(lendMax)} · costs 10% of the loan every month.`:"Not available — the bank needs your cash flow to cover the payment."}</small>
   </div>
   <div class="bank-col grow">
     <div class="fo-title">💳 Pay off debt <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:normal;">— or click a liability row</span></div>
     ${debt?`<div class="row" style="gap:6px;"><select onchange="selectDebt(this.value)">${debtList(p).map(d=>`<option value="${d.key}" ${d.key===debt.key?"selected":""}>${d.name} — ${fmt(d.bal)}${d.pmt?" ("+fmt(d.pmt)+"/mo)":""}</option>`).join("")}</select>
       <input class="qty" style="width:84px;" type="number" step="${debt.key==="bank"?1000:100}" min="1" value="${state.loanPayAmt||1000}" onchange="setLoanPay(this.value)">
       <button onclick="payDebt(${idx})" ${p.cash>0?"":"disabled"}>Pay</button>
       <button class="primary" onclick="payDebt(${idx},true)" ${p.cash>=debt.bal?"":"disabled"} title="${p.cash>=debt.bal?"":"Not enough cash to clear it"}">Pay off all ${fmt(debt.bal)}</button></div>
       <small class="muted">${debt.key.startsWith("re:")?`Property mortgage at ${mortgageRate().toFixed(1)}% — partial payments allowed.`:debt.pmt?`Paying it off in full cuts expenses by <b>${fmt(debt.pmt)}/mo</b>${debt.key==="bank"?" (partial payments in $1,000 steps)":"; partial payments lower it proportionally"}.`:`No monthly payment — paying it down means you keep more when you sell the property.`}</small>`
     :`<span class="muted">You're debt-free! 🎉</span>`}
   </div>
  </div>`;
}
function pendingHTML(){
  if(!state.pending) return "";
  const myTurn=!state.online||state.myIdx===state.turn;
  let inner="";
  if(state.pending.kind==="charity"){
    const p=state.pending.p;
    inner=myTurn?`<div class="card" style="margin:0;max-width:360px;width:100%;"><h3>❤ Charity — ${p.name}</h3>
     <p>Donate 10% of your total income (<b>${fmt(charityAmount(state.players[state.turn]))}</b>)?</p>
     <p class="muted" style="margin-top:-4px;">❤ Benefit: for your next ${CHARITY_TURNS} turns you may roll <b>1 or 2 dice</b> — move faster to reach more Paydays and deals.</p>
     <div class="row"><button class="primary" onclick="charityPay()">Donate</button><button onclick="charitySkip()">Skip</button></div></div>`
     :`<div class="card" style="margin:0;max-width:360px;width:100%;"><h3>❤ Charity — ${p.name}</h3><p class="muted">Waiting for ${p.name} to decide…</p></div>`;
  }else if(state.pending.kind==="eventinfo"){
    const ev=state.pending.ev;
    inner=`<div class="evt" style="margin:0;max-width:360px;width:100%;"><h3>🎲 ${ev.name}</h3><p>${ev.desc}</p>
     ${myTurn?`<button onclick="continueEvent()" style="background:#fff;color:#333;">Continue</button>`:`<p style="opacity:.85;">Waiting for the current player to continue…</p>`}</div>`;
  }else if(state.pending.kind==="flashdeal"){
    const pd=state.pending, m=MARKET.find(x=>x.id===pd.id), p=pd.p;
    inner=myTurn?`<div class="evt" style="margin:0;max-width:360px;width:100%;"><h3>📣 Flash Deal — ${p.name}</h3>
     <p>Private offer on <b>${m.name}</b> at <b>${fmt(pd.dealPrice)}</b>/unit. Good for this turn only — is it a bargain or a trap? ${m.type==="realestate"?`<br><span class="evt-mv">Current market value: <b>${fmt(m.price)}</b></span>`:`<a href="#" class="evt-link" onclick="togglePanel('market');return false;">Check the Market</a> before you decide.`} <br><small class="evt-note">🔒 What you buy here is locked for your next ${FLASH_LOCK_TURNS} turns — no instant flipping.</small>${m.type==="realestate"?` Terms: <b>${pd.downPct}% down</b>; the rest becomes a mortgage.`:""}</p>
     ${pd.qtyMax!==1?`<div class="evt-stepper">
      <button onclick="setFlashQty(state.flashQty-1,true)" aria-label="One less">−</button>
      <input class="evt-qty" type="number" min="1" value="${state.flashQty}" oninput="setFlashQty(this.value)" onchange="setFlashQty(this.value,true)" aria-label="Quantity">
      <button onclick="setFlashQty(state.flashQty+1,true)" aria-label="One more">+</button>
      <button class="evt-max" onclick="setFlashQty(flashMaxCash(),true)" title="Most you can buy with cash, no loan">Max cash</button>
     </div>`:""}
     <div class="flash-preview" id="flash-preview">${flashPreviewHTML()}</div>
     <div class="row" style="justify-content:center;">
      <button onclick="buyFlashDeal()" style="background:#fff;color:#333;">Buy Now</button>
      <button onclick="passFlash()" style="background:transparent;color:#fff;border-color:#fff;">Pass</button>
     </div></div>`
     :`<div class="evt" style="margin:0;max-width:360px;width:100%;"><h3>📣 Flash Deal — ${p.name}</h3><p>Waiting for ${p.name} to decide…</p></div>`;
  }
  return `<div class="modal-backdrop">${inner}</div>`;
}
function playersOverviewHTML(){
  // Only public info here (profession, board square, family, progress %) — cash and the full
  // statement stay private to each player online.
  const cards=state.players.map((pl,i)=>{
    const exp=totalExpenses(pl), pi=passiveIncome(pl);
    const rawPct=Math.round(pi/Math.max(1,exp)*100);
    const barPct=Math.min(100,rawPct/1.5);
    const markerPct=Math.min(100,100/1.5);
    const isTurn=i===state.turn&&state.phase==="playing", isMe=state.online&&state.myIdx===i;
    const done=pl.escaped||rawPct>=100, sq=SQUARES[BOARD[pl.pos]];
    return `<div class="pcard${isTurn?" turn":""}" style="--pc:${pl.color}">
      <div class="ptop">
        ${playerToken(pl,i,isTurn?" active":"")}
        <div style="min-width:0;">
          <div class="pname">${pl.name}${isMe?` <span class="badge soft">You</span>`:""}${isTurn?` <span class="badge">▶ Turn</span>`:""}</div>
          <div class="pmeta">${pl.profession} · on ${sq.emoji} ${sq.label}</div>
        </div>
        <div class="ppct ${done?"up":""}">${rawPct}%</div>
      </div>
      <div class="bar" style="position:relative;margin:7px 0 5px;">
        <div style="width:${barPct}%;background:${done?'var(--good)':'var(--accent2)'};"></div>
        <div style="position:absolute;left:${markerPct}%;top:0;bottom:0;width:2px;background:var(--ink);" title="100% — escape line"></div>
      </div>
      <div class="pchips">
        ${pl.escaped?`<span class="chip good">${["🥇","🥈","🥉"][pl.place-1]||"🏁"} Escaped · #${pl.place}</span>`:""}
        ${pl.bankrupt?`<span class="chip" style="color:var(--bad);border-color:var(--bad);">💀 Bankrupt · #${pl.place}</span>`:""}
        ${pl.place&&!pl.escaped&&!pl.bankrupt?`<span class="chip">🏁 Finished · #${pl.place}</span>`:""}
        ${pl.charityTurns>0?`<span class="chip" title="May roll 1 or 2 dice">❤ ${pl.charityTurns} charity turn${pl.charityTurns===1?"":"s"}</span>`:""}
        ${pl.skipTurns>0?`<span class="chip" style="color:var(--bad);" title="Downsized">⚠️ sits out ${pl.skipTurns} turn${pl.skipTurns===1?"":"s"}</span>`:""}
        ${pl.kids?`<span class="chip">👶 ×${pl.kids}</span>`:""}
      </div>
    </div>`;
  }).join("");
  return `<div class="card players-overview">
   <div class="between" style="margin-bottom:6px;"><h3 style="margin:0;">🎯 Rat Race Progress</h3><small class="muted">Passive income ÷ expenses · line = 100% escape</small></div>
   <div class="pgrid">${cards}</div></div>`;
}
// Final standings: places 1..n, how each player finished, and their numbers at the end.
function standingsHTML(){
  const rows=state.players.slice().sort((a,b)=>(a.place||99)-(b.place||99)).map(p=>{
    const medal=["🥇","🥈","🥉"][p.place-1]||"#"+p.place;
    const worth=p.cash+MARKET.reduce((s,m)=>s+(p.holdings[m.id]||0)*m.price,0)-(p.mortgageBal+p.carBal+p.ccBal+p.retailBal+p.bankLoanBal+reMortgageTotal(p));
    return `<tr><td style="font-size:18px;">${medal}</td><td><span style="color:${p.color}">●</span> <b>${p.name}</b><br><small class="muted">${p.profession}</small></td>
      <td>${p.escaped?"Escaped in week "+p.finishWeek:p.bankrupt?"💀 Bankrupt in week "+p.finishWeek:"Last one left in the Rat Race"}</td>
      <td class="num">${fmt(passiveIncome(p))}/mo</td><td class="num">${p.bankrupt?"—":(worth<0?"−":"")+fmt(Math.abs(worth))}</td></tr>`;
  }).join("");
  return `<div class="card standings"><h3>🏁 Game over — final standings</h3>
    <table><thead><tr><th></th><th>Player</th><th>Result</th><th class="num">Passive income</th><th class="num">Net worth</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function gameHTML(over){
  const p=state.players[state.turn];
  const myTurn=!state.online||state.myIdx===state.turn;
  const tabs=state.players.map((pl,i)=>`<button class="${state.viewTab===i?'active':''}" onclick="setTab(${i})" style="border-left:3px solid ${pl.color}">${pl.name}${pl.escaped?" ✓":""}</button>`).join("");
  const myIdx=state.online?state.myIdx:state.viewTab;
  const financePanel=state.panel==="finance"?`<div class="panel-backdrop left" onclick="if(event.target===this)closePanel()">
      <div class="side-panel wide xwide">
        <div class="panel-head"><h3 style="margin:0;">💰 ${state.online?"Your":""} Financial Statement</h3><button onclick="closePanel()">✕ Close</button></div>
        <div class="panel-body">
          ${state.online?`<p class="muted" style="margin-top:0;">Only you can see your full statement. Everyone sees the shared Rat Race Progress bars below the board.</p>`:`<div class="tabs">${tabs}</div>`}
          ${statementHTML(state.players[myIdx], myIdx)}
        </div>
      </div>
    </div>`:"";
  const marketPanel=state.panel==="market"&&!over?`<div class="panel-backdrop right" onclick="if(event.target===this)closePanel()">
      <div class="side-panel wide">
        <div class="panel-head"><h3 style="margin:0;">📊 Market</h3><button onclick="closePanel()">✕ Close</button></div>
        <div class="panel-body">
          ${marketHTML()}
        </div>
      </div>
    </div>`:"";
  return `<h1>💰 Cashflow: Rat Race</h1>
  ${state.online?`<p class="muted" style="margin:-6px 0 8px;">Online room <b>${state.room}</b> — playing as <b>${state.myName}</b>.</p>`:""}
  ${over?standingsHTML():""}
  <button class="side-toggle left gold" onclick="togglePanel('finance')">💰<br>Finance</button>
  ${!over?`<button class="side-toggle right gold" onclick="togglePanel('market')">📊<br>Market</button>`:""}
  <div class="board-wrap">
    <div class="card">
      <div class="between turn-bar">
        <div class="turn-who"><b>Turn:</b> <span style="color:${p.color}">●</span> ${p.name}${state.online&&!myTurn?` <small class="muted">(waiting for ${p.name} to roll/end turn — you can still trade)</small>`:""}</div>
        ${!over&&!state.pending&&myTurn?(state.hasRolled
          ?`<button class="primary" onclick="endTurn()">✅ End Turn</button>`
          :(p.charityTurns>0
            ?`<div class="row" style="flex-wrap:nowrap;gap:6px;"><small class="roll-note" style="color:var(--bad);">❤ ${p.charityTurns} charity turn${p.charityTurns===1?"":"s"}</small><button class="primary" onclick="rollDice(1)">🎲 Roll 1</button><button class="gold" onclick="rollDice(2)">🎲🎲 Roll 2</button></div>`
            :`<button class="primary" onclick="rollDice(1)">🎲 Roll Dice</button>`)):""}
      </div>
      <div class="board-area"><div class="board-row">
        ${boardHTML()}
        <div class="log-panel"><div class="log-head">📜 Game Log</div><div class="log">${state.log.map(l=>`<div>${l}</div>`).join("")}</div></div>
      </div></div>
    </div>
    ${!over?pendingHTML():""}
  </div>
  ${playersOverviewHTML()}
  ${financePanel}
  ${marketPanel}
  ${confirmHTML()}
  ${alertHTML()}`;
}
render();
</script>
</body>
</html>
