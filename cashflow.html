<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow: Rat Race</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e2ddd0;
  --accent:#1f7a5c; --accent2:#b8860b; --danger:#b3261e; --good:#1f7a5c; --bad:#b3261e;
  --p0:#c0392b;--p1:#2471a3;--p2:#af7ac5;--p3:#e67e22;--p4:#16a085;--p5:#7f8c8d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#181a1f;--panel:#22252c;--ink:#eceef1;--muted:#9aa0a8;--line:#33363e;}
}
:root[data-theme="dark"]{--bg:#181a1f;--panel:#22252c;--ink:#eceef1;--muted:#9aa0a8;--line:#33363e;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100%;}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 6px;}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;font-size:13.5px;}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
button.gold{background:var(--accent2);color:#fff;border-color:var(--accent2);}
button.sell{background:var(--danger);color:#fff;border-color:var(--danger);}
button:disabled{opacity:.4;cursor:not-allowed;}
input,select{font-family:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
html,body{height:100%;}
.wrap{max-width:720px;margin:0 auto;padding:16px;}
.wrap.fit-screen{max-width:1040px;height:100vh;max-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.wrap.fit-screen h1{flex:none;font-size:19px;}
.wrap.fit-screen .win{flex:none;}
.wrap.fit-screen .board-wrap{flex:1;min-height:0;display:flex;flex-direction:column;}
.wrap.fit-screen .board-wrap>.card{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:8px;overflow:hidden;}
.wrap.fit-screen .board-wrap>.card>.between{flex:none;}
/* Fixed-height turn bar: whether it shows Roll, Roll 1/Roll 2, End Turn or nothing (while a popup is
   open), the board below keeps exactly the same space and never jumps. */
.turn-bar{height:38px;flex-wrap:nowrap;overflow:hidden;}
.turn-bar .turn-who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.turn-bar button{white-space:nowrap;}
@media (max-width:560px){.turn-bar .roll-note{display:none;}}
/* Board + log side by side. .board-area is a size container, so the board is the largest square that fits
   and the log panel has exactly the board's height: new log lines scroll inside it, never resizing the board.
   On narrow screens the log drops below the board at a fixed height. */
.board-area{flex:1;min-height:0;container-type:size;margin:6px 0 4px;}
.board-row{--bs:min(100cqh,100cqw - 260px,640px);height:100%;display:flex;gap:10px;justify-content:center;align-items:flex-start;}
.board-row .gameboard{width:var(--bs);height:var(--bs);max-width:none;margin:0;flex:none;}
.log-panel{flex:1 1 0;min-width:200px;max-width:320px;height:var(--bs);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;}
.log-panel .log-head{flex:none;font-weight:bold;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);}
.log-panel .log{flex:1;min-height:0;max-height:none;margin:0;border:0;padding:6px 10px 8px;overflow-y:auto;}
.log-panel .log div{padding:3px 0;border-bottom:1px dashed var(--line);line-height:1.35;}
.log-panel .log div:first-child{color:var(--ink);}
@container (max-width:620px){
  .board-row{--bs:min(100cqw,100cqh - 104px);flex-direction:column;align-items:center;gap:6px;}
  .log-panel{flex:none;width:100%;max-width:none;height:98px;}
}
.wrap.fit-screen .players-overview{flex:none;max-height:26vh;overflow-y:auto;}
.board-wrap{position:relative;}
.side-toggle{position:fixed;top:50%;transform:translateY(-50%);z-index:60;padding:14px 8px;font-size:13px;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.side-toggle.left{left:0;border-radius:0 10px 10px 0;border-left:none;}
.side-toggle.right{right:0;border-radius:10px 0 0 10px;border-right:none;}
.panel-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:flex;align-items:center;}
.panel-backdrop.left{justify-content:flex-start;}
.panel-backdrop.right{justify-content:flex-end;}
.side-panel{background:var(--panel);width:auto;max-width:420px;max-height:92vh;overflow:hidden;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.35);margin:0 10px;border-radius:14px;display:flex;flex-direction:column;}
.side-panel.wide{width:min(94vw,860px);max-width:min(94vw,860px);}
.side-panel.xwide{width:min(96vw,1120px);max-width:min(96vw,1120px);}
.panel-backdrop.left .side-panel{border-radius:0 14px 14px 0;margin-left:0;}
.panel-backdrop.right .side-panel{border-radius:14px 0 0 14px;margin-right:0;}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 16px;}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;}
.mgrid .mcard{margin-bottom:0;padding:9px 10px;}
.mtable-wrap{overflow-x:auto;}
.mtable-wrap table{min-width:680px;font-size:12.5px;}
.mtable-wrap thead th{position:sticky;top:0;background:var(--panel);z-index:1;}
.panel-head{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
small,.muted{color:var(--muted);font-size:12.5px;}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;color:#fff;}
.gameboard{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:5px;aspect-ratio:1/1;max-width:560px;margin:4px auto 10px;padding:6px;border-radius:16px;background:linear-gradient(135deg,rgba(31,122,92,.16),rgba(184,134,11,.16));border:1px solid var(--line);}
.cell{--sq:#888;border:1px solid color-mix(in srgb,var(--sq) 35%,var(--line));border-top:4px solid var(--sq);border-radius:8px;background:color-mix(in srgb,var(--sq) 11%,var(--panel));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;min-width:0;min-height:0;transition:box-shadow .2s;}
.cell .sq-emoji{font-size:clamp(12px,2.5vmin,20px);line-height:1;}
.cell .sq-label{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6px,1.2vmin,9.5px);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sq);line-height:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cell.here{box-shadow:0 0 0 2px var(--turncol),0 0 14px var(--turncol);z-index:1;}
.cell .tokens{display:flex;gap:1px;flex-wrap:wrap;justify-content:center;max-width:100%;}
.cell .sq-label.long{letter-spacing:0;font-size:clamp(5.5px,1.02vmin,8px);}
.ptok{flex:none;width:clamp(12px,2.3vmin,18px);height:clamp(12px,2.3vmin,18px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font:700 clamp(7px,1.3vmin,10px)/1 system-ui,-apple-system,'Segoe UI',sans-serif;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);vertical-align:middle;}
.ptok.active{animation:tokpulse 1.6s ease-in-out infinite;}
@keyframes tokpulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
@media (prefers-reduced-motion:reduce){.ptok.active{animation:none;}}
.board-center{grid-row:2/7;grid-column:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(4px,1.2vmin,10px);text-align:center;background:var(--panel);border-radius:12px;border:1px dashed color-mix(in srgb,var(--accent2) 50%,var(--line));padding:clamp(6px,1.6vmin,14px);min-height:0;overflow:hidden;}
.bc-title{font-weight:bold;font-size:clamp(12px,2.6vmin,20px);letter-spacing:.06em;color:var(--accent);}
.bc-title small{display:block;font-size:.55em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);}
.bc-turn{font-size:clamp(8px,1.5vmin,12px);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--pc) 14%,var(--bg));border:1px solid var(--pc);display:inline-flex;align-items:center;gap:5px;}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2px,.6vmin,5px) clamp(6px,1.4vmin,12px);text-align:left;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(6.5px,1.25vmin,10.5px);line-height:1.25;width:100%;}
.legend .lg{display:flex;gap:4px;align-items:flex-start;color:var(--muted);}
.legend .lg b{color:var(--sq);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;}
.pcard{--pc:#888;border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:10px;padding:8px 10px;background:var(--bg);}
.pcard.turn{background:color-mix(in srgb,var(--pc) 9%,var(--bg));box-shadow:0 0 0 1.5px var(--pc);}
.pcard .ptop{display:flex;align-items:center;gap:8px;}
.pcard .ptop .ptok{width:26px;height:26px;font-size:12px;}
.pcard .pname{font-weight:bold;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .pmeta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard .ppct{margin-left:auto;font-weight:bold;font-size:16px;font-variant-numeric:tabular-nums;}
.pcard .bar{height:8px;}
.pchips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden;height:19px;}
.chip{white-space:nowrap;}
.chip{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);}
.chip.good{color:var(--good);border-color:var(--good);}
.badge{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:999px;background:var(--pc);color:#fff;vertical-align:middle;}
.badge.soft{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.hold-head{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;cursor:pointer;}
.hold-head .mini-spark{width:60px;}
.hold-card:hover{border-color:var(--accent2);}
.hold-card.open{border-color:var(--accent2);background:var(--panel);}
.tok{width:12px;height:12px;border-radius:50%;display:inline-block;margin:1px;border:1px solid #0003;}
/* Event/charity/flash-deal popup: no dimming layer — only the card itself catches clicks, so Finance and
   Market stay usable; it sits below the side tabs (60) and panels (80). */
.modal-backdrop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;pointer-events:none;}
.modal-backdrop>*{pointer-events:auto;box-shadow:0 12px 40px rgba(0,0,0,.35);}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.tabs button{padding:5px 10px;font-size:13px;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
table{width:100%;border-collapse:collapse;font-size:13px;}
td,th{padding:4px;border-bottom:1px dashed var(--line);text-align:left;}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0;}
.bar>div{height:100%;background:var(--good);}
.log{max-height:100px;overflow-y:auto;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:8px;}
.win{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;text-align:center;padding:14px;border-radius:12px;}
.evt{background:linear-gradient(135deg,#6a3fa0,#3b6fb5);color:#fff;text-align:center;padding:14px;border-radius:12px;}
.up{color:var(--good);font-weight:bold;} .down{color:var(--bad);font-weight:bold;} .flat{color:var(--muted);}
.qty{width:56px;font-weight:bold;color:var(--ink);background:var(--panel);border:1.5px solid color-mix(in srgb,var(--ink) 35%,var(--line));text-align:center;}
.qty:focus{outline:2px solid var(--accent2);outline-offset:1px;}
.qty-cost{font-size:10.5px;color:var(--muted);text-align:center;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.sheet-sec{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px 12px;margin:10px 0 4px;font-weight:bold;font-size:13px;}
.sheet-sec .num{background:var(--bg);color:var(--ink);border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
.sheet-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
.sheet-table td{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12.5px;}
.sheet-table td.desc{width:62%;overflow-wrap:break-word;}
.sheet-table td.num{text-align:right;font-variant-numeric:tabular-nums;width:38%;white-space:nowrap;}
.sheet-table tr.total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:bold;padding-top:6px;}
.balcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.balcols.with-trends{grid-template-columns:1fr 1fr minmax(230px,1fr);}
@media (max-width:900px){.balcols.with-trends{grid-template-columns:1fr 1fr;}.balcols.with-trends>.trends{grid-column:1/-1;}}
@media (max-width:640px){.balcols,.balcols.with-trends{grid-template-columns:1fr;}}
.hold-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
.hold-card .between{gap:4px;}
.hold-card .chart{margin-top:4px;}
.hold-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:2px 0 8px;}
.hold-legend i{display:inline-block;width:14px;height:0;border-top:2px dashed var(--accent2);vertical-align:middle;margin-right:4px;}
.hold-legend b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);vertical-align:middle;margin-right:4px;}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:8px 0;}
.summary div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:0;}
.summary small{font-size:11px;}
.summary b{display:block;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.head-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
.floor{display:flex;gap:10px;flex-wrap:wrap;padding:4px 2px 8px;}
.lcard{min-width:158px;max-width:158px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;}
.subtabs{display:flex;gap:6px;margin:4px 0 12px;}
.subtabs button{flex:1;padding:7px 6px;font-size:13px;}
.subtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.mcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.mcard .mtitle{font-weight:bold;font-size:14.5px;}
.mcard .mprice{font-size:17px;font-weight:bold;}
.mstats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.mstats span{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px;font-size:11px;color:var(--muted);white-space:nowrap;}
.mactions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.mheld{margin-left:auto;font-size:11.5px;color:var(--muted);}
.chart{display:block;width:100%;height:auto;margin-top:6px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;}
.chart .hit{fill:transparent;cursor:crosshair;}
.chart .hit:hover+.dot{r:4.5;}
.chart-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 4px;margin-top:8px;}
.mini-spark{display:block;width:72px;height:24px;}
.confirm-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.confirm-card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:5px solid var(--accent2);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.4);width:100%;max-width:400px;padding:16px 18px;}
.confirm-card .confirm-head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent2);font-weight:bold;margin-bottom:4px;}
.confirm-card table td{padding:5px 4px;font-size:13px;}
.confirm-card td.num{white-space:nowrap;}
.confirm-card tr.big td{font-size:15px;font-weight:bold;border-bottom:2px solid var(--line);}
.confirm-warn{background:rgba(179,38,30,.1);border:1px solid rgba(179,38,30,.35);color:var(--bad);border-radius:8px;padding:7px 10px;font-size:12.5px;margin-top:10px;}
.sheet-table tr.sub td{font-size:11.5px;color:var(--muted);padding-left:18px;}
.sheet-table tr.liab{cursor:pointer;}
.sheet-table tr.liab:hover td{background:var(--bg);}
.sheet-table tr.sel td{background:rgba(184,134,11,.14);font-weight:bold;}
.fin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.fin-cash{text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 12px;}
.fin-cash small{display:block;font-size:10.5px;}
.fin-cash b{font-size:18px;font-variant-numeric:tabular-nums;}
.fin-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
@media (max-width:900px){.fin-overview{grid-template-columns:1fr;}}
.fo-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;}
.fo-title{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.fo-big{font-size:21px;font-weight:bold;font-variant-numeric:tabular-nums;margin-bottom:6px;}
.fo-big small{font-size:11.5px;font-weight:normal;color:var(--muted);}
.fo-note{font-size:12px;color:var(--muted);margin-top:4px;}
.fo-note b{color:var(--ink);}
.sbar-row{display:grid;grid-template-columns:58px 1fr 62px;align-items:center;gap:6px;font-size:11.5px;margin:4px 0;}
.sbar-row b{text-align:right;font-variant-numeric:tabular-nums;}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);}
.sbar span{height:100%;}
.sbar span+span{box-shadow:inset 1px 0 0 rgba(255,255,255,.55);}
.fo-legend{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:10.5px;color:var(--muted);margin-top:6px;}
.fdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:baseline;}
.escape-bar{position:relative;height:16px;border-radius:8px;background:var(--line);overflow:visible;margin:4px 22px 6px 0;}
.escape-bar>div{height:100%;border-radius:8px;}
.escape-bar>span{position:absolute;right:-22px;top:-3px;font-size:15px;}
.sheet-sec .sec-total{margin-left:auto;font-variant-numeric:tabular-nums;}
.pay-hint{font-size:10.5px;color:var(--accent2);opacity:0;transition:opacity .15s;}
.sheet-table tr.liab:hover .pay-hint,.sheet-table tr.sel .pay-hint{opacity:1;}
.bank-box{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);}
.bank-col{display:flex;flex-direction:column;gap:5px;}
.bank-col.grow{flex:1;min-width:260px;}
.bank-col select{flex:1;min-width:180px;}
.confirm-card.denied{border-top-color:var(--bad);}
.confirm-card.denied .confirm-head{color:var(--bad);}
.evt small.evt-note{color:rgba(255,255,255,.88);font-size:12px;}
.evt a.evt-link{color:#ffd76a;font-weight:bold;}
.evt .evt-mv{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);font-size:13px;}
.evt-stepper{display:flex;justify-content:center;align-items:center;gap:6px;margin:8px 0;}
.evt-stepper button{background:#fff;color:#1f2430;border-color:#fff;font-weight:bold;min-width:34px;}

// Market events move both the price and its anchor (the level the weekly random walk drifts toward),
// so a crash is a new normal, not a guaranteed rebound — buying the dip is a gamble, not free money.
function shiftOne(m,f){ m.price=Math.max(1,Math.round(m.price*f)); m.anchor=(m.anchor||m.basePrice0)*f; }
function shiftMarket(type,f){MARKET.forEach(m=>{if(m.type===type) shiftOne(m,f);});}
// Market-specific events hit one instrument (or a few). Rent and dividend changes are persistent
// and synced with the market snapshot.
function shiftIds(ids,f){ids.forEach(id=>shiftOne(MARKET.find(m=>m.id===id),f));}
function scaleRent(ids,f){MARKET.forEach(m=>{if(m.type==="realestate"&&(!ids||ids.includes(m.id))) m.rent=Math.max(0,Math.round(m.rent*f/5)*5);});}
function addDiv(id,d){const m=MARKET.find(x=>x.id===id); m.div=Math.max(0,Math.round((m.div+d)*100)/100);}
function moveMortgageRate(d){state.mortgageRate=Math.round(Math.max(MORTGAGE_RATE_MIN,Math.min(MORTGAGE_RATE_MAX,mortgageRate()+d))*10)/10;}
// Every event rolls its own size, so no two crashes (or bonuses, or rate moves) are the same. run()
// applies the effect and returns the description with the actual numbers.
function rnd(a,b){return a+Math.random()*(b-a);}
function rndStep(a,b,step){return Math.round(rnd(a,b)/step)*step;}
const pctOf=f=>Math.round(Math.abs(f-1)*100)+"%";
const nameOf=id=>MARKET.find(m=>m.id===id).name;
// Price move on one or more instruments, optionally with a rent change (property) or dividend change (stock).
function specific(ids,lo,hi,extra){
  return ()=>{
    const f=rnd(lo,hi); shiftIds(ids,f);
    const who=ids.map(nameOf).join(" and ");
    let txt=who+(ids.length>1?" values ":" ")+(f>=1?"rise ":"fall ")+pctOf(f);
    if(extra&&extra.rent){const r=rnd(extra.rent[0],extra.rent[1]); scaleRent(ids,r); txt+=", rents "+(r>=1?"+":"−")+pctOf(r);}
    if(extra&&extra.div){const d=rndStep(extra.div[0],extra.div[1],0.25); addDiv(ids[0],d); txt+=", dividend "+(d>=0?"+":"−")+"$"+Math.abs(d).toFixed(2)+"/share";}
    return txt+".";
  };
}
function rateEvent(dLo,dHi,bankF){
  return pl=>{
    const d=rndStep(dLo,dHi,0.1); moveMortgageRate(d);

    if(bankF){const f=rnd(bankF[0],bankF[1]); pl.forEach(x=>{if(x.bankLoanBal>0)x.bankLoanPmt=Math.round(x.bankLoanPmt*f);}); txt="Bank loan payments "+(f>=1?"rise ":"ease ")+pctOf(f)+"; ";}
    return txt+"mortgage rates "+(d>=0?"up ":"down ")+Math.abs(d).toFixed(1)+" points (now "+mortgageRate().toFixed(1)+"%).";
  };
}

// Event draws: a third personal, a third market-wide, a third instrument-specific, so the many
// specific events don't crowd out the rest.
function pickEvent(){
  const r=Math.random(), type=r<1/3?"personal":r<2/3?"global":"market";
  const pool=EVENTS.filter(e=>e.type===type);
  return pool[Math.floor(Math.random()*pool.length)];
}
const BOARD=["payday","market","doodad","event","charity","doodad","market","payday","downsized","event","doodad","baby","market","payday","doodad","event","charity","market","payday","doodad","downsized","event","baby","market"];
const BOARD_COORDS=(()=>{const n=7,c=[];for(let col=1;col<=n;col++)c.push([1,col]);for(let row=2;row<=n;row++)c.push([row,n]);for(let col=n-1;col>=1;col--)c.push([n,col]);for(let row=n-1;row>=2;row--)c.push([row,1]);return c;})();
const COLORS=["var(--p0)","var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)"];
const fmt=n=>"$"+Math.round(n).toLocaleString("en-US");
let state={phase:"setup",numPlayers:2,names:["",""],profs:[0,0],players:[],turn:0,pending:null,hasRolled:false,log:[],viewTab:0,qty:{},flashQty:1,loanTakeAmt:1000,loanPayAmt:1000,listings:[],listingSeq:1,panel:null,marketTab:"stock",selectedStock:null,selectedHolding:null,confirm:null,debtSel:null,
  online:false,isHost:false,room:null,myIdx:null,myName:"",joinName:"",joinRoom:"",joinError:"",ready:[false,false]};
const FIXED_ROOM="HOME";
// UI-local defaults (qty inputs) must exist for EVERY player's browser, not just the
// host's — a guest never runs startGame() locally, it only receives synced game state, so these
// can't be seeded there. Seed them once, up front, for every known market instrument.

try{ const sr=localStorage.getItem("cf_room"), sn=localStorage.getItem("cf_name"); if(sr) state.joinRoom=sr; if(sn) state.joinName=sn; }catch(e){}

// ---- Online sync (peer-to-peer via PeerJS/WebRTC — no account needed) ----
let peer=null, hostConns={}, hostConn=null, connectTimer=null;
function snapshotMarket(){
  return MARKET.map(m=>({id:m.id,price:m.price,prevPrice:m.prevPrice,history:m.history,high52:m.high52,low52:m.low52,basePrice0:m.basePrice0,anchor:m.anchor,rent:m.rent,div:m.div}));
}
function applyMarketSnapshot(arr){
  if(!arr) return;
  arr.forEach(s=>{const m=MARKET.find(x=>x.id===s.id); if(m){m.price=s.price;m.prevPrice=s.prevPrice;m.history=s.history;m.high52=s.high52;m.low52=s.low52;m.basePrice0=s.basePrice0;m.anchor=s.anchor;if(s.rent!=null)m.rent=s.rent;if(s.div!=null)m.div=s.div;}});
}
function sharedSnapshot(){
  return {phase:state.phase==="join"?"setup":state.phase,numPlayers:state.numPlayers,names:state.names,profs:state.profs,ready:state.ready,
    players:state.players,turn:state.turn,pending:state.pending,hasRolled:state.hasRolled,log:state.log,listings:state.listings,listingSeq:state.listingSeq,week:state.week,mortgageRate:state.mortgageRate,alert:state.alert||null,
    market:snapshotMarket(),updatedAt:Date.now()};
}
function applyShared(data){
  if(!data) return;
  if(data.phase) state.phase=data.phase;
  if(data.numPlayers) state.numPlayers=data.numPlayers;
  if(data.names) state.names=data.names;
  if(data.profs) state.profs=data.profs;
  if(data.ready) state.ready=data.ready;
  if(data.players) state.players=data.players;
  if(typeof data.turn==="number") state.turn=data.turn;
  state.pending=data.pending||null;
  state.hasRolled=!!data.hasRolled;
  state.log=data.log||state.log;
  state.listings=data.listings||state.listings;
  if(data.listingSeq) state.listingSeq=data.listingSeq;
  if(typeof data.week==="number") state.week=data.week;
  if(typeof data.mortgageRate==="number") state.mortgageRate=data.mortgageRate;
  state.alert=data.alert||null;
  applyMarketSnapshot(data.market);
}
function toggleReady(){
  if(state.myIdx==null) return;
  state.ready=state.ready.slice(0,state.numPlayers);
  while(state.ready.length<state.numPlayers) state.ready.push(false);
  state.ready[state.myIdx]=!state.ready[state.myIdx];
  if(state.online) pushState();
  render();
}
// Every online mutation calls pushState() after changing local `state`.
// Host: relay the new snapshot to every connected guest. Guest: send it to the host,
// who applies it, then relays it onward to everyone else (star topology).
function pushState(){
  if(!state.online) return;
  const payload={type:"state",data:sharedSnapshot()};
  if(state.isHost){
    Object.values(hostConns).forEach(c=>{ if(c&&c.open) try{c.send(payload);}catch(e){} });
  }else if(hostConn&&hostConn.open){
    try{hostConn.send(payload);}catch(e){}
  }
}
function broadcastExcept(payload,exceptId){
  Object.entries(hostConns).forEach(([id,c])=>{ if(id!==exceptId&&c&&c.open) try{c.send(payload);}catch(e){} });
}
function setJoinField(k,v){state[k]=v;}
function chooseLocalMode(){
  if(peer){try{peer.destroy();}catch(e){}}
  peer=null; hostConns={}; hostConn=null;
  state.mode="local";state.online=false;state.myIdx=null;state.phase="setup";render();
}
function loadPeerJS(){
  return new Promise((resolve,reject)=>{
    if(window.Peer) return resolve(window.Peer);
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js";
    s.onload=()=>window.Peer?resolve(window.Peer):reject(new Error("peerjs failed to load"));
    s.onerror=()=>reject(new Error("peerjs failed to load"));
    document.head.appendChild(s);
  });
}
function claimSeatOnHost(name){
  let idx=state.names.findIndex(n=>n&&n.trim().toLowerCase()===name.toLowerCase());
  if(idx<0) idx=state.names.findIndex(n=>!n||!n.trim());
  if(idx<0){ idx=state.names.length; state.numPlayers=state.numPlayers+1; state.names=[...state.names,name]; state.profs=[...state.profs,0]; state.ready=[...state.ready,false]; }
  else { state.names=state.names.map((n,i)=>i===idx?name:n); }
  while(state.ready.length<state.numPlayers) state.ready.push(false);
  state.ready[idx]=false;
  return idx;
}
// Public STUN + free OpenRelay TURN (turn relay helps when a direct P2P
// route can't be found, e.g. behind strict/symmetric NATs on either side).
const ICE_CONFIG={iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}
]};
function joinFail(msg){
  clearTimeout(connectTimer);
  state.joinError=msg; state.mode="local"; state.online=false; state.myIdx=null; state.phase="setup"; render();
}
async function joinRoomFlow(){
  const name=(state.joinName||"").trim();
  const room=FIXED_ROOM;
  if(!name){state.joinError="Enter your name first.";render();return;}
  state.joinError="Connecting…"; render();
  try{ localStorage.setItem("cf_room",room); localStorage.setItem("cf_name",name); }catch(e){}
  try{
    await loadPeerJS();
  }catch(e){
    joinFail("Couldn't load the networking library — continuing locally on this device."); return;
  }
  const hostId="cashflow-ratrace-"+room;
  state.room=room; state.myName=name;
  clearTimeout(connectTimer);
  connectTimer=setTimeout(()=>{
    if(!state.online) joinFail("Timed out reaching the lobby (network may be blocking it) — continuing locally on this device.");
  },15000);
  // Try to become the host by claiming the room's fixed peer id.
  const hostPeer=new Peer(hostId,{debug:1,config:ICE_CONFIG});
  let settled=false;
  hostPeer.on("open",()=>{
    if(settled) return; settled=true; clearTimeout(connectTimer);
    peer=hostPeer; state.isHost=true; state.online=true; state.mode="online"; state.joinError="";
    state.numPlayers=2; state.names=["",""]; state.profs=[0,0]; state.ready=[false,false]; state.players=[]; state.turn=0; state.pending=null; state.log=[]; state.listings=[]; state.listingSeq=1; state.phase="setup";
    state.names[0]=name; state.myIdx=0;
    peer.on("connection",conn=>{
      hostConns[conn.peer]=conn;
      conn.on("data",msg=>{
        if(!msg) return;
        if(msg.type==="hello"){
          const idx=claimSeatOnHost(msg.name);
          conn.__idx=idx;
          conn.send({type:"welcome",myIdx:idx});
          pushState();
        }else if(msg.type==="state"){
          applyShared(msg.data);
          broadcastExcept(msg,conn.peer);
          render();
        }
      });
      conn.on("close",()=>{ delete hostConns[conn.peer]; });
    });
    render();
  });
  hostPeer.on("error",err=>{
    if(settled) return;
    if(err&&err.type==="unavailable-id"){
      settled=true; clearTimeout(connectTimer);
      try{hostPeer.destroy();}catch(e){}
      // Someone is already hosting this room — join as a guest instead.
      const guestPeer=new Peer(undefined,{debug:1,config:ICE_CONFIG});
      let guestSettled=false;
      const guestTimer=setTimeout(()=>{ if(!guestSettled){ guestSettled=true; joinFail("Couldn't connect to the host (network may be blocking the connection) — continuing locally on this device."); } },15000);
      guestPeer.on("open",()=>{
        peer=guestPeer;
        const conn=guestPeer.connect(hostId,{reliable:true});
        hostConn=conn;
        conn.on("open",()=>{ conn.send({type:"hello",name:name}); });
        conn.on("data",msg=>{
          if(!msg) return;
          if(msg.type==="welcome"){
            if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); }
            state.myIdx=msg.myIdx; state.isHost=false; state.online=true; state.mode="online"; state.joinError=""; state.phase="setup";
            render();
          }else if(msg.type==="state"){
            applyShared(msg.data); render();
          }
        });
        conn.on("close",()=>{ state.joinError="Lost connection to the host. You can keep playing locally on this device."; state.online=false; render(); });
        conn.on("error",()=>{ if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); joinFail("Couldn't connect to the host — continuing locally on this device."); } });
      });
      guestPeer.on("error",()=>{
        if(!guestSettled){ guestSettled=true; clearTimeout(guestTimer); joinFail("Couldn't reach the lobby — continuing locally on this device."); }
      });
    }else{
      settled=true; clearTimeout(connectTimer);
      joinFail("Couldn't set up online play in this browser — continuing locally on this device.");
    }
  });
}

// Total monthly expenses as on the real game sheet (taxes included) — used for payday, Downsized and the escape check.
function totalExpenses(p){return p.taxes+p.otherExp+p.mortgagePmt+p.carPmt+p.ccPmt+p.retailPmt+p.kids*p.childExp+p.bankLoanPmt;}
// ---- Property cash flow ----
// A property mortgage costs balance × the shared mortgage rate (annual %, moved by events) ÷ 12 each
// month, and a property's cash flow is its rent minus that payment. Paying a mortgage down therefore
// lowers its payment — the game shows the numbers but never spells that out.
const MORTGAGE_RATE0=7, MORTGAGE_RATE_MIN=2, MORTGAGE_RATE_MAX=12;
// Each game starts at a random mortgage rate between 5.5% and 7.5%.
function startMortgageRate(){return Math.round(rnd(5.5,7.5)*10)/10;}
// Every property offer comes with its own terms, like the real game's deal cards:
//  - down payment: bell curve around 10% (0–30%). Low or zero down = bigger mortgage, so the cash flow
//    is small or negative from day one.
//  - running costs (property tax, insurance, repairs): bell curve around 26% of rent (10–42%). Some
//    buildings are cheap to run, some are money pits.
function pickDownPct(){return Math.round(Math.max(0,Math.min(30,10+8*randn())));}
function pickCostPct(){return Math.round(Math.max(10,Math.min(42,26+8*randn())));}
function costsFor(m,qty,costPct){return Math.round((m.rent||0)*qty*(costPct==null?25:costPct)/100);}
// Running costs on what a player owns: p.reCostPct[id] is the unit-weighted average of the costs
// they bought into; it follows the current rent, so rent events move costs too.
function propCosts(p,m){return costsFor(m,p.holdings[m.id]||0,(p.reCostPct||{})[m.id]);}
function mortgageRate(){return state.mortgageRate||MORTGAGE_RATE0;}
function mortgagePmtFor(bal){return Math.round(bal*mortgageRate()/100/12);}
function propMortgagePmt(p,id){return mortgagePmtFor(((p.reMortgage||{})[id])||0);}
function propNet(p,m){const q=p.holdings[m.id]||0; return q*(m.rent||0)-propCosts(p,m)-propMortgagePmt(p,m.id);}
// Passive income: dividends from stocks + each property's rent minus its mortgage payment.
function passiveIncome(p){return MARKET.reduce((s,m)=>s+(m.type==="realestate"?propNet(p,m):(p.holdings[m.id]||0)*(m.div||0)),0);}
// Change in monthly passive income from buying qty units at `price` (for the bank's lending check).
function incomeDeltaBuy(m,qty,price,downPct,costPct){
  if(m.type!=="realestate") return qty*(m.div||0);
  const cost=price*qty; return qty*(m.rent||0)-costsFor(m,qty,costPct)-mortgagePmtFor(cost-reDown(cost,downPct));
}
function incomeDeltaSell(p,m,qty){
  if(m.type!=="realestate") return -qty*(m.div||0);
  return -(qty*(m.rent||0)-costsFor(m,qty,(p.reCostPct||{})[m.id])-mortgagePmtFor(mortgageShare(p,m.id,qty)));
}
function payCash(p,amt){
  p.cash-=amt;
  if(p.cash<0){
    const need=Math.ceil(-p.cash/1000)*1000;
    p.bankLoanBal+=need; p.bankLoanPmt=Math.round(p.bankLoanBal*0.1);
    p.cash+=need;
    log(p.name+" took a "+fmt(need)+" bank loan to cover expenses.");
  }
}
function log(m){state.log.unshift(m); if(state.log.length>40)state.log.pop();}

// ---- Bills you can't refuse, fire sale and bankruptcy ----
// payBill() is for mandatory costs (doodads, Downsized, negative paydays, lawsuits, theft). In order:
//  1. pay from cash;
//  2. borrow what the bank will lend (only while monthly cash flow stays >= $0);
//  3. fire sale: stocks at market price, then properties at 50% of market value (worst cash flow
//     first; the bank takes the mortgage out of the proceeds and forgives any shortfall);
//  4. if still short with nothing left to sell: negative cash flow = bankrupt (out of the game);
//     otherwise an emergency bank loan covers the rest.
const FIRE_SALE_RE=0.5;
function payBill(p,amt,what){
  if(p.bankrupt) return;
  if(p.cash>=amt){ p.cash-=amt; return; }
  const lim=loanCheck(p,0,0).max;
  if(lim>0){
    const L=Math.min(lim,Math.ceil((amt-p.cash)/1000)*1000);
    p.bankLoanBal+=L; p.bankLoanPmt=Math.round(p.bankLoanBal*0.1); p.cash+=L;
    log(p.name+" took a "+fmt(L)+" bank loan to cover "+what+".");
    if(p.cash>=amt){ p.cash-=amt; return; }
  }
  const lines=fireSale(p,amt-p.cash);
  if(p.cash>=amt){
    p.cash-=amt;
    raiseAlert("🔥 Fire sale — "+p.name,[p.name+" couldn't cover "+what+" ("+fmt(amt)+") and the bank wouldn't lend more, so assets were sold:",...lines]);
    return;
  }
  if(monthlyCashflow(p)<0){ goBankrupt(p,what,amt,lines); return; }
  payCash(p,amt);
  log("🏦 Emergency loan: "+p.name+" had nothing left to sell, so the bank covered "+what+".");
  if(lines.length) raiseAlert("🔥 Fire sale — "+p.name,[p.name+" couldn't cover "+what+" ("+fmt(amt)+"), so assets were sold:",...lines,"The bank covered the rest with an emergency loan."]);
}
function fireSellable(p){return MARKET.some(m=>(p.holdings[m.id]||0)>0);}
// Removes units from a holding and keeps all per-holding bookkeeping (mortgage, cost basis, buy marks,
// running costs, flash-deal locks) consistent. Returns the mortgage share that went with them.
function removeUnits(p,m,qty){
  const held=p.holdings[m.id]||0, payoff=mortgageShare(p,m.id,qty);
  if(p.costBasis&&p.costBasis[m.id]) p.costBasis[m.id]-=Math.round(p.costBasis[m.id]*qty/held);
  if(payoff) p.reMortgage[m.id]-=payoff;
  p.holdings[m.id]=held-qty;
  let over=lockedQty(p,m.id)-p.holdings[m.id];
  if(over>0&&p.locks&&p.locks[m.id]) p.locks[m.id]=p.locks[m.id].map(l=>{const cut=Math.min(l.qty,over); over-=cut; return {...l,qty:l.qty-cut};}).filter(l=>l.qty>0);
  if(!p.holdings[m.id]){ ['reMortgage','costBasis','buyMarks','reCostPct','locks'].forEach(k=>{ if(p[k]) delete p[k][m.id]; }); }
  return payoff;
}
function fireSale(p,need){
  const lines=[];
  // Stocks first, whole shares, just enough to cover what's needed.
  MARKET.filter(m=>m.type==="stock"&&(p.holdings[m.id]||0)>0).sort((a,b)=>b.price*p.holdings[b.id]-a.price*p.holdings[a.id]).forEach(m=>{
    if(need<=0) return;
    const qty=Math.min(p.holdings[m.id],Math.ceil(need/m.price)), got=qty*m.price;
    removeUnits(p,m,qty); p.cash+=got; need-=got;
    lines.push("📈 Sold "+qty+"x "+m.name+" at "+fmt(m.price)+" = "+fmt(got));
  });
  // Then properties at half value, worst cash flow per unit first.
  const props=()=>MARKET.filter(m=>m.type==="realestate"&&(p.holdings[m.id]||0)>0).sort((a,b)=>propNet(p,a)/p.holdings[a.id]-propNet(p,b)/p.holdings[b.id]);
  while(need>0&&props().length){
    const m=props()[0], sale=Math.round(m.price*FIRE_SALE_RE), payoff=removeUnits(p,m,1), got=Math.max(0,sale-payoff);
    p.cash+=got; need-=got;
    lines.push("🏠 Sold "+m.name+" at half value "+fmt(sale)+" − mortgage "+fmt(payoff)+" = "+fmt(got)+(sale<payoff?" (bank forgave the rest)":""));
  }
  lines.forEach(l=>log("🔥 "+p.name+": "+l.replace(/^\S+ /,"")));
  return lines;
}
function goBankrupt(p,what,amt,lines){
  p.bankrupt=true; p.cash=0;
  const n=state.players.length, gone=state.players.filter(x=>x.bankrupt&&x!==p).length;
  p.place=n-gone; p.finishWeek=state.week||0;
  log("💀 "+p.name+" is BANKRUPT — couldn't pay "+what+" with negative cash flow and nothing left to sell. Out of the game (#"+p.place+").");
  raiseAlert("💀 "+p.name+" is bankrupt",[...(lines.length?[p.name+"'s assets were sold in a fire sale:",...lines]:[]),"It still wasn't enough to cover "+what+" ("+fmt(amt)+"), the cash flow is negative and the bank won't lend more.",p.name+" is out of the game and finishes #"+p.place+"."]);
  checkGameOver();
}

// ---- Places ----
// Escaping the Rat Race takes the next free place from the top; going bankrupt takes the next free
// place from the bottom. The game ends when at most one player is still racing (they take the last
// open place).
function isRacing(p){return !p.escaped&&!p.bankrupt;}
function checkWin(p){
  if(isRacing(p) && passiveIncome(p)>=totalExpenses(p)){
    p.escaped=true;
    p.place=state.players.filter(x=>x.escaped).length; p.finishWeek=state.week||0;
    const medal=["🥇","🥈","🥉"][p.place-1]||"🏁";
    log(medal+" "+p.name+" escaped the Rat Race"+(p.place===1?" and WINS!":" — finishes #"+p.place+".")+" Passive income now covers all expenses.");
    raiseAlert(medal+" "+p.name+(p.place===1?" wins!":" finishes #"+p.place),[p.name+" escaped the Rat Race: passive income "+fmt(passiveIncome(p))+"/mo now covers expenses of "+fmt(totalExpenses(p))+"/mo.",p.place===1?"Everyone else keeps playing for the other places.":""].filter(Boolean));
    checkGameOver();
  }
}
// Rent/dividend/rate events and other players' trades can push anyone over the line, not just the
// player whose turn it is.
function checkAllWins(){state.players.forEach(checkWin);}
function checkGameOver(){
  const racing=state.players.filter(isRacing);
  if(state.phase!=="playing"||racing.length>1) return;
  racing.forEach(p=>{
    const taken=new Set(state.players.map(x=>x.place).filter(Boolean));
    let pl=1; while(taken.has(pl)) pl++;
    p.place=pl; p.finishWeek=state.week||0;
    log("🏁 "+p.name+" is the last one in the Rat Race and finishes #"+pl+".");
  });
  state.phase="over"; state.pending=null;
  log("🏁 Game over! Final standings are in.");
}
// Shared announcements (fire sale, bankruptcy, a win). Everyone sees them once; each browser
// dismisses them locally (state.alertSeen), so one player closing it doesn't hide it for others.
function raiseAlert(title,lines){state.alert={id:(state.alert&&state.alert.id||0)+1,title,lines};}
function dismissAlert(){state.alertSeen=state.alert&&state.alert.id; render();}
function alertHTML(){
  const a=state.alert; if(!a||state.alertSeen===a.id) return "";
  return `<div class="confirm-backdrop" onclick="if(event.target===this)dismissAlert()">
    <div class="confirm-card alert-card" role="dialog" aria-modal="true">
      <h3 style="margin-bottom:8px;">${a.title}</h3>
      ${a.lines.map(l=>`<p class="alert-line">${l}</p>`).join("")}
      <div class="confirm-actions"><button class="primary" onclick="dismissAlert()">OK</button></div>
    </div>
  </div>`;
}


function setPlayers(n){
  if(state.online&&!state.isHost) return;
  const oldNames=state.names||[], oldProfs=state.profs||[], oldReady=state.ready||[];
  state.numPlayers=n;
  state.names=Array(n).fill("").map((_,i)=>oldNames[i]||"");
  state.profs=Array(n).fill(0).map((_,i)=>oldProfs[i]!=null?oldProfs[i]:0);
  state.ready=Array(n).fill(false).map((_,i)=>oldReady[i]||false);
  if(state.online){ if(state.myIdx!=null&&state.myIdx<n) state.names[state.myIdx]=state.myName; pushState(); }
  render();
}
// Standard normal sample (Box–Muller), clamped to ±3σ so one week can't produce absurd moves.
function randn(){
  let u=0,v=0;
  while(u===0) u=Math.random();
  while(v===0) v=Math.random();
  const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return Math.max(-3,Math.min(3,z));
}
// One week of price movement: a log-normal step (normally distributed % return) with σ = vol/√3,
// the same average swing size as the old uniform ±vol, so small moves are common and big ones rare.
// A gentle pull toward the anchor price keeps prices wandering without drifting to $1 or the moon.
function priceStep(price,vol,anchor){
  const sigma=vol/Math.sqrt(3);
  const pull=0.05*Math.log(anchor/price);
  return price*Math.exp(pull-sigma*sigma/2+sigma*randn());
}
function genHistory(endPrice,vol,points){
  let price=endPrice;
  const arr=[];
  for(let i=0;i<points;i++){
    arr.unshift(Math.round(price));
    price=Math.max(priceStep(price,vol,endPrice),endPrice*0.15);
  }
  arr[arr.length-1]=Math.round(endPrice);
  return arr;
}
function updateMarket(){
  state.week=(state.week||0)+1;
  MARKET.forEach(m=>{
    m.prevPrice=m.price;
    m.price=Math.max(Math.round(priceStep(m.price,m.vol,m.anchor||m.basePrice0)),Math.round(m.basePrice0*0.15),1);
    m.high52=Math.max(m.high52||m.price,m.price);
    m.low52=Math.min(m.low52||m.price,m.price);
    m.history.push(m.price);
    if(m.history.length>15) m.history.shift();
  });
}
// Listing price vs market value, bell-curved so offers aren't always bargains: FOR SALE centres on the
// 1% under market value (±9%), WANTED buyers on 5% above it (±8%) — sometimes a buyer lowballs you.
function listingPriceFactor(kind){
  return kind==="ask"?Math.max(0.8,Math.min(1.2,0.99+0.09*randn())):Math.max(0.9,Math.min(1.3,1.05+0.08*randn()));
}
function spawnListing(){
  const pool=MARKET.filter(m=>m.type==="realestate");
  const m=pool[Math.floor(Math.random()*pool.length)];
  const kind=Math.random()<0.6?"ask":"bid";
  const qty=1;
  const price=Math.round(m.price*listingPriceFactor(kind));
  const turnsLeft=2+Math.floor(Math.random()*3);
  state.listings.push({id:"L"+(state.listingSeq++),instId:m.id,kind,price,qty,turnsLeft,downPct:pickDownPct(),costPct:pickCostPct()});
}
function tickListings(){
  // Pacing (tuned by bot simulation for ~30-minute games): each week an offer may get snapped up by
  // someone else (30%), and about 1.5 new offers appear.
  state.listings.forEach(l=>{
    l.turnsLeft--;
    if(Math.random()<0.3) l.qty=0;
  });
  state.listings=state.listings.filter(l=>l.qty>0&&l.turnsLeft>0);
  const maxListings=10;
  let tries=(Math.random()<0.9?1:0)+(Math.random()<0.6?1:0);
  for(let i=0;i<tries&&state.listings.length<maxListings;i++) spawnListing();
}
function startGame(){
  if(state.online&&!state.isHost) return;
  MARKET.forEach(m=>{
    // Reset every instrument (real estate too), so a new game never inherits the last game's prices.
    m.price=m.type==="stock"?Math.max(1,Math.round(m.designPrice*Math.exp(0.18*randn()))):m.designPrice;
    m.basePrice0=m.price; m.anchor=m.price; m.rent=m.designRent; m.div=m.designDiv;
    m.history=genHistory(m.price,m.vol,15);
    m.prevPrice=m.history[m.history.length-2];
    m.high52=Math.max(...m.history);
    m.low52=Math.min(...m.history);
  });
  state.qty={}; state.flashQty=1; state.listings=[]; state.listingSeq=1; state.loanTakeAmt=1000; state.loanPayAmt=1000; state.selectedStock=null;
  MARKET.forEach(m=>{state.qty[m.id]=1;});
  for(let i=0;i<4;i++) spawnListing();
  state.players=state.names.map((nm,i)=>{
    const pr=PROFESSIONS[Math.floor(Math.random()*PROFESSIONS.length)];
    return {...pr,profession:pr.name,name:nm.trim()||("Player "+(i+1)),cash:pr.savings,kids:0,holdings:{},bankLoanBal:0,bankLoanPmt:0,pos:0,escaped:false,bankrupt:false,place:null,color:COLORS[i]};
  });
  state.phase="playing"; state.alert=null; state.week=0; state.mortgageRate=startMortgageRate(); state.turn=0; state.pending=null; state.hasRolled=false; state.log=[]; state.viewTab=0;
  log("Game started. "+state.players[0].name+" goes first. Market is open.");
  if(state.online) pushState();
  render();
}
function activePlayers(){return state.players.filter(isRacing);}
function syncRender(){ if(state.online) pushState(); render(); }
const DOWNSIZED_SKIPS=2;
// Flash-deal lock-up: units bought at a flash-deal discount can't be sold for the buyer's next 3 turns, so
// the discount is a bet on where the price goes, not an instant flip. p.turnsTaken counts the player's turns
// (skipped ones too); p.locks[id] = [{qty, until: turnsTaken value when they unlock}].
const FLASH_LOCK_TURNS=3;
function activeLocks(p,id){const t=p.turnsTaken||0; return ((p.locks||{})[id]||[]).filter(l=>l.until>t);}
function lockedQty(p,id){return activeLocks(p,id).reduce((s,l)=>s+l.qty,0);}
function lockTurnsLeft(p,id){const ls=activeLocks(p,id); return ls.length?Math.min(...ls.map(l=>l.until))-(p.turnsTaken||0):0;}
function sellableQty(p,id){return Math.max(0,(p.holdings[id]||0)-lockedQty(p,id));}
function addLock(p,id,qty){p.locks=p.locks||{}; p.locks[id]=[...activeLocks(p,id),{qty,until:(p.turnsTaken||0)+FLASH_LOCK_TURNS}];}
function nextTurn(){
  updateMarket();
  tickListings();
  state.hasRolled=false;
  checkAllWins(); checkGameOver();
  if(state.phase!=="playing"){ syncRender(); return; }
  // Downsized players sit out their skipped turns (each skip uses one up), like the original game.
  for(;;){
    do{ state.turn=(state.turn+1)%state.players.length; }while(!isRacing(state.players[state.turn]));
    const np=state.players[state.turn];
    np.turnsTaken=(np.turnsTaken||0)+1;
    if(!(np.skipTurns>0)) break;
    np.skipTurns--;
    log("⚠️ "+np.name+" is downsized and sits out this turn"+(np.skipTurns?" ("+np.skipTurns+" more to go).":" — back next round."));
  }
  state.pending=null; syncRender();
}
function endTurn(){
  if(state.online&&state.myIdx!==state.turn) return;
  if(state.pending||!state.hasRolled) return;
  nextTurn();
}
// n = number of dice. Two dice are only allowed while the player has charity turns left; every
// roll (1 or 2 dice) during that window uses one of them up.
function rollDice(n){
  if(state.online&&state.myIdx!==state.turn) return;
  if(state.hasRolled||state.pending) return;
  const p=state.players[state.turn];
  const charity=(p.charityTurns||0)>0;
  n=n===2&&charity?2:1;
  const dice=Array.from({length:n},()=>1+Math.floor(Math.random()*6));
  const roll=dice.reduce((a,b)=>a+b,0);
  if(charity) p.charityTurns--;
  // Real-game rule: you're paid whenever you pass a Payday square, not only when you land on one
  // (landing is handled by resolveSpace).
  for(let s=1;s<roll;s++){ if(BOARD[(p.pos+s)%BOARD.length]==="payday") collectPayday(p,true); }
  p.pos=(p.pos+roll)%BOARD.length;
  const sp=BOARD[p.pos];
  log(p.name+" rolled "+(n===2?dice.join(" + ")+" = "+roll:"a "+roll)+" -> landed on "+sp+"."+(charity?" ("+p.charityTurns+" charity turn"+(p.charityTurns===1?"":"s")+" left)":""));
  state.hasRolled=true;
  resolveSpace(p,sp);
  syncRender();
}
// A negative cash flow is a bill you can't refuse: it comes out of cash, and can trigger a fire sale.
function collectPayday(p,passing){
  if(!isRacing(p)) return;
  const inc=Math.round(monthlyCashflow(p));
  log(p.name+(passing?" passes":" lands on")+" Payday: "+(inc>=0?"collects "+fmt(inc)+" net cash flow.":"negative cash flow, pays "+fmt(-inc)+"."));
  if(inc>=0) p.cash+=inc; else payBill(p,-inc,"a negative payday");
  checkWin(p);
}
// Landing on a space resolves its effect but no longer auto-advances the turn — the market
// stays open to everyone at all times, and the current player ends their own turn explicitly
// (via the End Turn button) once they're done rolling/trading, so nobody gets cut off mid-turn.
function resolveSpace(p,sp){
  if(sp==="payday"){
    collectPayday(p,false);
  }else if(sp==="doodad"){
    const d=DOODADS[Math.floor(Math.random()*DOODADS.length)];
    payBill(p,d.cost,"a doodad ("+d.name+")");
    log(p.name+" hit a doodad: "+d.name+" ("+fmt(d.cost)+").");
  }else if(sp==="downsized"){
    const loss=totalExpenses(p);
    payBill(p,loss,"a month of expenses after being downsized");
    p.skipTurns=DOWNSIZED_SKIPS;
    log(p.name+" got downsized! Paid "+fmt(loss)+" in expenses and loses the next "+DOWNSIZED_SKIPS+" turns.");
    checkWin(p);
  }else if(sp==="baby"){
    if(p.kids<3){p.kids++; log(p.name+" had a baby! Monthly expenses up "+fmt(p.childExp)+".");}
    else log(p.name+" landed on Baby but already has 3 kids.");
    checkWin(p);
  }else if(sp==="charity"){
    state.pending={kind:"charity",p};
  }else if(sp==="market"){
    const m=MARKET[Math.floor(Math.random()*MARKET.length)];
    // Offer price vs market follows a bell curve centred on an 8% discount (σ 12%, clamped −20%…+35%):
    // about 3 in 4 offers are bargains, the rest fair or overpriced. The game never says which — the player has to compare with the market.
    const discountPct=Math.round(Math.max(-20,Math.min(35,8+12*randn())));
    const dealPrice=Math.max(1,Math.round(m.price*(1-discountPct/100)));
    const qtyMax=m.type==="stock"?null:1;
    state.flashQty=1;
    state.pending={kind:"flashdeal",p,id:m.id,dealPrice,qtyMax,downPct:m.type==="realestate"?pickDownPct():null,costPct:m.type==="realestate"?pickCostPct():null};
  }else if(sp==="event"){
    const ev=pickEvent();
    const desc=ev.run(state.players,p);
    log("🎲 Event — "+ev.name+": "+desc);
    checkAllWins();
    state.pending={kind:"eventinfo",ev:{name:ev.name,desc}};
  }
}
// Real-game rule: donate 10% of total income (salary + passive) to roll 1 or 2 dice for 3 turns.
const CHARITY_TURNS=3;
function charityAmount(p){return Math.round((p.salary+passiveIncome(p))*0.1);}
// pending.p is a serialized copy once state has gone over the network, so always act on the
// real entry in state.players.
function charityPay(ok){
  if(state.online&&state.myIdx!==state.turn) return;
  if(!state.pending||state.pending.kind!=="charity") return;
  const p=state.players[state.turn];
  const amt=charityAmount(p);
  if(!ok&&askLoanConfirm(state.turn,{title:"Donate "+fmt(amt)+" to charity",due:amt,confirmLabel:"Donate anyway",run:()=>charityPay(true)})) return;
  payCash(p,amt);
  p.charityTurns=CHARITY_TURNS;
  log(p.name+" donated "+fmt(amt)+" to charity — may roll 1 or 2 dice for the next "+CHARITY_TURNS+" turns.");
  state.pending=null; checkWin(p); syncRender();
}
function charitySkip(){if(state.online&&state.myIdx!==state.turn)return;log(state.pending.p.name+" skipped charity.");state.pending=null;syncRender();}
function continueEvent(){if(state.online&&state.myIdx!==state.turn)return;state.pending=null; syncRender();}
function setFlashQty(v,rerender){
  if(!state.pending||state.pending.kind!=="flashdeal") return;
  state.flashQty=Math.max(1,Math.min(state.pending.qtyMax||Infinity,parseInt(v)||1));
  // While typing, refresh only the preview so the input keeps focus.
  if(rerender) render(); else { const el=document.getElementById("flash-preview"); if(el) el.innerHTML=flashPreviewHTML(); }
}
// Most units the player can pay for from cash alone (no loan).
function flashMaxCash(){
  const pd=state.pending, p=state.players[state.turn], m=MARKET.find(x=>x.id===pd.id);
  const unit=cashDue(m,pd.dealPrice,pd.downPct);
  return Math.max(1,Math.min(pd.qtyMax||Infinity,Math.floor(Math.max(0,p.cash)/Math.max(1,unit))));

// Live cost preview for the flash deal: total, what comes out of cash, any bank loan and the bank's verdict.

  return row(qty+" × "+fmt(pd.dealPrice),fmt(cost),"fp-total")
    +(m.type==="realestate"?row("Cash down ("+pd.downPct+"%)",fmt(due))+row("Mortgage ("+(100-pd.downPct)+"%)",fmt(mort))+row("Rent",fmt(qty*m.rent)+"/mo")+row("Running costs ("+pd.costPct+"% of rent)","−"+fmt(costsFor(m,qty,pd.costPct))+"/mo")+row("Mortgage payment ("+mortgageRate().toFixed(1)+"%)","−"+fmt(mortgagePmtFor(mort))+"/mo")+row("Cash flow",sgn(cfl)+"/mo",cfl<0?"fp-bad":""):"")
    +row("From your cash",fmt(due-loan)+" of "+fmt(p.cash))
    +(loan?row("Bank loan needed",fmt(loan),chk.ok?"fp-warn":"fp-bad"):"")

function buyFlashDeal(ok){
  if(state.online&&state.myIdx!==state.turn) return;

  const due=cashDue(m,pd.dealPrice*qty,pd.downPct);
  if(!ok&&askLoanConfirm(state.turn,{title:"Flash deal: "+qty+"x "+m.name,due,incomeDelta:incomeDeltaBuy(m,qty,pd.dealPrice,pd.downPct,pd.costPct),confirmLabel:"Buy with loan",run:()=>buyFlashDeal(true)})) return;
  const note=buyAsset(p,m,qty,pd.dealPrice,pd.downPct,pd.costPct);

function passFlash(){if(state.online&&state.myIdx!==state.turn)return;log(state.pending.p.name+" passed on the flash deal.");state.pending=null;syncRender();}
function actingIdx(){ return state.online?state.myIdx:state.turn; }

// ---- Buying & selling assets ----
// Real estate works like the board game: you pay the offer's down payment in cash and the rest becomes a
// mortgage on that property (a liability with no monthly payment — the rent is its net cash flow).
// When sold, that property's share of the mortgage is paid off out of the sale and you keep the rest.
// p.reMortgage = {propertyId: total mortgage balance across the units held}.
function sgn(v){return (v>=0?"+":"−")+fmt(Math.abs(v));}
function reDown(cost,downPct){return Math.round(cost*(downPct==null?10:downPct)/100);}
function reMortgageTotal(p){return Object.values(p.reMortgage||{}).reduce((a,b)=>a+b,0);}
function cashDue(m,cost,downPct){return m.type==="realestate"?reDown(cost,downPct):cost;}
function mortgageShare(p,id,qty){
  const held=p.holdings[id]||0, bal=(p.reMortgage||{})[id]||0;
  return held?Math.round(bal*Math.min(qty,held)/held):0;
}
// Every purchase is recorded for the statement's "My Holdings" charts: p.costBasis[id] is the total
// price paid for the units still held (average-cost), p.buyMarks[id] the recent buys as {w:week,price}.
function recordBuy(p,id,qty,price){
  p.costBasis=p.costBasis||{}; p.buyMarks=p.buyMarks||{};
  p.costBasis[id]=(p.costBasis[id]||0)+price*qty;
  p.buyMarks[id]=[...(p.buyMarks[id]||[]),{w:state.week||0,price}].slice(-10);
}
function buyAsset(p,m,qty,price,downPct,costPct){
  const cost=price*qty;
  recordBuy(p,m.id,qty,price);
  if(m.type!=="realestate"){ payCash(p,cost); p.holdings[m.id]=(p.holdings[m.id]||0)+qty; return " ("+fmt(cost)+")."; }
  const down=reDown(cost,downPct), mort=cost-down;
  payCash(p,down);
  p.reMortgage=p.reMortgage||{}; p.reMortgage[m.id]=(p.reMortgage[m.id]||0)+mort;
  const held=p.holdings[m.id]||0, cp=costPct==null?25:costPct;
  p.reCostPct=p.reCostPct||{}; p.reCostPct[m.id]=held?((p.reCostPct[m.id]==null?25:p.reCostPct[m.id])*held+cp*qty)/(held+qty):cp;
  p.holdings[m.id]=(p.holdings[m.id]||0)+qty;
  return " — "+fmt(down)+" down ("+(downPct==null?10:downPct)+"%), "+fmt(mort)+" mortgage.";
}
// If a property sells for less than its mortgage, the shortfall comes out of cash (auto-loan if needed).
function sellAsset(p,m,qty,price){
  const sale=price*qty, payoff=mortgageShare(p,m.id,qty);
  if(p.costBasis&&p.costBasis[m.id]) p.costBasis[m.id]-=Math.round(p.costBasis[m.id]*qty/p.holdings[m.id]);
  p.cash+=sale; p.holdings[m.id]-=qty;
  if(!p.holdings[m.id]){ if(p.costBasis) delete p.costBasis[m.id]; if(p.buyMarks) delete p.buyMarks[m.id]; }
  if(payoff){ p.reMortgage[m.id]-=payoff; payCash(p,payoff); }
  if(!p.holdings[m.id]&&p.reMortgage) delete p.reMortgage[m.id];
  if(!p.holdings[m.id]&&p.reCostPct) delete p.reCostPct[m.id];
  return payoff?" — "+fmt(sale)+" sale, "+fmt(payoff)+" mortgage paid off, "+(sale>=payoff?fmt(sale-payoff)+" to you.":"you cover the "+fmt(payoff-sale)+" shortfall."):" ("+fmt(sale)+").";
}
function buyListing(id,ok){
  const p=state.players[actingIdx()], l=state.listings.find(x=>x.id===id);
  if(!p||!isRacing(p)||!l||l.kind!=="ask"){return;}
  const m=MARKET.find(x=>x.id===l.instId);
  const buyQty=l.qty, due=cashDue(m,buyQty*l.price,l.downPct);
  if(!ok&&askLoanConfirm(actingIdx(),{title:"Buy "+buyQty+"x "+m.name+" @ "+fmt(l.price),due,incomeDelta:incomeDeltaBuy(m,buyQty,l.price,l.downPct,l.costPct),confirmLabel:"Buy with loan",run:()=>buyListing(id,true)})) return;
  const note=buyAsset(p,m,buyQty,l.price,l.downPct,l.costPct); l.qty=0;
  log(p.name+" grabbed "+buyQty+"x "+m.name+" off the floor @ "+fmt(l.price)+note);
  checkWin(p);
  state.listings=state.listings.filter(x=>x.qty>0);
  syncRender();
}
function sellListing(id,ok){
  const p=state.players[actingIdx()], l=state.listings.find(x=>x.id===id);
  if(!p||!isRacing(p)||!l||l.kind!=="bid"){return;}
  const m=MARKET.find(x=>x.id===l.instId);
  const sellQty=Math.min(l.qty,sellableQty(p,l.instId));
  if(sellQty<=0){log(p.name+(p.holdings[l.instId]?"'s "+m.name+" is locked from a flash deal for "+lockTurnsLeft(p,l.instId)+" more turn(s).":" has none of "+m.name+" to sell into that request."));}
  else{
    const shortfall=mortgageShare(p,m.id,sellQty)-sellQty*l.price;
    if(!ok&&askLoanConfirm(actingIdx(),{title:"Sell "+m.name+" below its mortgage",due:shortfall,incomeDelta:incomeDeltaSell(p,m,sellQty),confirmLabel:"Sell anyway",run:()=>sellListing(id,true)})) return;
    const note=sellAsset(p,m,sellQty,l.price); l.qty-=sellQty;
    log(p.name+" sold "+sellQty+"x "+m.name+" into a buy request @ "+fmt(l.price)+note);
  }
  state.listings=state.listings.filter(x=>x.qty>0);
  syncRender();
}

// Updates the live "= $total" under the input directly (no re-render, so typing keeps focus).

function takeLoan(idx,ok){
  if(state.online&&state.myIdx!==idx) return;
  const p=state.players[idx]; if(!p||!isRacing(p)) return;
  const amt=Math.max(1000,Math.round((state.loanTakeAmt||1000)/1000)*1000);
  if(!ok||!loanCheck(p,amt,0).ok){
    state.confirm={idx,title:"Borrow "+fmt(amt)+" from the bank",auto:0,loan:amt,cashDelta:amt,incomeDelta:0,confirmLabel:"Take the loan",run:()=>takeLoan(idx,true)};

function setLoanTakeAmt(v){state.loanTakeAmt=Math.max(1000,Math.round((parseInt(v)||1000)/1000)*1000);}
function setLoanPay(v){state.loanPayAmt=Math.max(1,parseInt(v)||1000);}

// ---- Paying off liabilities ----
// Every liability can be paid down from cash, partly or in full. Personal debts' monthly payments
// shrink in proportion to the balance (paying one off removes that expense); the bank loan stays at
// 10% of balance and is paid in $1,000 steps unless clearing it; property mortgages have no monthly
// payment, so paying one down just means you keep more when the property sells.
const PERSONAL_DEBTS={mortgage:["Home Mortgage","mortgageBal","mortgagePmt"],car:["Car Loan","carBal","carPmt"],cc:["Credit Card","ccBal","ccPmt"],retail:["Retail Debt","retailBal","retailPmt"]};
function debtList(p){
  const list=Object.entries(PERSONAL_DEBTS).map(([key,[name,b,m]])=>({key,name,bal:p[b],pmt:p[m]}));
  list.push({key:"bank",name:"Bank Loan",bal:p.bankLoanBal,pmt:p.bankLoanPmt});
  Object.entries(p.reMortgage||{}).forEach(([id,bal])=>list.push({key:"re:"+id,name:"Mortgage — "+MARKET.find(m=>m.id===id).name,bal,pmt:mortgagePmtFor(bal)}));
  return list.filter(d=>d.bal>0);
}
function selectedDebt(p){const list=debtList(p); return list.find(d=>d.key===state.debtSel)||list[0]||null;}
function selectDebt(key){state.debtSel=key; render();}
function payDebt(idx,all){
  if(state.online&&state.myIdx!==idx) return;
  const p=state.players[idx], d=selectedDebt(p); if(!d) return;
  let amt=all?d.bal:Math.min(state.loanPayAmt||1000,d.bal);
  if(d.key==="bank"&&amt<d.bal) amt=Math.floor(amt/1000)*1000;
  if(amt<=0||amt>p.cash){log(p.name+" doesn't have "+fmt(Math.max(amt,1000))+" cash to pay toward "+d.name+".");render();return;}
  p.cash-=amt;
  if(d.key==="bank"){ p.bankLoanBal-=amt; p.bankLoanPmt=Math.round(p.bankLoanBal*0.1); }
  else if(d.key.startsWith("re:")){ const id=d.key.slice(3); p.reMortgage[id]-=amt; if(p.reMortgage[id]<=0) delete p.reMortgage[id]; }
  else{ const [,b,m]=PERSONAL_DEBTS[d.key]; p[m]=Math.round(p[m]*(p[b]-amt)/p[b]); p[b]-=amt; }
  const saved=d.pmt-(debtList(p).find(x=>x.key===d.key)||{pmt:0}).pmt;
  log(p.name+(amt===d.bal?" paid off their "+d.name+" ("+fmt(amt)+")":" paid "+fmt(amt)+" toward their "+d.name)+(saved>0&&!d.key.startsWith("re:")?" — expenses down "+fmt(saved)+"/mo.":"."));
  checkWin(p); if(state.online) pushState(); render();
}

// ---- Loan confirmation ----
// A choice the player makes never takes a loan silently: if paying `due` cash would dip below $0
// (auto-loan, rounded up to $1,000), show the impact and wait for
// Confirm. state.confirm is local to this browser (never synced); `run` re-runs the action with ok=true.
function monthlyCashflow(p){return p.salary+passiveIncome(p)-totalExpenses(p);}
// Bank lending limit (real-game rule): the bank only lends while your monthly cash flow, after the new
// loan payment (10% of balance), stays at or above $0. incomeDelta = extra monthly income the purchase
// brings (rent/dividends), which counts toward what you can afford. Mandatory costs (doodads,
// Downsized, lawsuits) still borrow automatically via payCash — the limit only applies to choices.
function loanCheck(p,loan,incomeDelta){
  const cf=monthlyCashflow(p)+(incomeDelta||0);
  const cfAfter=L=>cf-(Math.round((p.bankLoanBal+L)*0.1)-p.bankLoanPmt);
  let max=Math.floor((10*(cf+p.bankLoanPmt)-p.bankLoanBal)/1000)*1000;
  while(max>0&&cfAfter(max)<0) max-=1000;
  return {ok:cfAfter(loan)>=0,max:Math.max(0,max),newCf:cfAfter(loan)};
}
function askLoanConfirm(idx,o){
  const p=state.players[idx]; if(!p) return false;
  const auto=p.cash-o.due<0?Math.ceil((o.due-p.cash)/1000)*1000:0;
  if(auto<=0) return false;
  state.confirm={idx,title:o.title,due:o.due,auto,loan:auto,cashDelta:auto-o.due,incomeDelta:o.incomeDelta||0,confirmLabel:o.confirmLabel||"Confirm",run:o.run};
  render(); return true;
}
function confirmYes(){const c=state.confirm; state.confirm=null; if(c&&c.run) c.run(); else render();}
function confirmNo(){state.confirm=null; render();}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&state.confirm) confirmNo(); });
function confirmHTML(){
  const c=state.confirm; if(!c) return "";
  const p=state.players[c.idx]; if(!p){state.confirm=null; return "";}
  const newBal=p.bankLoanBal+c.loan, newPmt=Math.round(newBal*0.1);
  const cf=monthlyCashflow(p), newCf=cf-(newPmt-p.bankLoanPmt)+c.incomeDelta;
  const arrow=(a,b,goodUp)=>{const cls=b===a?"flat":((b>a)===goodUp?"up":"down"); return `${fmt(a)} → <span class="${cls}">${fmt(b)}</span>`;};
  const chk=loanCheck(p,c.loan,c.incomeDelta);
  return `<div class="confirm-backdrop" onclick="if(event.target===this)confirmNo()">
    <div class="confirm-card${chk.ok?"":" denied"}" role="dialog" aria-modal="true">
      <div class="confirm-head">${chk.ok?"🏦 Heads up — this takes a bank loan":"🚫 Loan denied by the bank"}</div>
      <h3 style="margin-bottom:8px;">${c.title}</h3>
      <table>
        ${c.due!=null?`<tr><td>Total to pay now</td><td class="num"><b>${fmt(c.due)}</b></td></tr>
        <tr><td>From your cash</td><td class="num">${fmt(c.due-c.auto)}</td></tr>
        <tr class="big"><td>+ Bank loan for the rest</td><td class="num down">${fmt(c.loan)}</td></tr>
        <tr><td colspan="2" class="muted" style="font-size:11.5px;">You have ${fmt(p.cash)} but need ${fmt(c.due)}. Loans come in $1,000 steps${c.auto-(c.due-p.cash)>0?`, so the extra ${fmt(c.auto-(c.due-p.cash))} stays in your cash`:""}.</td></tr>`
        :`<tr class="big"><td>New bank debt</td><td class="num down">+${fmt(c.loan)}</td></tr>`}
        <tr><td>Loan balance</td><td class="num">${arrow(p.bankLoanBal,newBal,false)}</td></tr>
        <tr><td>Monthly loan payment (10%)</td><td class="num">${arrow(p.bankLoanPmt,newPmt,false)}</td></tr>
        <tr><td>Cash on hand</td><td class="num">${arrow(p.cash,p.cash+c.cashDelta,true)}</td></tr>
        <tr><td>Monthly cash flow</td><td class="num">${arrow(cf,newCf,true)}</td></tr>
      </table>
      ${chk.ok?"":`<div class="confirm-warn">The bank only lends while your monthly cash flow stays at $0 or more after the loan payment. This would leave you at <b>${fmt(newCf)}/mo</b>.<br>${chk.max>0?`Right now you can borrow up to <b>${fmt(chk.max)}</b>${c.incomeDelta?" for this purchase":""}.`:"Right now the bank won't lend you anything — raise your cash flow first (pay off debts or buy income assets)."}</div>`}
      <div class="confirm-actions">
        ${chk.ok?`<button onclick="confirmNo()">Cancel</button>
        <button class="gold" onclick="confirmYes()">${c.confirmLabel}</button>`:`<button class="primary" onclick="confirmNo()">OK</button>`}
      </div>
    </div>
  </div>`;
}

// ---- Charts ----
let chartSeq=0;
function sparklineSVG(history,w,h){
  w=w||640; h=h||190;
  if(!history||history.length<2) return "";
  const compact=h<80, n=history.length;
  const min=Math.min(...history), max=Math.max(...history);
  const span=(max-min)||Math.max(1,max*0.05);
  const lo=min-span*0.1, hi=max+span*0.1;
  const padL=compact?2:48, padR=compact?6:64, padT=compact?4:12, padB=compact?4:24;
  const iw=w-padL-padR, ih=h-padT-padB;
  const x=i=>padL+i*iw/(n-1);
  const y=v=>padT+ih-(v-lo)/(hi-lo)*ih;
  const first=history[0], cur=history[n-1];
  const up=cur>=first;
  const col=up?"#1f9d6e":"#d1453b";
  const id="cg"+(++chartSeq);
  const line=history.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const area=line+`L${x(n-1).toFixed(1)},${padT+ih}L${padL},${padT+ih}Z`;
  const defs=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  const startLine=`<line x1="${padL}" x2="${padL+iw}" y1="${y(first).toFixed(1)}" y2="${y(first).toFixed(1)}" stroke="currentColor" stroke-opacity=".4" stroke-dasharray="4 4"/>`;
  const lastDot=`<circle cx="${x(n-1).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="${compact?5:9}" fill="${col}" fill-opacity=".2"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="${compact?2.5:4}" fill="${col}" stroke="var(--panel)" stroke-width="1.5"/>`;
  if(compact){
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" aria-hidden="true">${defs}${startLine}
      <path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${lastDot}</svg>`;
  }
  // Gridlines + y labels at high / mid / low of the data.
  const ticks=[max,(max+min)/2,min];
  const grid=ticks.map(v=>`<line x1="${padL}" x2="${padL+iw}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="currentColor" stroke-opacity=".12"/>
    <text x="${padL-6}" y="${(y(v)+3.5).toFixed(1)}" font-size="10.5" fill="currentColor" fill-opacity=".6" text-anchor="end">${fmt(v)}</text>`).join("");
  const xl=[[0,(n-1)+"w ago"],[Math.floor((n-1)/2),Math.ceil((n-1)/2)+"w ago"],[n-1,"Now"]];
  const xlabels=xl.map(([i,t],k)=>`<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="10.5" fill="currentColor" fill-opacity=".55" text-anchor="${k===0?"start":k===2?"end":"middle"}">${t}</text>`).join("");
  // Per-week dots (green/red vs the previous week) with hover tooltips.
  const dots=history.map((v,i)=>{
    if(i===n-1) return "";
    const prev=i?history[i-1]:v, d=i?Math.round((v-prev)/prev*1000)/10:0;
    const dc=v>=prev?"#1f9d6e":"#d1453b";
    const label=(i===n-1?"Now":(n-1-i)+"w ago")+": "+fmt(v)+(i?" ("+(d>0?"+":"")+d+"%)":"");
    return `<g><circle class="hit" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"><title>${label}</title></circle><circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${dc}" stroke="var(--panel)" stroke-width="1"/></g>`;
  }).join("");
  const tagY=Math.max(padT+9,Math.min(padT+ih-9,y(cur)));
  const tag=`<rect x="${padL+iw+8}" y="${(tagY-10).toFixed(1)}" width="${padR-10}" height="20" rx="5" fill="${col}"/>
    <text x="${padL+iw+8+(padR-10)/2}" y="${(tagY+4).toFixed(1)}" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">${fmt(cur)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Price history, now ${fmt(cur)}">${defs}${grid}${startLine}
    <path d="${area}" fill="url(#${id})"/>

// Price history of one holding against what the player paid: gold dashed line = average buy price,
// gold dots = individual buys (placed at the week they happened, if still inside the 15-week window).
// Line/fill is green while the price is above the average buy price, red below.
function holdingChartSVG(history,avg,marks){
  if(!history||history.length<2) return "";
  const w=260,h=74,n=history.length,padL=2,padR=4,padT=6,padB=6;
  const markPts=(marks||[]).map(mk=>({i:n-1-((state.week||0)-mk.w),price:mk.price})).filter(mk=>mk.i>=0&&mk.i<n);
  const vals=[...history,avg,...markPts.map(mk=>mk.price)];
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||Math.max(1,max*0.05);
  const lo=min-span*0.08, hi=max+span*0.08, iw=w-padL-padR, ih=h-padT-padB;
  const x=i=>padL+i*iw/(n-1), y=v=>padT+ih-(v-lo)/(hi-lo)*ih;
  const cur=history[n-1], col=cur>=avg?"#1f9d6e":"#d1453b", id="hg"+(++chartSeq);
  const line=history.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)).join("");
  const ya=y(avg).toFixed(1);
  // Shade between the price line and the buy line: the gain (or loss) you're sitting on.
  const area=line+`L${x(n-1).toFixed(1)},${ya}L${padL},${ya}Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Price ${fmt(cur)} vs average buy ${fmt(avg)}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity=".06"/></linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <line x1="${padL}" x2="${padL+iw}" y1="${ya}" y2="${ya}" stroke="#b8860b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${markPts.map(mk=>`<circle cx="${x(mk.i).toFixed(1)}" cy="${y(mk.price).toFixed(1)}" r="3.5" fill="#b8860b" stroke="var(--panel)" stroke-width="1.5"><title>Bought @ ${fmt(mk.price)}</title></circle>`).join("")}
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="3.5" fill="${col}" stroke="var(--panel)" stroke-width="1.5"/>
  </svg>`;
}
function holdingsTrendsHTML(p){

  </div>`;
}
// Tiny trend line for a table cell.
function miniSparkSVG(history){
  if(!history||history.length<2) return "";
  const w=72,h=24,n=history.length, min=Math.min(...history), max=Math.max(...history), r=(max-min)||1;
  const pts=history.map((v,i)=>(i*(w-4)/(n-1)+2).toFixed(1)+","+(h-3-(v-min)/r*(h-6)).toFixed(1)).join(" ");
  const col=history[n-1]>=history[0]?"#1f9d6e":"#d1453b";
  return `<svg class="mini-spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
